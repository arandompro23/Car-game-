<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Night Drive Ultra</title>

<style>
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:#000; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}
#game{position:fixed; inset:0;}
canvas{width:100%; height:100%; display:block;}

.overlay{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  color:#fff; z-index:10;
}
.hidden{display:none}

.btn{
  width:260px; height:64px;
  margin:10px;
  border-radius:22px;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; letter-spacing:2px;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.35);
}
.btn:active{transform:scale(.96)}
.btn.disabled{opacity:.4; pointer-events:none}

.small{width:200px;height:52px;font-size:14px}

#ui{
  position:absolute; top:28px; left:40px; right:40px;
  display:flex; justify-content:space-between;
  pointer-events:none; z-index:5;
}
#score{font-weight:800;font-size:26px}
#credits{font-size:14px;opacity:.8}
</style>
</head>

<body>
<div id="game">
  <div id="ui">
    <div>
      <div id="score">0000</div>
      <div id="credits">CREDITS: 0</div>
    </div>
    <div class="btn small" onclick="togglePause()">II</div>
  </div>

  <!-- MENU -->
  <div id="menu" class="overlay">
    <h1>NIGHT DRIVE</h1>
    <div class="btn" onclick="start()">START</div>
    <div class="btn" onclick="openGarage()">GARAGE</div>
  </div>

  <!-- GARAGE -->
  <div id="garage" class="overlay hidden">
    <h2>GARAGE</h2>
    <div class="btn small" onclick="openCarDetail('sport')">SPORTS</div>
    <div class="btn small" onclick="openCarDetail('suv')">SUV</div>
    <div class="btn small" onclick="openCarDetail('hatch')">HATCH</div>
    <div class="btn small" onclick="openShop()">SHOP</div>
    <div class="btn" onclick="backToMenu()">BACK</div>
  </div>

  <!-- CAR DETAIL -->
  <div id="carDetail" class="overlay hidden">
    <h2 id="carName"></h2>
    <div id="specs" style="line-height:1.6;opacity:.85"></div>
    <div class="btn" onclick="selectCar()">SELECT</div>
    <div class="btn" onclick="openGarage()">BACK</div>
  </div>

  <!-- SHOP -->
  <div id="shop" class="overlay hidden">
    <h2>SHOP</h2>

    <div class="btn small" id="engineBtn" onclick="buy('engine')">
      ENGINE + SPEED (300)
    </div>

    <div class="btn small" id="suspensionBtn" onclick="buy('suspension')">
      SUSPENSION + JUMP (300)
    </div>

    <div class="btn small" id="boostBtn" onclick="buy('boost')">
      NEON BOOST (200)
    </div>

    <div class="btn" onclick="openGarage()">BACK</div>
  </div>

  <!-- CRASH -->
  <div id="crash" class="overlay hidden">
    <h1 style="color:#ff3b30">CRASHED</h1>
    <p id="final"></p>
    <div class="btn" onclick="start()">RETRY</div>
    <div class="btn" onclick="backToMenu()">SETTINGS</div>
  </div>

  <canvas id="c"></canvas>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
let w,h,frame=0,score=0,paused=false,over=true;

let credits = +localStorage.getItem("credits") || 0;

const upgrades = {
  engine: localStorage.getItem("engine")==="1",
  suspension: localStorage.getItem("suspension")==="1",
  boost: localStorage.getItem("boost")==="1"
};

const cars={
  sport:{id:"sport",name:"SPORTS",speed:8.2,jump:-14.5,desc:["Fast","Strong jump"]},
  suv:{id:"suv",name:"SUV",speed:6.2,jump:-16.5,desc:["Slow","Very high jump"]},
  hatch:{id:"hatch",name:"HATCH",speed:7,jump:-13.5,desc:["Balanced"]}
};

let selectedCar=cars.sport;
let currentCar=selectedCar;

const car={x:240,y:0,w:150,h:44,v:0,g:.55,ground:0,wheel:0};

function resize(){
  w=innerWidth; h=innerHeight;
  c.width=w*devicePixelRatio;
  c.height=h*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  car.ground=h*.78;
  car.y=car.ground-car.h;
}
addEventListener("resize",resize); resize();

function start(){
  score=0; frame=0; over=false; paused=false;
  currentCar=selectedCar;
  hideAll();
}
function togglePause(){ if(over)return; paused=!paused }

function openGarage(){ hideAll(); show("garage"); updateShopUI(); }
function openShop(){ hideAll(); show("shop"); updateShopUI(); }
function openCarDetail(id){
  selectedCar=cars[id];
  document.getElementById("carName").textContent=selectedCar.name;
  document.getElementById("specs").innerHTML=selectedCar.desc.join("<br>");
  hideAll(); show("carDetail");
}
function selectCar(){ hideAll(); show("garage"); }
function backToMenu(){ over=true; hideAll(); show("menu"); }

function hideAll(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.add("hidden")); }
function show(id){ document.getElementById(id).classList.remove("hidden"); }

function buy(item){
  const prices={engine:300,suspension:300,boost:200};
  if(credits<prices[item]||upgrades[item])return;
  credits-=prices[item];
  upgrades[item]=true;
  localStorage.setItem(item,"1");
  localStorage.setItem("credits",credits);
  updateShopUI();
}

function updateShopUI(){
  document.getElementById("credits").textContent=`CREDITS: ${credits}`;
  ["engine","suspension","boost"].forEach(i=>{
    const b=document.getElementById(i+"Btn");
    if(upgrades[i]){b.classList.add("disabled"); b.textContent+=" ✔";}
  });
}

addEventListener("pointerdown",()=>{
  if(over||paused)return;
  if(car.y>=car.ground-car.h-2){
    const jump=currentCar.jump+(upgrades.suspension?-2:0);
    car.v=jump;
  }
});

function update(){
  if(over||paused)return;
  frame++; if(frame%60===0){score++; credits++; localStorage.setItem("credits",credits);}
  car.v+=car.g; car.y+=car.v;
  if(car.y+car.h>=car.ground){car.y=car.ground-car.h; car.v=0}
  car.wheel+=(currentCar.speed+(upgrades.engine?1.2:0))*.12;
  document.getElementById("score").textContent=score.toString().padStart(4,"0");
  document.getElementById("credits").textContent=`CREDITS: ${credits}`;
}

function draw(){
  ctx.fillStyle="#020205"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#090909"; ctx.fillRect(0,car.ground,w,h-car.ground);
  ctx.fillStyle="#c62828"; ctx.fillRect(car.x,car.y+22,150,26);
  update();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
