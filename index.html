<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        :root { --squircle: 24px; --glass: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 100%); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: -apple-system, system-ui, sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
        @media screen and (orientation: portrait) { #stage { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: center; } }
        @media screen and (orientation: landscape) { #stage { width: 100vw; height: 100vh; } }
        #stage { position: relative; overflow: hidden; background: #050510; }
        canvas { width: 100%; height: 100%; display: block; }
        #ui-top { position: absolute; top: 40px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; color: white; }
        .stats { font-weight: 800; font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        .btn { background: var(--glass); border: 1px solid rgba(255,255,255,0.3); border-radius: var(--squircle); color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: transform 0.1s cubic-bezier(0,0,0,1); pointer-events: auto; backdrop-filter: blur(10px); }
        .btn:active { transform: scale(0.92); }
        .pause-btn { width: 60px; height: 60px; font-size: 22px; pointer-events: auto; }
        .menu-btn { width: 220px; height: 65px; margin: 12px; font-size: 18px; }
        .control-btns { position: absolute; bottom: 8%; width: 100%; display: flex; justify-content: space-between; padding: 0 60px; box-sizing: border-box; pointer-events: none; }
        .game-btn { width: 115px; height: 115px; border-radius: 38px; font-size: 15px; pointer-events: auto; }
        .hidden { display: none !important; }
        input[type=range] { width: 200px; accent-color: #007AFF; }
        #colorPreview { width: 100px; height: 40px; border-radius: 10px; border: 2px solid white; margin: 10px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stage">
            <div id="ui-top"><div class="stats" id="scoreDisplay">0</div><div class="btn pause-btn" id="pauseBtn" onclick="togglePause()">II</div></div>
            <div id="startScreen" class="overlay-screen">
                <h1 id="menuTitle" style="font-size: 48px; margin-bottom: 20px;">NIGHT DRIVE</h1>
                <div id="continueBtn" class="btn menu-btn hidden" style="background: rgba(52, 199, 89, 0.4);" onclick="togglePause()">CONTINUE</div>
                <div id="startBtn" class="btn menu-btn" style="background: rgba(0, 122, 255, 0.4);" onclick="startGame()">START ENGINE</div>
                <div class="btn menu-btn" onclick="openSub('customMenu')">PAINT SHOP</div>
                <div class="btn menu-btn" onclick="openSub('settingsMenu')">SETTINGS</div>
            </div>
            <div id="customMenu" class="overlay-screen hidden">
                <h2>PAINT SHOP</h2>
                <div id="colorPreview"></div>
                <input type="range" id="hueSlider" min="0" max="360" value="0" oninput="updateCarHue()">
                <p>Slide to change color</p>
                <div class="btn menu-btn" onclick="openSub('startScreen')">BACK</div>
            </div>
            <div id="settingsMenu" class="overlay-screen hidden">
                <h2>MECHANICS</h2>
                <div style="margin:20px;">INITIAL SPEED: <input type="range" id="speedRange" min="4" max="10" value="6"></div>
                <div class="btn menu-btn" onclick="openSub('startScreen')">BACK</div>
            </div>
            <div id="crashScreen" class="overlay-screen hidden">
                <h1 style="color: #ff3b30; font-size: 50px; margin:0;">CRASHED</h1>
                <p id="finalScore" style="font-size: 20px; margin: 20px 0; font-weight: bold;"></p>
                <div class="btn menu-btn" style="background: rgba(0, 122, 255, 0.4);" onclick="startGame()">RETRY</div>
                <div class="btn menu-btn" onclick="openSub('startScreen')">MAIN MENU</div>
            </div>
            <div class="control-btns"><div class="btn game-btn" id="boostBtn">BOOST</div><div class="btn game-btn" id="jumpBtn">JUMP</div></div>
            <canvas id="g"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, paused = false, frame = 0;
        let speed = 6, carHue = 0, rocks = [];
        const car = { x: 260, y: 0, w: 90, h: 36, v: 0, g: 0.5, jump: -12.5, ground: 0, wheelA: 0 };

        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSfx(freq, type, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function updateCarHue() {
            carHue = document.getElementById('hueSlider').value;
            document.getElementById('colorPreview').style.backgroundColor = `hsl(${carHue}, 80%, 50%)`;
        }

        function resize() {
            const stage = document.getElementById('stage');
            w = stage.offsetWidth; h = stage.offsetHeight;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.75; car.y = car.ground - car.h;
        }

        function openSub(id) {
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function togglePause() {
            if(over) return;
            paused = !paused;
            if(paused) {
                document.getElementById('menuTitle').innerText = "PAUSED";
                document.getElementById('continueBtn').classList.remove('hidden');
                document.getElementById('startBtn').classList.add('hidden');
                openSub('startScreen');
            } else { document.getElementById('startScreen').classList.add('hidden'); }
        }

        function startGame() {
            initAudio();
            speed = parseInt(document.getElementById('speedRange').value);
            score = 0; frame = 0; rocks = []; over = false; paused = false;
            document.getElementById('continueBtn').classList.add('hidden');
            document.getElementById('startBtn').classList.remove('hidden');
            openSub('none');
            playSfx(150, 'sawtooth', 0.5, 0.1);
        }

        function drawCar() {
            ctx.save(); ctx.translate(car.x, car.y);
            ctx.fillStyle = `hsl(${carHue}, 80%, 50%)`; ctx.beginPath(); ctx.roundRect(0, 8, car.w, 22, 8); ctx.fill();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(22, 0, 46, 16, [12, 12, 0, 0]); ctx.fill();
            ctx.shadowBlur = 10; ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-5, 12, 5, 10);
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 12, 5, 10);
            ctx.shadowBlur = 0;
            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-6); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                for(let i=0; i<5; i++) { ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10,0); ctx.stroke(); }
                ctx.restore();
            };
            dw(20); dw(car.w-22); ctx.restore();
        }

        function update() {
            if (over || paused) return;
            frame++; if (frame % 60 === 0) score++;
            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) { car.y = car.ground - car.h; car.v = 0; }
            car.wheelA += speed * 0.1;
            if (frame % 140 === 0) rocks.push({x: w, w: 50, h: 30 + Math.random()*28});
            rocks.forEach((o, i) => {
                o.x -= speed;
                if (car.x + 10 < o.x + o.w && car.x + car.w - 10 > o.x && car.y + car.h > car.ground - o.h + 5) die();
                if (o.x + o.w < 0) rocks.splice(i, 1);
            });
            document.getElementById('scoreDisplay').innerText = score;
        }

        function draw() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#111'; ctx.fillRect(0, car.ground, w, h-car.ground);
            rocks.forEach(o => {
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.moveTo(o.x, car.ground);
                ctx.lineTo(o.x + o.w * 0.3, car.ground - o.h); ctx.lineTo(o.x + o.w * 0.7, car.ground - o.h * 0.8);
                ctx.lineTo(o.x + o.w, car.ground); ctx.fill();
            });
            drawCar(); update(); requestAnimationFrame(draw);
        }

        function die() {
            over = true; playSfx(60, 'square', 0.8, 0.2);
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('finalScore').innerText = "SCORE: " + score + " | BEST: " + best;
            openSub('crashScreen');
        }

        const handle = (id, type) => {
            if (id === 'jumpBtn' && type === 'start' && !over && !paused) {
                if (car.y >= car.ground - car.h - 5) {
                    car.v = car.jump; playSfx(400, 'triangle', 0.2, 0.1);
                }
            }
            if (id === 'boostBtn') {
                const bVal = parseInt(document.getElementById('speedRange').value);
                speed = type === 'start' ? bVal * 2.2 : bVal;
                if(type === 'start') playSfx(600, 'sawtooth', 0.1, 0.05);
            }
        };

        ['touchstart', 'touchend'].forEach(evt => {
            window.addEventListener(evt, (e) => {
                const t = e.changedTouches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el && el.id) handle(el.id, evt === 'touchstart' ? 'start' : 'end');
            }, {passive: false});
        });

        window.addEventListener('resize', () => setTimeout(resize, 200));
        updateCarHue(); resize(); draw();
    </script>
</body>
</html>
