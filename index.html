<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra: Wrecks + Pro Paint Picker</title>
    <style>
        :root { --squircle: 28px; --glass: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.03) 100%); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: "SF Pro Display", -apple-system, sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
        @media screen and (orientation: portrait) { #stage { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: center; } }
        @media screen and (orientation: landscape) { #stage { width: 100vw; height: 100vh; } }
        #stage { position: relative; overflow: hidden; background: #020205; }
        canvas { width: 100%; height: 100%; display: block; }

        #ui-top { position: absolute; top: 40px; left: 50px; right: 50px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; color: white; }
        .stats { font-weight: 900; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }

        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; transition: opacity 0.4s; }
        .btn { background: var(--glass); border: 1px solid rgba(255,255,255,0.25); border-radius: var(--squircle); color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: all 0.2s cubic-bezier(0.15, 0, 0.15, 1); pointer-events: auto; backdrop-filter: blur(15px); }
        .btn:active { transform: scale(0.9) translateY(4px); }
        .pause-btn { width: 65px; height: 65px; font-size: 22px; border-radius: 20px; }
        .menu-btn { width: 240px; height: 65px; margin: 12px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
        .control-btns { position: absolute; bottom: 8%; width: 100%; display: flex; justify-content: space-between; padding: 0 70px; box-sizing: border-box; pointer-events: none; }
        .game-btn { width: 125px; height: 125px; border-radius: 40px; font-size: 16px; font-weight: 800; border-width: 2px; }

        select, input[type=range] { width: 220px; margin: 15px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 10px; font-size: 16px; }

        /* --- NEW Paint Shop picker --- */
        .picker-wrap{
            width: 620px;
            max-width: 85vw;
            padding: 18px;
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 18px 60px rgba(0,0,0,0.55);
            margin: 12px 0 18px;
        }
        #colorPreview {
            width: 110px; height: 44px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            margin: 6px 0 16px;
        }
        #paintCanvas {
            width: 100%;
            height: 380px;
            border-radius: 22px;
            display: block;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.25);
            touch-action: none;
        }
        .picker-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap: 16px;
            margin-top: 14px;
        }
        .picker-label{
            opacity: 0.85;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 12px;
            text-transform: uppercase;
        }
        #hueSlider {
            width: 100%;
            margin: 0;
            height: 34px;
            padding: 0 6px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stage">
            <div id="ui-top">
                <div class="stats" id="scoreDisplay">0000</div>
                <div class="btn pause-btn" id="pauseBtn" onclick="togglePause()">II</div>
            </div>

            <div id="startScreen" class="overlay-screen">
                <h1 id="menuTitle" style="font-size: 56px; margin-bottom: 20px; font-weight: 900;">NIGHT DRIVE</h1>
                <div id="continueBtn" class="btn menu-btn hidden" style="background: rgba(46, 204, 113, 0.3);" onclick="togglePause()">CONTINUE</div>
                <div id="startBtn" class="btn menu-btn" style="background: rgba(0, 122, 255, 0.3);" onclick="startGame()">START ENGINE</div>
                <div class="btn menu-btn" onclick="openSub('customMenu')">PAINT SHOP</div>
                <div class="btn menu-btn" onclick="openSub('settingsMenu')">SETTINGS</div>
            </div>

            <div id="customMenu" class="overlay-screen hidden">
                <h2 style="margin: 0 0 14px;">PAINT SHOP</h2>

                <div class="picker-wrap">
                    <div style="display:flex; justify-content:center;">
                        <div id="colorPreview"></div>
                    </div>

                    <canvas id="paintCanvas"></canvas>

                    <div class="picker-row">
                        <div class="picker-label">Hue</div>
                        <input type="range" id="hueSlider" min="0" max="360" value="200">
                    </div>
                </div>

                <div class="btn menu-btn" onclick="openSub('startScreen')">DONE</div>
            </div>

            <div id="settingsMenu" class="overlay-screen hidden">
                <h2>SETTINGS</h2>
                <p>BASE SPEED</p>
                <input type="range" id="speedRange" min="5" max="12" value="7">
                <p>WEATHER SYSTEM</p>
                <select id="weatherSelect">
                    <option value="dynamic">DYNAMIC</option>
                    <option value="clear">CLEAR</option>
                    <option value="rain">RAIN</option>
                    <option value="snow">SNOW</option>
                </select>
                <div class="btn menu-btn" onclick="openSub('startScreen')">SAVE</div>
            </div>

            <div id="crashScreen" class="overlay-screen hidden">
                <h1 style="color: #ff3b30; font-size: 60px; font-weight: 900;">CRASHED</h1>
                <p id="finalScore" style="font-size: 24px; margin: 20px 0;"></p>
                <div class="btn menu-btn" style="background: rgba(0, 122, 255, 0.3);" onclick="startGame()">RETRY</div>
                <div class="btn menu-btn" onclick="resetToMainMenu()">GARAGE</div>
            </div>

            <div class="control-btns">
                <div class="btn game-btn" id="boostBtn">BOOST</div>
                <div class="btn game-btn" id="jumpBtn">JUMP</div>
            </div>
            <canvas id="g"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, paused = false, frame = 0;
        let speed = 7, carHue = 200, wrecks = [], stars = [], groundSpecks = [], particles = [], clouds = [];

        let weatherTarget = 'clear', snowLvl = 0, rainLvl = 0;
        let weatherTimer = 0, lightning = 0, thunderQueued = 0;

        const car = { x: 280, y: 0, w: 94, h: 38, v: 0, g: 0.55, jump: -13.5, ground: 0, wheelA: 0 };

        /* ---------- AUDIO ---------- */
        let audioCtx, mainGain;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGain = audioCtx.createGain(); mainGain.gain.value = 0.4;
            mainGain.connect(audioCtx.destination);
            setInterval(() => {
                if(over || paused || !audioCtx) return;
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.frequency.setValueAtTime([55, 55, 65, 49][Math.floor(frame/30) % 4], audioCtx.currentTime);
                osc.type = 'sawtooth'; g.gain.setValueAtTime(0.06, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(g); g.connect(mainGain); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }, 500);
        }
        function playSfx(f, t, d, v) {
            if(!audioCtx || paused) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(v, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + d);
            o.connect(g); g.connect(mainGain); o.start(); o.stop(audioCtx.currentTime + d);
        }
        function playThunder() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
            osc.connect(g); g.connect(mainGain); osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        /* ---------- ENV ---------- */
        function initStars() { stars = Array.from({length: 120}, () => ({ x: Math.random()*w, y: Math.random()*h*0.6, s: Math.random()*1.5, o: Math.random() })); }
        function initGround() { groundSpecks = Array.from({length: 80}, () => ({ x: Math.random()*w, y: 0, s: Math.random()*3 })); }
        function initClouds() { clouds = Array.from({length: 6}, () => ({ x: Math.random()*w, y: Math.random()*h*0.3, w: 200+Math.random()*200, s: 0.2+Math.random()*0.3 })); }

        function updateWeather() {
            const mode = document.getElementById('weatherSelect').value;
            weatherTimer++;
            if(mode === 'dynamic' && weatherTimer > 900) {
                const choices = ['clear', 'rain', 'snow'];
                weatherTarget = choices[Math.floor(Math.random() * choices.length)];
                weatherTimer = 0;
            } else if (mode !== 'dynamic') { weatherTarget = mode; }

            if (weatherTarget === 'snow') snowLvl = Math.min(1, snowLvl + 0.005);
            else snowLvl = Math.max(0, snowLvl - 0.005);

            if (weatherTarget === 'rain') rainLvl = Math.min(1, rainLvl + 0.005);
            else rainLvl = Math.max(0, rainLvl - 0.005);

            if (rainLvl > 0.8 && Math.random() < 0.005) { lightning = 1; thunderQueued = 40; }
            if (lightning > 0) lightning -= 0.1;
            if (thunderQueued > 0 && --thunderQueued === 1) playThunder();

            if (frame % 2 === 0) {
                if (rainLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 15+Math.random()*5, vx: -2, type: 'rain', s: 2, op: rainLvl});
                if (snowLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 2+Math.random()*2, vx: Math.sin(frame/20)*2, type: 'snow', s: Math.random()*4, op: snowLvl});
            }
            particles.forEach((p, i) => {
                p.y += p.vy; p.x += p.vx;
                if (p.y > h) particles.splice(i, 1);
            });
            clouds.forEach(c => { c.x = (c.x - c.s) % (w + c.w); if (c.x < -c.w) c.x = w; });
        }

        function drawEnvironment() {
            let skyBase = lerpColor('#020205', '#080812', rainLvl);
            let skyTop = lerpColor('#0a0a1a', '#1a1a25', rainLvl);
            let groundBase = lerpColor('#0a0806', '#eef2ff', snowLvl);

            let sky = ctx.createLinearGradient(0, 0, 0, h);
            sky.addColorStop(0, skyBase); sky.addColorStop(1, skyTop);
            ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);

            if (lightning > 0) { ctx.fillStyle = `rgba(255,255,255,${lightning * 0.4})`; ctx.fillRect(0,0,w,h); }

            ctx.globalAlpha = 1 - rainLvl;
            ctx.fillStyle = "#fff";
            stars.forEach(s => { ctx.fillRect(s.x, s.y, s.s, s.s); });
            ctx.globalAlpha = 1;

            const time = Date.now() / 60000; const phase = (time % 1) * 2 - 1;
            ctx.save(); ctx.translate(w*0.8, h*0.15);
            ctx.globalAlpha = 1 - (rainLvl * 0.8);
            ctx.fillStyle = "#fffde7";
            ctx.beginPath(); ctx.arc(0,0,35,0,Math.PI*2); ctx.fill();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(phase * 40, 0, 35, 0, Math.PI*2); ctx.fill();
            ctx.restore(); ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            clouds.forEach(c => {
                ctx.globalAlpha = 0.1 + (rainLvl * 0.5);
                ctx.fillStyle = "rgba(20,20,30,0.4)";
                ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w, c.w/3, 0, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.fillStyle = groundBase; ctx.fillRect(0, car.ground, w, h-car.ground);
        }

        function lerpColor(a, b, t) {
            const ah = parseInt(a.replace(/#/g, ''), 16), bh = parseInt(b.replace(/#/g, ''), 16),
                  ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                  br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                  rr = ar + t * (br - ar), rg = ag + t * (bg - ag), rb = ab + t * (bb - ab);
            return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
        }

        /* ---------- RESIZE (FIXED scaling bug) ---------- */
        function resize() {
            const stage = document.getElementById('stage');
            w = stage.offsetWidth; h = stage.offsetHeight;

            const dpr = devicePixelRatio || 1;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);

            ctx.setTransform(1,0,0,1,0,0);
            ctx.scale(dpr, dpr);

            car.ground = h * 0.78; car.y = car.ground - car.h;
            initStars(); initGround(); initClouds();

            paintResize();
            paintDraw();
        }

        /* ---------- UI ---------- */
        function openSub(id) { document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden')); if(id !== 'none') document.getElementById(id).classList.remove('hidden'); }
        function resetToMainMenu() { paused = false; over = true; openSub('startScreen'); }
        function togglePause() {
            if(over) return;
            paused = !paused;
            if(paused) { openSub('startScreen'); document.getElementById('continueBtn').classList.remove('hidden'); document.getElementById('startBtn').classList.add('hidden'); }
            else { openSub('none'); }
        }

        function startGame() {
            initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
            speed = parseInt(document.getElementById('speedRange').value);
            score = 0; frame = 0; wrecks = []; particles = []; over = false; paused = false;
            openSub('none');
        }

        /* ---------- PLAYER CAR ---------- */
        function drawCar() {
            ctx.save(); ctx.translate(car.x, car.y);
            ctx.fillStyle = `hsl(${carHue}, 85%, 45%)`;
            ctx.beginPath(); ctx.roundRect(0, 8, car.w, 24, 10); ctx.fill();
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect(22, 0, 50, 18, [15, 15, 2, 2]); ctx.fill();
            ctx.shadowBlur = 15; ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-4, 14, 4, 12);
            ctx.fillStyle = '#f33'; ctx.shadowColor = '#f33'; ctx.fillRect(0, 14, 4, 12);
            ctx.shadowBlur = 0;

            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-4); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#080808'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#444'; ctx.lineWidth = 3;
                for(let i=0; i<5; i++){ ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.stroke(); }
                ctx.restore();
            };
            dw(22); dw(car.w-22); ctx.restore();
        }

        /* ---------- WRECK OBSTACLES ---------- */
        function spawnWreck() {
            const ww = 95 + Math.random()*60;
            const wh = 34 + Math.random()*18;

            wrecks.push({
                x: w + 40,
                w: ww,
                h: wh,
                y: car.ground - wh,
                rot: (-0.18 + Math.random()*0.36),
                burnt: 0.6 + Math.random()*0.4,
                damage: Math.random(),
                rimBroken: Math.random() < 0.65,
                glassGone: Math.random() < 0.6,
                burning: Math.random() < 0.22, // visual only
                fireP: 0,
            });
        }

        function drawWreck(o) {
            ctx.save();
            ctx.translate(o.x + o.w/2, o.y + o.h/2);
            ctx.rotate(o.rot);
            ctx.translate(-o.w/2, -o.h/2);

            // body base (burnt)
            const base = lerpColor('#2b2b2b', '#111111', o.burnt);
            ctx.fillStyle = base;
            ctx.beginPath();
            ctx.roundRect(0, 8, o.w, o.h-8, 10);
            ctx.fill();

            // roof / cabin
            ctx.fillStyle = lerpColor('#1f1f1f', '#0a0a0a', o.burnt);
            ctx.beginPath();
            ctx.roundRect(o.w*0.22, 0, o.w*0.56, o.h*0.55, [16,16,6,6]);
            ctx.fill();

            // dents / scorch marks
            ctx.globalAlpha = 0.45;
            ctx.fillStyle = "rgba(0,0,0,0.65)";
            for(let i=0;i<4;i++){
                const dx = o.w*(0.1 + Math.random()*0.8);
                const dy = o.h*(0.15 + Math.random()*0.65);
                ctx.beginPath();
                ctx.ellipse(dx, dy, 10+Math.random()*16, 6+Math.random()*10, Math.random(), 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // windows
            if(!o.glassGone){
                ctx.fillStyle = "rgba(10,10,14,0.85)";
                ctx.beginPath();
                ctx.roundRect(o.w*0.28, 5, o.w*0.44, o.h*0.34, 10);
                ctx.fill();

                // cracks
                ctx.strokeStyle = "rgba(255,255,255,0.25)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(o.w*0.35, o.h*0.12);
                ctx.lineTo(o.w*0.55, o.h*0.3);
                ctx.lineTo(o.w*0.7, o.h*0.18);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(o.w*0.52, o.h*0.1);
                ctx.lineTo(o.w*0.62, o.h*0.28);
                ctx.stroke();
            } else {
                // destroyed window gap
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.beginPath();
                ctx.roundRect(o.w*0.28, 5, o.w*0.44, o.h*0.34, 10);
                ctx.fill();
                ctx.globalAlpha = 1;

                // shards
                ctx.fillStyle = "rgba(200,220,255,0.15)";
                for(let i=0;i<6;i++){
                    ctx.beginPath();
                    ctx.moveTo(o.w*(0.3+Math.random()*0.4), o.h*(0.08+Math.random()*0.22));
                    ctx.lineTo(o.w*(0.32+Math.random()*0.45), o.h*(0.1+Math.random()*0.25));
                    ctx.lineTo(o.w*(0.3+Math.random()*0.4), o.h*(0.12+Math.random()*0.28));
                    ctx.fill();
                }
            }

            // wheels / rims
            const wheel = (x) => {
                ctx.save();
                ctx.translate(x, o.h-2);
                ctx.rotate(o.rimBroken ? (Math.sin(frame/20)*0.05) : 0);

                ctx.fillStyle = "#070707";
                ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();

                // rim
                ctx.strokeStyle = o.rimBroken ? "rgba(160,160,160,0.35)" : "rgba(220,220,220,0.4)";
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();

                // spokes
                ctx.strokeStyle = o.rimBroken ? "rgba(120,120,120,0.25)" : "rgba(255,255,255,0.25)";
                ctx.lineWidth = 2;
                for(let i=0;i<5;i++){
                    ctx.rotate(Math.PI*2/5);
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10,0); ctx.stroke();
                }

                // missing chunk
                if(o.rimBroken){
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.arc(0,0,16,0.2,1.3);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            };
            wheel(o.w*0.22);
            wheel(o.w*0.78);

            // burnt highlights
            ctx.globalAlpha = 0.25;
            ctx.fillStyle = "rgba(255,120,40,0.2)";
            ctx.fillRect(o.w*0.55, o.h*0.55, o.w*0.4, o.h*0.3);
            ctx.globalAlpha = 1;

            // fire (visual only)
            if(o.burning){
                const fx = o.w*0.6;
                const fy = o.h*0.3;
                const flick = 0.6 + Math.sin(frame/6 + o.fireP)*0.4;

                // smoke
                ctx.globalAlpha = 0.18;
                ctx.fillStyle = "rgba(60,60,60,0.8)";
                ctx.beginPath();
                ctx.ellipse(fx, fy-25, 18, 12, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // flame
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = "rgba(255,170,50,0.35)";
                ctx.beginPath();
                ctx.ellipse(fx, fy, 14, 20*flick, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "rgba(255,70,30,0.35)";
                ctx.beginPath();
                ctx.ellipse(fx-4, fy+6, 10, 14*flick, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';

                // tiny sparks
                if(frame % 3 === 0){
                    particles.push({x: o.x + o.w*0.6, y: o.y + o.h*0.25, vy: -2-Math.random()*2, vx: -1+Math.random()*2, type:'spark', s: 2+Math.random()*2, op: 0.6});
                }
            }

            ctx.restore();
        }

        /* ---------- GAME LOOP ---------- */
        function update() {
            if (over || paused) return;

            frame++;
            if(frame % 60 === 0) score++;

            car.v += car.g;
            car.y += car.v;
            if (car.y + car.h >= car.ground) { car.y = car.ground - car.h; car.v = 0; }
            car.wheelA += speed * 0.12;

            // spawn wrecks
            if (frame % 160 === 0) spawnWreck();

            // move + collision
            wrecks.forEach((o, i) => {
                o.x -= speed;
                o.fireP += 0.05;

                // collision tuned: a bit more forgiving than full box
                const hitL = car.x + 18;
                const hitR = car.x + car.w - 18;
                const obsL = o.x + 10;
                const obsR = o.x + o.w - 10;
                const obsTop = car.ground - o.h + 8;

                if (hitL < obsR && hitR > obsL && car.y + car.h > obsTop) die();
                if (o.x + o.w < -140) wrecks.splice(i, 1);
            });

            updateWeather();
            document.getElementById('scoreDisplay').innerText = score.toString().padStart(4, '0');
        }

        function draw() {
            drawEnvironment();

            ctx.fillStyle = "rgba(255,255,255,0.1)";
            groundSpecks.forEach(s => {
                s.x = (s.x - speed) % w; if(s.x < 0) s.x = w;
                ctx.fillRect(s.x, car.ground + (s.y++ % (h-car.ground)), s.s, 1);
            });

            // wrecks
            wrecks.forEach(o => drawWreck(o));

            // particles (rain/snow/sparks)
            particles.forEach((p, i) => {
                if(p.type === 'spark'){
                    p.y += p.vy; p.x += p.vx;
                    p.vy -= 0.1;
                    p.op *= 0.94;
                    ctx.globalAlpha = p.op;
                    ctx.fillStyle = "rgba(255,170,60,0.9)";
                    ctx.fillRect(p.x, p.y, p.s*0.6, p.s*0.6);
                    if(p.op < 0.05) particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.op;
                    ctx.fillStyle = p.type === 'rain' ? '#7af' : '#fff';
                    ctx.fillRect(p.x, p.y, (p.type==='rain'?1:p.s), p.s);
                }
            });
            ctx.globalAlpha = 1;

            drawCar();
            update();
            requestAnimationFrame(draw);
        }

        function die() {
            over = true; playSfx(50, 'square', 0.5, 0.3);
            document.getElementById('finalScore').innerText = `DISTANCE: ${score}m | RECORD: ${best}m`;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            openSub('crashScreen');
        }

        /* ---------- INPUT ---------- */
        const handle = (id, type) => {
            if (id === 'jumpBtn' && type === 'start' && !over && !paused) {
                if (car.y >= car.ground - car.h - 5) { car.v = car.jump; playSfx(300, 'triangle', 0.15, 0.1); }
            }
            if (id === 'boostBtn') {
                const bVal = parseInt(document.getElementById('speedRange').value);
                speed = type === 'start' ? bVal * 2.2 : bVal;
                if(type === 'start') playSfx(100, 'sawtooth', 0.1, 0.1);
            }
        };

        // better touch: detect controls reliably
        function findButtonAtTouch(t){
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if(!el) return null;
            if(el.id) return el;
            return el.closest?.('.btn') || null;
        }

        ['touchstart', 'touchend'].forEach(evt => {
            window.addEventListener(evt, (e) => {
                if(e.cancelable) e.preventDefault();
                const t = e.changedTouches[0];
                const el = findButtonAtTouch(t);
                if (el && el.id) handle(el.id, evt === 'touchstart' ? 'start' : 'end');
            }, {passive: false});
        });

        /* ---------- NEW PAINT PICKER ---------- */
        const paintCanvas = document.getElementById('paintCanvas');
        const pctx = paintCanvas.getContext('2d');
        const hueSlider = document.getElementById('hueSlider');
        let paintW = 0, paintH = 0;

        // picker state
        let pick = { x: 0.82, y: 0.45, gray: 0.0 }; // normalized
        let usingGray = false;

        function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

        function hslToHex(h, s, l){
            s/=100; l/=100;
            const k = n => (n + h/30) % 12;
            const a = s * Math.min(l, 1-l);
            const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
            const r = Math.round(255*f(0));
            const g = Math.round(255*f(8));
            const b = Math.round(255*f(4));
            return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
        }

        function paintResize(){
            const rect = paintCanvas.getBoundingClientRect();
            const dpr = devicePixelRatio || 1;
            paintW = Math.floor(rect.width * dpr);
            paintH = Math.floor(rect.height * dpr);
            paintCanvas.width = paintW;
            paintCanvas.height = paintH;
            pctx.setTransform(1,0,0,1,0,0);
            pctx.scale(dpr, dpr);
        }

        function paintDraw(){
            const rect = paintCanvas.getBoundingClientRect();
            const W = rect.width, H = rect.height;

            // layout like your reference: top grayscale strip + big color grid
            const pad = 14;
            const grayH = 54;
            const gridY = pad + grayH + 12;
            const gridH = H - gridY - pad;
            const gridW = W - pad*2;

            // background
            pctx.clearRect(0,0,W,H);
            pctx.save();

            // glass panel background
            pctx.globalAlpha = 1;
            pctx.fillStyle = "rgba(0,0,0,0.25)";
            pctx.beginPath(); pctx.roundRect(0,0,W,H,22); pctx.fill();

            // grayscale strip
            const gGrad = pctx.createLinearGradient(pad, pad, pad + gridW, pad);
            gGrad.addColorStop(0, "#ffffff");
            gGrad.addColorStop(1, "#000000");
            pctx.fillStyle = gGrad;
            pctx.beginPath();
            pctx.roundRect(pad, pad, gridW, grayH, 18);
            pctx.fill();

            // color grid = saturation vs lightness at selected hue
            // We'll build it by overlaying gradients for clean look.
            // Base hue fill
            pctx.fillStyle = `hsl(${carHue}, 100%, 50%)`;
            pctx.beginPath();
            pctx.roundRect(pad, gridY, gridW, gridH, 20);
            pctx.fill();

            // white overlay (desaturate to left)
            const satGrad = pctx.createLinearGradient(pad, 0, pad + gridW, 0);
            satGrad.addColorStop(0, "rgba(255,255,255,1)");
            satGrad.addColorStop(1, "rgba(255,255,255,0)");
            pctx.fillStyle = satGrad;
            pctx.beginPath(); pctx.roundRect(pad, gridY, gridW, gridH, 20); pctx.fill();

            // black overlay (darken to bottom)
            const lightGrad = pctx.createLinearGradient(0, gridY, 0, gridY + gridH);
            lightGrad.addColorStop(0, "rgba(0,0,0,0)");
            lightGrad.addColorStop(1, "rgba(0,0,0,1)");
            pctx.fillStyle = lightGrad;
            pctx.beginPath(); pctx.roundRect(pad, gridY, gridW, gridH, 20); pctx.fill();

            // draw selection indicator
            const ring = (x,y) => {
                pctx.save();
                pctx.shadowBlur = 18;
                pctx.shadowColor = "rgba(0,0,0,0.55)";
                pctx.lineWidth = 4;
                pctx.strokeStyle = "rgba(255,255,255,0.95)";
                pctx.beginPath(); pctx.arc(x,y,14,0,Math.PI*2); pctx.stroke();
                pctx.shadowBlur = 0;
                pctx.lineWidth = 2;
                pctx.strokeStyle = "rgba(0,0,0,0.45)";
                pctx.beginPath(); pctx.arc(x,y,16,0,Math.PI*2); pctx.stroke();
                pctx.restore();
            };

            if(usingGray){
                const x = pad + pick.gray * gridW;
                const y = pad + grayH/2;
                ring(x,y);
            } else {
                const x = pad + pick.x * gridW;
                const y = gridY + pick.y * gridH;
                ring(x,y);
            }

            pctx.restore();
        }

        function updateCarColorFromPicker(){
            if(usingGray){
                // map grayscale selection to lightness
                const l = 92 - pick.gray * 84; // 92 -> 8
                carHue = parseInt(hueSlider.value);
                document.getElementById('colorPreview').style.backgroundColor = `hsl(0,0%,${l}%)`;
                // keep hue but set car color to grayscale using sat=0
                carHue = parseInt(hueSlider.value); // keep hue slider consistent
                car._override = { sat: 0, light: l };
            } else {
                const sat = clamp(pick.x, 0, 1) * 100;
                const light = 92 - clamp(pick.y, 0, 1) * 84; // top bright -> bottom dark
                car._override = { sat, light };
                document.getElementById('colorPreview').style.backgroundColor = `hsl(${carHue}, ${sat}%, ${light}%)`;
            }
        }

        function updateCarHue(){
            carHue = parseInt(hueSlider.value);
            usingGray = false;
            paintDraw();
            updateCarColorFromPicker();
        }

        // override car paint in drawCar()
        const _drawCarOriginal = drawCar;
        drawCar = function(){
            ctx.save(); ctx.translate(car.x, car.y);

            const sat = car._override?.sat ?? 85;
            const light = car._override?.light ?? 45;

            ctx.fillStyle = `hsl(${carHue}, ${sat}%, ${light}%)`;
            ctx.beginPath(); ctx.roundRect(0, 8, car.w, 24, 10); ctx.fill();
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect(22, 0, 50, 18, [15, 15, 2, 2]); ctx.fill();
            ctx.shadowBlur = 15; ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-4, 14, 4, 12);
            ctx.fillStyle = '#f33'; ctx.shadowColor = '#f33'; ctx.fillRect(0, 14, 4, 12);
            ctx.shadowBlur = 0;

            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-4); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#080808'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#444'; ctx.lineWidth = 3;
                for(let i=0; i<5; i++){ ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.stroke(); }
                ctx.restore();
            };
            dw(22); dw(car.w-22); ctx.restore();
        }

        function paintPointer(e){
            const rect = paintCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left);
            const y = (e.clientY - rect.top);

            const pad = 14;
            const grayH = 54;
            const gridY = pad + grayH + 12;
            const gridH = rect.height - gridY - pad;
            const gridW = rect.width - pad*2;

            // grayscale strip hit
            if(y >= pad && y <= pad + grayH){
                usingGray = true;
                pick.gray = clamp((x - pad) / gridW, 0, 1);
                paintDraw();
                updateCarColorFromPicker();
                return;
            }

            // grid hit
            if(y >= gridY && y <= gridY + gridH){
                usingGray = false;
                pick.x = clamp((x - pad) / gridW, 0, 1);
                pick.y = clamp((y - gridY) / gridH, 0, 1);
                paintDraw();
                updateCarColorFromPicker();
            }
        }

        let paintDragging = false;
        paintCanvas.addEventListener('pointerdown', (e) => {
            paintDragging = true;
            paintCanvas.setPointerCapture(e.pointerId);
            paintPointer(e);
        });
        paintCanvas.addEventListener('pointermove', (e) => {
            if(!paintDragging) return;
            paintPointer(e);
        });
        paintCanvas.addEventListener('pointerup', () => paintDragging = false);
        paintCanvas.addEventListener('pointercancel', () => paintDragging = false);

        hueSlider.addEventListener('input', updateCarHue);

        /* ---------- BOOT ---------- */
        window.addEventListener('resize', () => setTimeout(resize, 200));

        // init
        document.getElementById('colorPreview').style.backgroundColor = `hsl(${carHue}, 85%, 45%)`;
        resize();
        paintDraw();
        updateCarHue();
        draw();
    </script>
</body>
</html>
