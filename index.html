<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        :root { --squircle: 24px; }
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            overflow: hidden; background: #000; touch-action: none; 
            font-family: -apple-system, system-ui; 
            /* Stops the text selection glitch */
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        @media screen and (orientation: portrait) {
            #game-container { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: bottom left; position: absolute; top: -100vw; left: 0; }
        }
        canvas { display: block; width: 100%; height: 100%; }

        #ui { position: absolute; top: 30px; left: 40px; right: 40px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; color: white; font-weight: 800; font-size: 22px; }
        
        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        
        /* Liquid Glass Buttons */
        .btn { 
            width: 160px; height: 65px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.2);
            color: white; font-weight: 600; border-radius: var(--squircle);
            display: flex; align-items: center; justify-content: center; margin: 10px;
            transition: transform 0.1s; backdrop-filter: blur(10px);
        }
        .btn:active { transform: scale(0.94) translateY(2px); }
        
        .control-btns { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .game-btn { width: 110px; height: 110px; border-radius: 35px; font-size: 14px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui"><div id="scoreDisplay">SCORE: 0</div><div id="bestDisplay">BEST: 0</div></div>

        <div id="startScreen" class="overlay-screen">
            <h1 style="font-size: 50px; margin-bottom: 20px; letter-spacing: -1px;">NIGHT DRIVE</h1>
            <div style="display:flex;">
                <div class="btn" onclick="showScreen('customScreen')">CAR</div>
                <div class="btn" onclick="showScreen('settingsScreen')">SETUP</div>
            </div>
            <div class="btn" style="width: 240px; background: rgba(0, 122, 255, 0.6);" onclick="startGame()">START ENGINE</div>
        </div>

        <div id="customScreen" class="overlay-screen hidden">
            <h2>PAINT SHOP</h2>
            <div style="display:flex; flex-wrap:wrap; justify-content:center;">
                <div class="btn" onclick="setCarColor('#ff3b30')">ROSSO</div>
                <div class="btn" onclick="setCarColor('#007AFF')">ELECTRIC</div>
                <div class="btn" onclick="setCarColor('#5856d6')">PURPLE</div>
                <div class="btn" onclick="setCarColor('#ffffff')">WHITE</div>
            </div>
            <div class="btn" onclick="showScreen('startScreen')">DONE</div>
        </div>

        <div id="settingsScreen" class="overlay-screen hidden">
            <h2>MECHANICS</h2>
            <p>DIFFICULTY: <input type="range" id="diffSetting" min="3" max="8" value="5"></p>
            <div class="btn" onclick="showScreen('startScreen')">BACK</div>
        </div>

        <div id="crashScreen" class="overlay-screen hidden">
            <h1 style="color: #ff3b30; font-size: 60px;">CRASHED</h1>
            <p id="finalScoreText" style="font-size: 24px; margin-bottom: 20px;"></p>
            <div class="btn" style="width: 220px; background: rgba(0, 122, 255, 0.6);" onclick="startGame()">RETRY</div>
        </div>

        <div class="control-btns">
            <div class="btn game-btn" id="boostBtn">BOOST</div>
            <div class="btn game-btn" id="jumpBtn">JUMP</div>
        </div>

        <canvas id="g"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, frame = 0;
        let speed = 5, carColor = '#ff3b30', rocks = [];
        
        const car = { x: 120, y: 0, w: 110, h: 42, v: 0, g: 0.45, jump: -12.5, ground: 0, wheelA: 0 };

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function setCarColor(c) { carColor = c; }

        function resize() {
            const rect = canvas.getBoundingClientRect();
            w = rect.width; h = rect.height;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.75;
            car.y = car.ground - car.h;
        }

        function startGame() {
            speed = parseInt(document.getElementById('diffSetting').value);
            score = 0; frame = 0; rocks = []; over = false;
            showScreen('none');
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            
            // Body Shadow
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)';
            // Main Chassis
            ctx.fillStyle = carColor;
            ctx.beginPath();
            ctx.roundRect(0, 10, car.w, 22, 8); ctx.fill();
            // Upper Cabin
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(25, 0, 55, 18, [15, 15, 0, 0]); ctx.fill();
            // Windows
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(35, 4, 35, 8);
            
            // Details
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-6, 15, 6, 10); // Headlight
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 15, 6, 10); // Taillight
            ctx.shadowBlur = 0;

            // Moving Rims
            const drawWheel = (x) => {
                ctx.save(); ctx.translate(x, car.h-8); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
                for(let i=0; i<5; i++) {
                    ctx.rotate((Math.PI*2)/5);
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.stroke();
                }
                ctx.restore();
            };
            drawWheel(25); drawWheel(car.w-25);
            ctx.restore();
        }

        function update() {
            if (over) return;
            frame++;
            if (frame % 60 === 0) score++;
            
            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) { car.y = car.ground - car.h; car.v = 0; }
            car.wheelA += speed * 0.1;

            // Spawning with "Impossible" Check: Rocks are now capped at 60px height
            if (frame % 120 === 0) rocks.push({x: w, w: 50, h: 35 + Math.random()*25, passed: false});
            
            rocks.forEach((o, i) => {
                o.x -= speed;
                // Collision Hitbox (made slightly smaller than visual for fairness)
                if (car.x + 15 < o.x + o.w && car.x + car.w - 15 > o.x && car.y + car.h > car.ground - o.h + 5) die();
                if (!o.passed && o.x < car.x) { score += 10; o.passed = true; }
                if (o.x + o.w < 0) rocks.splice(i, 1);
            });
            document.getElementById('scoreDisplay').innerText = "SCORE: " + score;
        }

        function draw() {
            // Smooth Sky Gradient
            let sky = ctx.createLinearGradient(0, 0, 0, h);
            let time = (score % 1000) / 1000;
            if (time < 0.5) { // Day
                sky.addColorStop(0, '#4facfe'); sky.addColorStop(1, '#00f2fe');
            } else { // Night
                sky.addColorStop(0, '#090919'); sky.addColorStop(1, '#16213e');
            }
            ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);

            // Ground
            ctx.fillStyle = '#111'; ctx.fillRect(0, car.ground, w, h-car.ground);
            ctx.strokeStyle = '#222'; ctx.setLineDash([40, 40]); 
            ctx.lineDashOffset = (frame*speed)%80;
            ctx.beginPath(); ctx.moveTo(0, car.ground+20); ctx.lineTo(w, car.ground+20); ctx.stroke();
            ctx.setLineDash([]);

            // Detailed Rocks
            rocks.forEach(o => {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(o.x, car.ground);
                ctx.lineTo(o.x + o.w*0.2, car.ground - o.h);
                ctx.lineTo(o.x + o.w*0.8, car.ground - o.h*0.8);
                ctx.lineTo(o.x + o.w, car.ground);
                ctx.fill();
                ctx.strokeStyle = '#444'; ctx.stroke();
            });

            drawCar();
            update();
            requestAnimationFrame(draw);
        }

        function die() {
            over = true;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('finalScoreText').innerText = "SCORE: " + score + " | BEST: " + best;
            document.getElementById('bestDisplay').innerText = "BEST: " + best;
            showScreen('crashScreen');
        }

        // Fixed Button Logic
        const jBtn = document.getElementById('jumpBtn'), bBtn = document.getElementById('boostBtn');
        jBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(car.y >= car.ground - car.h - 5) car.v = car.jump; });
        bBtn.addEventListener('touchstart', (e) => { e.preventDefault(); speed *= 1.8; });
        bBtn.addEventListener('touchend', (e) => { e.preventDefault(); speed /= 1.8; });

        window.addEventListener('resize', () => setTimeout(resize, 150));
        resize(); draw();
    </script>
</body>
</html>
