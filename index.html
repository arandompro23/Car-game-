<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Night Drive Ultra</title>

<style>
  :root{
    --squircle: 28px;
    --glass1: rgba(255,255,255,0.22);
    --glass2: rgba(255,255,255,0.06);
    --glass3: rgba(255,255,255,0.02);
    --stroke: rgba(255,255,255,0.28);
    --stroke2: rgba(255,255,255,0.12);
    --shadow: rgba(0,0,0,0.55);
    --txt: rgba(255,255,255,0.92);
  }

  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
  }

  /* IMPORTANT:
     We do NOT set touch-action:none globally anymore.
     Only canvas gets gesture prevention.
  */
  #game-container{ width:100vw; height:100vh; position:relative; display:flex; align-items:center; justify-content:center; }

  @media screen and (orientation: portrait){
    #stage{ width:100vh; height:100vw; transform:rotate(90deg); transform-origin:center; }
  }
  @media screen and (orientation: landscape){
    #stage{ width:100vw; height:100vh; }
  }

  #stage{ position:relative; overflow:hidden; background:#020205; }
  canvas{
    width:100%; height:100%;
    display:block;
    touch-action:none; /* only the canvas blocks gestures */
  }

  #ui-top{
    position:absolute;
    top:40px; left:50px; right:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    pointer-events:none;
    color:white;
  }
  .stats{
    font-weight:900;
    font-size:28px;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
    text-shadow: 0 12px 28px rgba(0,0,0,0.55);
  }

  /* ---------- Liquid Glass Buttons ---------- */
  .btn{
    position:relative;
    overflow:hidden;
    border-radius: var(--squircle);
    border:1px solid var(--stroke);
    background:
      radial-gradient(120% 160% at 20% 0%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.07) 45%, rgba(255,255,255,0.02) 100%),
      linear-gradient(145deg, var(--glass1) 0%, var(--glass2) 55%, var(--glass3) 100%);
    box-shadow:
      0 24px 60px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -10px 30px rgba(0,0,0,0.25);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    color:var(--txt);
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .18s cubic-bezier(.15,0,.15,1), filter .18s, box-shadow .18s;
    pointer-events:auto;
    text-transform:uppercase;
    letter-spacing:2px;
    -webkit-tap-highlight-color: transparent;
  }

  .btn::before{
    content:"";
    position:absolute;
    inset:-60% -40%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.55), rgba(255,255,255,0) 55%);
    opacity:.28;
    transform: rotate(18deg);
    pointer-events:none;
  }

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(115deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.20) 40%, rgba(255,255,255,0.0) 70%);
    transform: translateX(-120%);
    opacity:.35;
    pointer-events:none;
  }

  .btn:hover{ filter:brightness(1.08); }
  .btn:active{
    transform: scale(0.94) translateY(4px);
    box-shadow:
      0 16px 40px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.30),
      inset 0 -12px 30px rgba(0,0,0,0.28);
  }

  .gloss-sweep{
    animation: sweep 2.8s ease-in-out infinite;
  }
  @keyframes sweep{
    0%, 65% { transform: translateX(-120%); }
    78% { transform: translateX(120%); }
    100% { transform: translateX(120%); }
  }

  .pause-btn{ width:65px; height:65px; font-size:22px; border-radius:20px; letter-spacing:0; text-transform:none; }
  .menu-btn{ width:260px; height:70px; margin:12px; font-size:18px; }
  .small-btn{ width:190px; height:58px; margin:10px; font-size:15px; }

  .overlay-screen{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    z-index:100;
    transition: opacity .35s;
  }
  .hidden{ display:none !important; }

  .control-btns{
    position:absolute;
    bottom:8%;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 70px;
    box-sizing:border-box;
    pointer-events:none;
    z-index:11;
  }
  .game-btn{
    width:125px;
    height:125px;
    border-radius:40px;
    font-size:16px;
    font-weight:900;
    border-width:1px;
    letter-spacing:2px;
  }

  /* Garage UI */
  .garage-row{
    display:flex;
    gap:14px;
    margin: 10px 0 18px;
  }
  .seg{
    width:140px;
    height:56px;
    border-radius:20px;
    letter-spacing:1px;
    font-size:13px;
  }
  .seg.active{
    border-color: rgba(255,255,255,0.55);
    filter: brightness(1.15);
  }

  /* Slider styling */
  .panel{
    width:min(520px, 86vw);
    border-radius: 32px;
    padding: 22px 22px 18px;
    border:1px solid var(--stroke2);
    background:
      radial-gradient(120% 120% at 20% 0%, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 65%, rgba(255,255,255,0.01)),
      rgba(0,0,0,0.25);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .panel h2{ margin: 0 0 12px; font-size: 26px; letter-spacing: 2px; }
  .label{ opacity: .9; font-weight: 800; letter-spacing: 2px; font-size: 12px; margin-top: 14px; }

  input[type=range]{
    width: 100%;
    margin: 12px 0 0;
    accent-color: rgba(255,255,255,0.85);
  }
  .preview{
    width: 100%;
    height: 54px;
    border-radius: 18px;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    margin: 12px 0 6px;
  }
  .swatches{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top: 12px;
  }
  .sw{
    width: 34px;
    height: 34px;
    border-radius: 12px;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18);
  }

  /* Top back button inside overlays */
  .overlay-top{
    position:absolute;
    top: 26px;
    left: 26px;
    right: 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
  }
  .overlay-top .btn{ pointer-events:auto; }
  .back-btn{
    width: 120px;
    height: 56px;
    border-radius: 22px;
    font-size: 14px;
  }
</style>
</head>

<body>
<div id="game-container">
  <div id="stage">

    <div id="ui-top">
      <div class="stats" id="scoreDisplay">0000</div>
      <div class="btn pause-btn gloss-sweep" id="pauseBtn">II</div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="overlay-screen">
      <h1 id="menuTitle" style="font-size:56px;margin:0 0 10px;font-weight:900;letter-spacing:2px;">NIGHT DRIVE</h1>
      <div style="opacity:.75;margin-bottom:18px;letter-spacing:2px;font-weight:700;">ULTRA</div>

      <div id="continueBtn" class="btn menu-btn hidden gloss-sweep" style="background: rgba(46,204,113,0.22);">CONTINUE</div>
      <div id="startBtn" class="btn menu-btn gloss-sweep" style="background: rgba(0,122,255,0.22);">START ENGINE</div>
      <div id="garageBtn" class="btn menu-btn gloss-sweep">GARAGE</div>
      <div id="settingsBtn" class="btn menu-btn gloss-sweep">SETTINGS</div>
    </div>

    <!-- GARAGE -->
    <div id="garageScreen" class="overlay-screen hidden">
      <div class="overlay-top">
        <div class="btn back-btn gloss-sweep" id="garageBackBtn">BACK</div>
        <div style="opacity:.75;font-weight:900;letter-spacing:2px;">GARAGE</div>
        <div style="width:120px;"></div>
      </div>

      <div class="panel" style="margin-top: 40px;">
        <h2>PAINT SHOP</h2>

        <div class="label">VEHICLE</div>
        <div class="garage-row">
          <div class="btn seg gloss-sweep" id="carSportBtn">SPORT</div>
          <div class="btn seg gloss-sweep" id="carSuvBtn">SUV</div>
          <div class="btn seg gloss-sweep" id="carHatchBtn">HATCH</div>
        </div>

        <div class="label">COLOR PREVIEW</div>
        <div class="preview" id="colorPreview"></div>

        <div class="label">COLOR (HUE)</div>
        <input type="range" id="hueSlider" min="0" max="360" value="200" />

        <div class="label">TONE (LIGHTNESS)</div>
        <input type="range" id="toneSlider" min="20" max="70" value="45" />

        <div class="label">SWATCHES</div>
        <div class="swatches" id="swatches"></div>

        <div style="display:flex; gap:12px; margin-top:16px; justify-content:space-between;">
          <div class="btn small-btn gloss-sweep" id="randomPaintBtn">RANDOM</div>
          <div class="btn small-btn gloss-sweep" id="garageDoneBtn" style="background: rgba(0,122,255,0.22);">DONE</div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="settingsScreen" class="overlay-screen hidden">
      <div class="overlay-top">
        <div class="btn back-btn gloss-sweep" id="settingsBackBtn">BACK</div>
        <div style="opacity:.75;font-weight:900;letter-spacing:2px;">SETTINGS</div>
        <div style="width:120px;"></div>
      </div>

      <div class="panel" style="margin-top: 40px;">
        <h2>SETTINGS</h2>

        <div class="label">BASE SPEED</div>
        <input type="range" id="speedRange" min="7" max="18" value="12" />

        <div class="label">WEATHER</div>
        <select id="weatherSelect" style="width:100%; margin-top: 12px; background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 14px; font-size: 16px;">
          <option value="dynamic">DYNAMIC</option>
          <option value="clear">CLEAR</option>
          <option value="rain">RAIN</option>
          <option value="snow">SNOW</option>
        </select>

        <div style="display:flex; justify-content:flex-end; margin-top: 16px;">
          <div class="btn small-btn gloss-sweep" id="settingsSaveBtn" style="background: rgba(46,204,113,0.20);">SAVE</div>
        </div>
      </div>
    </div>

    <!-- CRASH -->
    <div id="crashScreen" class="overlay-screen hidden">
      <h1 style="color:#ff3b30;font-size:60px;font-weight:900;letter-spacing:2px;margin:0;">CRASHED</h1>
      <p id="finalScore" style="font-size:24px;margin:20px 0;opacity:.9;"></p>
      <div class="btn menu-btn gloss-sweep" id="retryBtn" style="background: rgba(0,122,255,0.22);">RETRY</div>
      <div class="btn menu-btn gloss-sweep" id="garageReturnBtn">GARAGE</div>
    </div>

    <div class="control-btns">
      <div class="btn game-btn gloss-sweep" id="boostBtn">BOOST</div>
      <div class="btn game-btn gloss-sweep" id="jumpBtn">JUMP</div>
    </div>

    <canvas id="g"></canvas>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('g');
  const ctx = canvas.getContext('2d');

  // ---------- STATE ----------
  let w=0, h=0;
  let score=0, best = parseInt(localStorage.getItem('hb')||"0",10);
  let over=true, paused=false;
  let frame=0;

  // Speed tuning: use deltaTime for consistent speed across devices
  let baseSpeed = parseInt(localStorage.getItem('baseSpeed')||"12",10);
  let speed = baseSpeed;

  // Car customization
  let carHue = parseInt(localStorage.getItem('carHue')||"200",10);
  let carTone = parseInt(localStorage.getItem('carTone')||"45",10);
  let carModel = localStorage.getItem('carModel') || "sport"; // sport, suv, hatch

  // World
  let rocks = [];          // now "wrecks"
  let stars = [];
  let groundSpecks = [];
  let particles = [];
  let clouds = [];
  let boostFX = 0;         // 0..1

  // Weather
  let weatherTarget = 'clear', snowLvl=0, rainLvl=0;
  let weatherTimer=0, lightning=0, thunderQueued=0;

  // Car physics
  const car = { x: 280, y: 0, w: 94, h: 38, v: 0, g: 0.55, jump: -13.5, ground: 0, wheelA: 0 };

  // ---------- AUDIO ----------
  let audioCtx, mainGain;
  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mainGain = audioCtx.createGain();
    mainGain.gain.value = 0.4;
    mainGain.connect(audioCtx.destination);

    setInterval(() => {
      if(over || paused || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.setValueAtTime([55,55,65,49][Math.floor(frame/30)%4], audioCtx.currentTime);
      osc.type = 'sawtooth';
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.connect(g); g.connect(mainGain);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }, 500);
  }

  function playSfx(f, t, d, v){
    if(!audioCtx || paused) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = t;
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + d);
    o.connect(g); g.connect(mainGain);
    o.start(); o.stop(audioCtx.currentTime + d);
  }

  function playThunder(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(40, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
    osc.connect(g); g.connect(mainGain);
    osc.start(); osc.stop(audioCtx.currentTime + 1.5);
  }

  // ---------- HELPERS ----------
  function lerp(a,b,t){ return a+(b-a)*t; }

  function lerpColor(a,b,t){
    const ah=parseInt(a.replace(/#/g,''),16), bh=parseInt(b.replace(/#/g,''),16);
    const ar=ah>>16, ag=ah>>8&0xff, ab=ah&0xff;
    const br=bh>>16, bg=bh>>8&0xff, bb=bh&0xff;
    const rr=ar+t*(br-ar), rg=ag+t*(bg-ag), rb=ab+t*(bb-ab);
    return '#' + ((1<<24)+(rr<<16)+(rg<<8)+rb|0).toString(16).slice(1);
  }

  function hsl(h,s,l){ return `hsl(${h},${s}%,${l}%)`; }

  // ---------- INIT ----------
  function initStars(){ stars = Array.from({length:120},()=>({x:Math.random()*w,y:Math.random()*h*0.6,s:Math.random()*1.5,o:Math.random()})); }
  function initGround(){ groundSpecks = Array.from({length:80},()=>({x:Math.random()*w,y:0,s:Math.random()*3})); }
  function initClouds(){ clouds = Array.from({length:6},()=>({x:Math.random()*w,y:Math.random()*h*0.3,w:200+Math.random()*200,s:0.2+Math.random()*0.3})); }

  function resize(){
    const stage = document.getElementById('stage');
    w = stage.offsetWidth;
    h = stage.offsetHeight;

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); // reset transform safely

    car.ground = h * 0.78;
    car.y = car.ground - car.h;

    initStars(); initGround(); initClouds();
  }

  // ---------- UI / SCREENS ----------
  function openSub(id){
    document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
    if(id !== 'none') document.getElementById(id).classList.remove('hidden');
  }

  function setActiveCarButtons(){
    document.getElementById('carSportBtn').classList.toggle('active', carModel === 'sport');
    document.getElementById('carSuvBtn').classList.toggle('active', carModel === 'suv');
    document.getElementById('carHatchBtn').classList.toggle('active', carModel === 'hatch');
  }

  function updatePreview(){
    document.getElementById('colorPreview').style.background = `
      linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.03)),
      ${hsl(carHue, 85, carTone)}
    `;
  }

  // ---------- WEATHER ----------
  function updateWeather(){
    const mode = document.getElementById('weatherSelect').value;
    weatherTimer++;
    if(mode === 'dynamic' && weatherTimer > 900){
      const choices=['clear','rain','snow'];
      weatherTarget = choices[Math.floor(Math.random()*choices.length)];
      weatherTimer=0;
    }else if(mode !== 'dynamic'){
      weatherTarget = mode;
    }

    snowLvl = (weatherTarget==='snow') ? Math.min(1, snowLvl+0.005) : Math.max(0, snowLvl-0.005);
    rainLvl = (weatherTarget==='rain') ? Math.min(1, rainLvl+0.005) : Math.max(0, rainLvl-0.005);

    if(rainLvl>0.8 && Math.random()<0.005){ lightning=1; thunderQueued=40; }
    if(lightning>0) lightning -= 0.1;
    if(thunderQueued>0 && --thunderQueued===1) playThunder();

    // particles
    if(frame%2===0){
      if(rainLvl>0.1) particles.push({x:Math.random()*w,y:-10,vy:15+Math.random()*5,vx:-2,type:'rain',s:2,op:rainLvl});
      if(snowLvl>0.1) particles.push({x:Math.random()*w,y:-10,vy:2+Math.random()*2,vx:Math.sin(frame/20)*2,type:'snow',s:Math.random()*4,op:snowLvl});
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.y+=p.vy; p.x+=p.vx;
      if(p.y>h+20) particles.splice(i,1);
    }

    clouds.forEach(c => {
      c.x = (c.x - c.s) % (w + c.w);
      if(c.x < -c.w) c.x = w;
    });
  }

  function drawEnvironment(){
    let skyBase = lerpColor('#020205', '#080812', rainLvl);
    let skyTop  = lerpColor('#0a0a1a', '#1a1a25', rainLvl);
    let groundBase = lerpColor('#0a0806', '#eef2ff', snowLvl);

    const sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0, skyBase);
    sky.addColorStop(1, skyTop);
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,w,h);

    if(lightning>0){
      ctx.fillStyle = `rgba(255,255,255,${lightning*0.4})`;
      ctx.fillRect(0,0,w,h);
    }

    // stars
    ctx.globalAlpha = 1 - rainLvl;
    ctx.fillStyle="#fff";
    for(const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);
    ctx.globalAlpha=1;

    // moon
    const time = Date.now()/60000;
    const phase = (time%1)*2-1;
    ctx.save();
    ctx.translate(w*0.8, h*0.15);
    ctx.globalAlpha = 1 - (rainLvl*0.8);
    ctx.fillStyle="#fffde7";
    ctx.beginPath(); ctx.arc(0,0,35,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(phase*40,0,35,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';

    // clouds
    for(const c of clouds){
      ctx.globalAlpha = 0.1 + (rainLvl*0.5);
      ctx.fillStyle="rgba(20,20,30,0.4)";
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w, c.w/3, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    // ground
    ctx.fillStyle = groundBase;
    ctx.fillRect(0, car.ground, w, h-car.ground);
  }

  // ---------- CAR MODELS ----------
  function drawRim(cx, cy, r, bent=0){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(car.wheelA);
    ctx.fillStyle = '#070707';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // rim ring
    ctx.strokeStyle = bent ? 'rgba(200,200,200,0.25)' : 'rgba(220,220,220,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0,r-3,0,Math.PI*2); ctx.stroke();

    // spokes
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    for(let i=0;i<6;i++){
      ctx.rotate(Math.PI*2/6);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(r-5 + (bent? (Math.sin(i)*2):0), 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCarModel(){
    ctx.save();
    ctx.translate(car.x, car.y);

    const body = hsl(carHue, 85, carTone);
    const body2 = hsl(carHue, 85, Math.max(18, carTone-10));
    const glass = 'rgba(10,10,14,0.85)';
    const highlight = 'rgba(255,255,255,0.18)';

    if(carModel === 'sport'){
      // low sleek
      ctx.fillStyle = body;
      roundRect(0, 12, 100, 24, 12); ctx.fill();
      ctx.fillStyle = body2;
      roundRect(18, 4, 62, 20, [16,16,4,4]); ctx.fill();

      // gloss
      ctx.fillStyle = highlight;
      ctx.beginPath(); ctx.roundRect(10, 14, 80, 6, 6); ctx.fill();

      // windows
      ctx.fillStyle = glass;
      roundRect(24, 6, 48, 16, [14,14,4,4]); ctx.fill();

      // lights
      ctx.shadowBlur = 16; ctx.shadowColor='#fff';
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillRect(96, 16, 4, 10);
      ctx.shadowColor='#f33';
      ctx.fillStyle='rgba(255,60,60,0.9)';
      ctx.fillRect(0, 16, 4, 10);
      ctx.shadowBlur = 0;

      drawRim(26, 36, 15);
      drawRim(84, 36, 15);
    }

    if(carModel === 'suv'){
      // taller chunky
      ctx.fillStyle = body;
      roundRect(0, 8, 110, 30, 14); ctx.fill();
      ctx.fillStyle = body2;
      roundRect(20, 0, 68, 22, [16,16,6,6]); ctx.fill();

      ctx.fillStyle = highlight;
      ctx.beginPath(); ctx.roundRect(10, 10, 90, 7, 7); ctx.fill();

      ctx.fillStyle = glass;
      roundRect(26, 2, 56, 18, [14,14,6,6]); ctx.fill();

      ctx.shadowBlur = 16; ctx.shadowColor='#fff';
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillRect(106, 16, 4, 12);
      ctx.shadowColor='#f33';
      ctx.fillStyle='rgba(255,60,60,0.9)';
      ctx.fillRect(0, 16, 4, 12);
      ctx.shadowBlur = 0;

      drawRim(28, 40, 16);
      drawRim(92, 40, 16);
    }

    if(carModel === 'hatch'){
      // compact hatchback
      ctx.fillStyle = body;
      roundRect(0, 10, 96, 26, 12); ctx.fill();
      ctx.fillStyle = body2;
      roundRect(16, 2, 56, 20, [16,16,6,6]); ctx.fill();

      // hatch bump
      ctx.fillStyle = body2;
      roundRect(66, 8, 26, 18, 10); ctx.fill();

      ctx.fillStyle = highlight;
      ctx.beginPath(); ctx.roundRect(10, 12, 74, 6, 6); ctx.fill();

      ctx.fillStyle = glass;
      roundRect(22, 4, 44, 16, [14,14,6,6]); ctx.fill();

      ctx.shadowBlur = 16; ctx.shadowColor='#fff';
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillRect(92, 16, 4, 10);
      ctx.shadowColor='#f33';
      ctx.fillStyle='rgba(255,60,60,0.9)';
      ctx.fillRect(0, 16, 4, 10);
      ctx.shadowBlur = 0;

      drawRim(24, 38, 15);
      drawRim(74, 38, 15);
    }

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
  }

  // ---------- WRECKS (Destroyed Cars replacing rocks) ----------
  function spawnWreck(){
    const type = ["sedan","van","sport"][Math.floor(Math.random()*3)];
    const ww = 90 + Math.random()*60;
    const hh = 34 + Math.random()*18;
    const burn = Math.random() < 0.35;      // some are burnt
    const fire = burn && Math.random() < 0.35; // some burning
    rocks.push({
      x: w + 40,
      w: ww,
      h: hh,
      type,
      burn,
      fire,
      rimBent: Math.random() < 0.55,
      crack: Math.random() < 0.75,
      soot: 0.5 + Math.random()*0.5
    });
  }

  function drawWreck(o){
    const y = car.ground;
    const top = y - o.h;

    // base colors
    const base = o.burn ? 'rgba(22,22,24,0.95)' : 'rgba(34,34,38,0.95)';
    const metal = o.burn ? 'rgba(90,90,95,0.35)' : 'rgba(130,130,140,0.30)';
    const glass = 'rgba(10,10,14,0.75)';

    ctx.save();
    ctx.translate(o.x, top);

    // body silhouette (wrecked)
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.moveTo(0, o.h);
    ctx.lineTo(o.w*0.10, o.h*0.55);
    ctx.lineTo(o.w*0.25, o.h*0.30);
    ctx.lineTo(o.w*0.55, o.h*0.20);
    ctx.lineTo(o.w*0.85, o.h*0.45);
    ctx.lineTo(o.w, o.h);
    ctx.closePath();
    ctx.fill();

    // soot / burn marks
    ctx.globalAlpha = o.soot;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.ellipse(o.w*(0.25+Math.random()*0.5), o.h*(0.35+Math.random()*0.4),
                  o.w*(0.12+Math.random()*0.10), o.h*(0.10+Math.random()*0.08), 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // windows (cracked)
    ctx.fillStyle = glass;
    ctx.beginPath();
    ctx.roundRect(o.w*0.25, o.h*0.35, o.w*0.45, o.h*0.22, 8);
    ctx.fill();

    if(o.crack){
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      for(let i=0;i<6;i++){
        const sx = o.w*0.48, sy = o.h*0.46;
        const ex = o.w*(0.25 + Math.random()*0.45);
        const ey = o.h*(0.35 + Math.random()*0.22);
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(ex,ey);
        ctx.stroke();
      }
    }

    // metal dents
    ctx.strokeStyle = metal;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(o.w*0.12, o.h*0.70);
    ctx.lineTo(o.w*0.42, o.h*0.58);
    ctx.lineTo(o.w*0.78, o.h*0.66);
    ctx.stroke();

    // rims / wheels (wrecked)
    const wheelY = o.h + 2;
    drawWreckWheel(o.w*0.22, wheelY, 12, o.rimBent);
    drawWreckWheel(o.w*0.78, wheelY, 12, o.rimBent);

    // flames + smoke (visual only)
    if(o.fire){
      drawFlame(o.w*0.55, o.h*0.20, 1.0);
      drawSmoke(o.w*0.60, o.h*0.12);
    }

    // snow on top
    if(snowLvl > 0.05){
      ctx.fillStyle = `rgba(255,255,255,${snowLvl})`;
      ctx.beginPath();
      ctx.moveTo(o.w*0.15, o.h*0.50);
      ctx.lineTo(o.w*0.55, o.h*0.22);
      ctx.lineTo(o.w*0.90, o.h*0.48);
      ctx.lineTo(o.w*0.55, o.h*0.42);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawWreckWheel(x,y,r,bent){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.3 + Math.sin(frame/12)*0.02);
    ctx.fillStyle = 'rgba(8,8,10,0.95)';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle = bent ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bent?2:0, bent?-1:0, r-2, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawFlame(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.globalAlpha = 0.9;
    for(let i=0;i<3;i++){
      const t = (frame*0.08 + i) % 10;
      const h = 18 + Math.sin(t)*6;
      const w2 = 10 + Math.cos(t)*4;
      ctx.fillStyle = `rgba(255,${120+Math.random()*60|0},0,0.55)`;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(-w2, -h*0.4, 0, -h);
      ctx.quadraticCurveTo(w2, -h*0.4, 0, 0);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSmoke(x,y){
    // spawn smoke particles
    if(frame % 6 === 0){
      particles.push({x:oClamp(x), y:oClamp(y), vy:-0.8-Math.random()*0.8, vx:-0.3+Math.random()*0.6, type:'smoke', s: 6+Math.random()*8, op: 0.35});
    }
  }
  function oClamp(v){ return v; }

  // ---------- BOOST FX ----------
  function drawBoostFX(){
    if(boostFX <= 0) return;

    // speed lines
    ctx.save();
    ctx.globalAlpha = 0.18 * boostFX;
    ctx.fillStyle = '#fff';
    for(let i=0;i<22;i++){
      const y = Math.random()*h*0.8;
      const len = 120 + Math.random()*240;
      const x = Math.random()*w;
      ctx.fillRect(x, y, len, 2);
    }

    // subtle flash
    ctx.globalAlpha = 0.08 * boostFX;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  // ---------- GAME LOOP ----------
  let lastTS = performance.now();

  function update(dt){
    if(over || paused) return;

    frame++;

    // score based on distance/time
    score += dt * 0.06; // tuned for faster feel
    document.getElementById('scoreDisplay').innerText = Math.floor(score).toString().padStart(4,'0');

    // physics
    car.v += car.g * dt * 0.06;
    car.y += car.v * dt * 0.06;

    if(car.y + car.h >= car.ground){
      car.y = car.ground - car.h;
      car.v = 0;
    }

    // wheel spin
    car.wheelA += (speed * 0.02) * dt;

    // spawn wrecks
    if(frame % 110 === 0) spawnWreck();

    // move wrecks + collision
    for(let i=rocks.length-1;i>=0;i--){
      const o = rocks[i];
      o.x -= speed * dt * 0.06;

      // collision bounds (for wrecks)
      const hitY = car.ground - o.h + 10;
      if(car.x + 15 < o.x + o.w && car.x + car.w - 15 > o.x && car.y + car.h > hitY){
        die();
      }
      if(o.x + o.w < -160) rocks.splice(i,1);
    }

    updateWeather();

    // boost decay
    boostFX = Math.max(0, boostFX - dt * 0.002);
  }

  function draw(){
    const now = performance.now();
    const dt = Math.min(40, now - lastTS); // clamp for stability
    lastTS = now;

    // camera shake on boost
    let shake = (boostFX>0) ? (Math.sin(frame*0.6)*boostFX*3) : 0;

    ctx.save();
    ctx.translate(shake, 0);

    drawEnvironment();

    // ground specks
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    for(const s of groundSpecks){
      s.x = (s.x - speed*dt*0.06) % w;
      if(s.x < 0) s.x = w;
      ctx.fillRect(s.x, car.ground + (s.y++ % (h-car.ground)), s.s, 1);
    }

    // wrecks
    for(const o of rocks) drawWreck(o);

    // weather particles
    for(const p of particles){
      ctx.globalAlpha = p.op;
      if(p.type === 'rain'){
        ctx.fillStyle = '#7af';
        ctx.fillRect(p.x, p.y, 1, p.s);
      }else if(p.type === 'snow'){
        ctx.fillStyle = '#fff';
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }else if(p.type === 'smoke'){
        ctx.fillStyle = 'rgba(80,80,90,0.65)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.s, p.s*0.8, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // boost overlay
    drawBoostFX();

    // car
    drawCarModel();

    ctx.restore();

    update(dt);
    requestAnimationFrame(draw);
  }

  // ---------- GAME CONTROL ----------
  function startGame(){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    baseSpeed = parseInt(document.getElementById('speedRange').value,10);
    localStorage.setItem('baseSpeed', baseSpeed);

    speed = baseSpeed;
    score = 0;
    frame = 0;
    rocks = [];
    particles = [];
    over = false;
    paused = false;
    boostFX = 0;

    openSub('none');
  }

  function togglePause(){
    if(over) return;
    paused = !paused;
    if(paused){
      openSub('startScreen');
      document.getElementById('continueBtn').classList.remove('hidden');
      document.getElementById('startBtn').classList.add('hidden');
    }else{
      openSub('none');
    }
  }

  function die(){
    over = true;
    playSfx(50,'square',0.5,0.3);

    const dist = Math.floor(score);
    if(dist > best){ best = dist; localStorage.setItem('hb', best); }

    document.getElementById('finalScore').innerText = `DISTANCE: ${dist}m | RECORD: ${best}m`;
    openSub('crashScreen');
  }

  // ---------- INPUT ----------
  function canJump(){
    return car.y >= car.ground - car.h - 5;
  }

  // Pointer-safe handlers for UI
  function on(id, evt, fn){
    const el = document.getElementById(id);
    el.addEventListener(evt, fn, {passive:false});
  }

  // UI buttons
  on('pauseBtn','pointerdown',(e)=>{ e.preventDefault(); togglePause(); });
  on('startBtn','pointerdown',(e)=>{ e.preventDefault(); startGame(); });
  on('continueBtn','pointerdown',(e)=>{ e.preventDefault(); togglePause(); });
  on('garageBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('garageScreen'); });
  on('settingsBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('settingsScreen'); });

  on('garageBackBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('startScreen'); });
  on('garageDoneBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('startScreen'); });

  on('settingsBackBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('startScreen'); });
  on('settingsSaveBtn','pointerdown',(e)=>{ e.preventDefault(); localStorage.setItem('baseSpeed', document.getElementById('speedRange').value); openSub('startScreen'); });

  on('retryBtn','pointerdown',(e)=>{ e.preventDefault(); startGame(); });
  on('garageReturnBtn','pointerdown',(e)=>{ e.preventDefault(); openSub('garageScreen'); });

  // Car model switching (reliable)
  function setModel(m){
    carModel = m;
    localStorage.setItem('carModel', carModel);
    setActiveCarButtons();
    playSfx(240,'triangle',0.08,0.08);
  }
  on('carSportBtn','pointerdown',(e)=>{ e.preventDefault(); setModel('sport'); });
  on('carSuvBtn','pointerdown',(e)=>{ e.preventDefault(); setModel('suv'); });
  on('carHatchBtn','pointerdown',(e)=>{ e.preventDefault(); setModel('hatch'); });

  // Sliders (fixed)
  const hueSlider = document.getElementById('hueSlider');
  const toneSlider = document.getElementById('toneSlider');

  function syncPaint(){
    carHue = parseInt(hueSlider.value,10);
    carTone = parseInt(toneSlider.value,10);
    localStorage.setItem('carHue', carHue);
    localStorage.setItem('carTone', carTone);
    updatePreview();
  }
  hueSlider.addEventListener('input', syncPaint);
  toneSlider.addEventListener('input', syncPaint);

  on('randomPaintBtn','pointerdown',(e)=>{
    e.preventDefault();
    carHue = Math.floor(Math.random()*360);
    carTone = 35 + Math.floor(Math.random()*25);
    hueSlider.value = carHue;
    toneSlider.value = carTone;
    syncPaint();
    playSfx(420,'triangle',0.10,0.09);
  });

  // Game buttons
  const boostBtn = document.getElementById('boostBtn');
  const jumpBtn  = document.getElementById('jumpBtn');

  boostBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if(over || paused) return;
    speed = baseSpeed * 2.35;
    boostFX = 1;
    playSfx(110,'sawtooth',0.12,0.12);
  }, {passive:false});

  boostBtn.addEventListener('pointerup', (e)=>{
    e.preventDefault();
    speed = baseSpeed;
  }, {passive:false});

  boostBtn.addEventListener('pointercancel', ()=>{
    speed = baseSpeed;
  });

  jumpBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if(over || paused) return;
    if(canJump()){
      car.v = car.jump;
      playSfx(320,'triangle',0.15,0.12);
    }
  }, {passive:false});

  // Also allow tap on canvas to jump (optional)
  canvas.addEventListener('pointerdown', (e)=>{
    if(over || paused) return;
    // avoid if user tapped UI overlays
    if(canJump()){
      car.v = car.jump;
      playSfx(320,'triangle',0.12,0.08);
    }
  }, {passive:true});

  // ---------- SWATCHES ----------
  const swatchList = [
    {h:200,l:45},{h:210,l:35},{h:195,l:55},
    {h:120,l:42},{h:135,l:36},{h:95,l:50},
    {h:0,l:45},{h:10,l:35},{h:350,l:55},
    {h:45,l:45},{h:35,l:38},{h:60,l:55},
    {h:270,l:45},{h:285,l:38},{h:250,l:55},
    {h:180,l:40},{h:165,l:52},{h:155,l:35},
    {h:320,l:45},{h:305,l:35},{h:330,l:55},
    // neon/metallic-ish
    {h:190,l:62},{h:120,l:62},{h:35,l:62},{h:300,l:62},{h:0,l:62}
  ];

  function buildSwatches(){
    const wrap = document.getElementById('swatches');
    wrap.innerHTML = "";
    swatchList.forEach(s=>{
      const d = document.createElement('div');
      d.className = 'sw';
      d.style.background = `linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04)), ${hsl(s.h,85,s.l)}`;
      d.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        carHue = s.h; carTone = s.l;
        hueSlider.value = carHue;
        toneSlider.value = carTone;
        syncPaint();
        playSfx(520,'triangle',0.06,0.07);
      }, {passive:false});
      wrap.appendChild(d);
    });
  }

  // ---------- BOOT ----------
  function boot(){
    // restore saved settings
    document.getElementById('speedRange').value = baseSpeed;
    hueSlider.value = carHue;
    toneSlider.value = carTone;
    updatePreview();
    buildSwatches();
    setActiveCarButtons();

    // default weather UI
    document.getElementById('weatherSelect').value = 'dynamic';

    resize();
    draw();
  }

  // keep stage responsive
  window.addEventListener('resize', () => setTimeout(resize, 200));

  // keyboard support
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      if(!over && !paused) togglePause();
      else openSub('startScreen');
    }
    if(e.key === ' '){
      if(over || paused) return;
      if(canJump()) car.v = car.jump;
    }
  });

  boot();
})();
</script>
</body>
</html>
