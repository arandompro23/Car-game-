<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra: Pro Scaling</title>
    <style>
        :root { --squircle: 24px; --glass: linear-gradient(145deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; font-family: "SF Pro Display", -apple-system, sans-serif; }
        
        /* Force Landscape Container */
        #game-container { 
            position: fixed; top: 50%; left: 50%; 
            width: 100vw; height: 56.25vw; /* 16:9 Aspect Ratio */
            max-width: 177.78vh; max-height: 100vh;
            transform: translate(-50%, -50%);
            background: #020205; overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

        /* UI Overlays */
        .overlay-screen { 
            position: absolute; inset: 0; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 100; opacity: 1; transition: opacity 0.3s;
        }

        #ui-top { position: absolute; top: 5%; left: 5%; right: 5%; display: flex; justify-content: space-between; pointer-events: none; z-index: 50; }
        .stats { font-weight: 900; font-size: 4vh; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .btn { 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.2); border-radius: var(--squircle); 
            color: white; font-weight: 700; display: flex; align-items: center; justify-content: center; 
            pointer-events: auto; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
        .menu-btn { width: 30vh; height: 8vh; margin: 1.5vh; font-size: 2vh; }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* Color Picker Scaling Fix */
        #palette-container { 
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.8vh; 
            width: 80vh; padding: 2vh; background: rgba(255,255,255,0.05); border-radius: 15px; 
            margin: 2vh 0; pointer-events: auto;
        }
        .color-swatch { aspect-ratio: 1/1; border-radius: 4px; border: 1px solid rgba(0,0,0,0.5); }

        .control-btns { position: absolute; bottom: 10%; width: 100%; display: flex; justify-content: space-between; padding: 0 10%; box-sizing: border-box; pointer-events: none; }
        .game-btn { width: 18vh; height: 18vh; border-radius: 5vh; font-size: 2.5vh; }
        .hidden { display: none !important; pointer-events: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="g"></canvas>
        
        <div id="ui-top">
            <div class="stats" id="scoreDisplay">0000</div>
            <div class="btn" style="width:8vh; height:8vh;" onclick="togglePause()">II</div>
        </div>

        <div id="startScreen" class="overlay-screen">
            <h1 style="font-size: 8vh; margin-bottom: 4vh;">NIGHT DRIVE</h1>
            <div id="continueBtn" class="btn menu-btn hidden" onclick="togglePause()">CONTINUE</div>
            <div id="startBtn" class="btn menu-btn" style="background:rgba(0,122,255,0.5)" onclick="startGame()">START ENGINE</div>
            <div class="btn menu-btn" onclick="showScreen('garageMenu')">GARAGE</div>
        </div>

        <div id="garageMenu" class="overlay-screen hidden">
            <h2 style="font-size: 4vh;">SELECT RIDE</h2>
            <div style="display:flex; gap:2vh; margin-bottom:3vh;">
                <div class="btn" style="width:20vh; height:20vh; flex-direction:column;" onclick="setCar('hatch')"><canvas id="pre-hatch" width="150" height="80"></canvas>HATCH</div>
                <div class="btn" style="width:20vh; height:20vh; flex-direction:column;" onclick="setCar('sport')"><canvas id="pre-sport" width="150" height="80"></canvas>SPORT</div>
                <div class="btn" style="width:20vh; height:20vh; flex-direction:column;" onclick="setCar('suv')"><canvas id="pre-suv" width="150" height="80"></canvas>SUV</div>
            </div>
            <div class="btn menu-btn" style="background:#e67e2266" onclick="showScreen('paintMenu')">PAINT SHOP</div>
            <div class="btn menu-btn" onclick="showScreen('startScreen')">BACK</div>
        </div>

        <div id="paintMenu" class="overlay-screen hidden">
            <canvas id="paintPreview" width="400" height="150"></canvas>
            <div id="palette-container"></div>
            <div class="btn menu-btn" onclick="showScreen('garageMenu')">APPLY</div>
        </div>

        <div id="crashScreen" class="overlay-screen hidden">
            <h1 style="color:#ff3b30; font-size:10vh;">CRASHED</h1>
            <p id="finalScore" style="font-size:4vh; margin-bottom:4vh;"></p>
            <div class="btn menu-btn" style="background:#007aff" onclick="startGame()">RETRY</div>
            <div class="btn menu-btn" onclick="showScreen('startScreen')">EXIT</div>
        </div>

        <div class="control-btns">
            <div class="btn game-btn" id="boostBtn">BOOST</div>
            <div class="btn game-btn" id="jumpBtn">JUMP</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        const vW = 1920, vH = 1080; // Virtual Resolution
        let score = 0, over = true, paused = false, frame = 0, speed = 12;
        let carColor = '#007aff', carType = 'hatch', wrecks = [], flames = [], spray = [];
        
        const player = { x: 400, y: 800, w: 180, h: 70, v: 0, g: 1.2, jump: -32, ground: 850, wheelA: 0 };

        function drawCar(c, x, y, type, color, wheelA, isWreck = false, scale = 1) {
            c.save(); c.translate(x, y); c.scale(scale, scale);
            const body = isWreck ? "#1a1a1a" : color;
            const glass = isWreck ? "#050505" : "rgba(0,0,0,0.8)";
            
            c.fillStyle = body;
            if(type === 'hatch') {
                c.beginPath(); c.roundRect(0, 15, 180, 50, 15); c.fill();
                c.fillStyle = glass; c.beginPath(); c.roundRect(40, 0, 100, 35, [25, 25, 5, 5]); c.fill();
            } else if(type === 'sport') {
                c.beginPath(); c.roundRect(0, 25, 200, 40, 10); c.fill();
                c.fillStyle = glass; c.beginPath(); c.roundRect(50, 10, 90, 25, [30, 30, 5, 5]); c.fill();
                c.fillStyle = body; c.fillRect(5, 10, 15, 15);
            } else {
                c.beginPath(); c.roundRect(0, 10, 190, 60, 8); c.fill();
                c.fillStyle = glass; c.beginPath(); c.roundRect(20, -20, 130, 50, 10); c.fill();
                if(!isWreck) { c.fillStyle="#333"; c.fillRect(30, -25, 100, 6); }
            }

            if(!isWreck) {
                c.shadowBlur = 20; c.fillStyle = '#fff'; c.shadowColor = '#fff'; c.fillRect(type==='sport'?190:175, 35, 8, 15);
                c.fillStyle = '#f33'; c.shadowColor = '#f33'; c.fillRect(0, 35, 8, 15);
                c.shadowBlur = 0;
            }

            const wheel = (wx) => {
                c.save(); c.translate(wx, 60); c.rotate(wheelA);
                c.fillStyle = '#080808'; c.beginPath(); c.arc(0,0,28,0,Math.PI*2); c.fill();
                c.strokeStyle = isWreck ? '#222' : '#555'; c.lineWidth = 5;
                for(let i=0; i<5; i++){ c.rotate(Math.PI*2/5); c.beginPath(); c.moveTo(0,0); c.lineTo(24,0); c.stroke(); }
                c.restore();
            };
            wheel(45); if(!(isWreck && type==='sport')) wheel(145);
            c.restore();
        }

        function createPalette() {
            const container = document.getElementById('palette-container');
            const grayscale = ['#ffffff','#cccccc','#999999','#666666','#333333','#000000'];
            grayscale.forEach(c => addSwatch(c));
            for(let i=0; i<6; i++) addSwatch('#000'); // Fill top row
            
            const hues = [200, 230, 260, 290, 320, 350, 20, 45, 65, 90, 130, 170];
            const lights = [40, 60, 80];
            lights.forEach(l => hues.forEach(h => addSwatch(`hsl(${h}, 80%, ${l}%)`)));

            function addSwatch(color) {
                const div = document.createElement('div');
                div.className = 'color-swatch'; div.style.backgroundColor = color;
                div.onclick = () => { carColor = color; sprayEff(color); };
                container.appendChild(div);
            }
        }

        function sprayEff(color) {
            for(let i=0; i<30; i++) spray.push({x: 200, y: 75, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, s: Math.random()*10, o: 1, c: color});
        }

        function showScreen(id) { 
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden')); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function startGame() {
            score = 0; wrecks = []; flames = []; over = false; paused = false; speed = 12;
            player.y = player.ground - player.h; player.v = 0;
            showScreen('none');
        }

        function die() {
            if(over) return;
            over = true;
            document.getElementById('finalScore').innerText = `DISTANCE: ${score}m`;
            showScreen('crashScreen');
        }

        function togglePause() {
            if(over) return;
            paused = !paused;
            if(paused) { showScreen('startScreen'); document.getElementById('continueBtn').classList.remove('hidden'); document.getElementById('startBtn').classList.add('hidden'); }
            else showScreen('none');
        }

        function update() {
            if(over || paused) return;
            frame++; if(frame % 10 === 0) score++;
            player.v += player.g; player.y += player.v;
            if(player.y + player.h >= player.ground) { player.y = player.ground - player.h; player.v = 0; }
            player.wheelA += speed * 0.05;
            
            if(frame % 100 === 0) wrecks.push({x: vW + 200, type: ['hatch','sport','suv'][Math.floor(Math.random()*3)], burn: Math.random()>0.5});
            
            wrecks.forEach((w, i) => {
                w.x -= speed;
                const hitW = 180, hitH = 70;
                if(player.x < w.x + hitW - 20 && player.x + player.w > w.x + 20 && player.y + player.h > player.ground - hitH + 10) die();
                if(w.burn && frame % 2 === 0) flames.push({x: w.x + 100, y: player.ground - 40, vx: -5, vy: -Math.random()*5, s: 10+Math.random()*15, o: 1});
                if(w.x < -400) wrecks.splice(i, 1);
            });

            flames.forEach((f, i) => { f.x += f.vx; f.y += f.vy; f.o -= 0.02; if(f.o <= 0) flames.splice(i, 1); });
        }

        function render() {
            ctx.clearRect(0,0,vW,vH);
            // Sky
            let sky = ctx.createLinearGradient(0,0,0,vH); sky.addColorStop(0, '#020205'); sky.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = sky; ctx.fillRect(0,0,vW,vH);
            // Road
            ctx.fillStyle = '#0a0806'; ctx.fillRect(0, player.ground, vW, vH-player.ground);
            ctx.fillStyle = '#111'; ctx.fillRect(0, player.ground, vW, 10);
            
            wrecks.forEach(w => drawCar(ctx, w.x, player.ground - (w.type==='suv'?80:w.type==='sport'?65:70), w.type, 0, 0, true));
            flames.forEach(f => { ctx.globalAlpha = f.o; ctx.fillStyle = '#f50'; ctx.beginPath(); ctx.arc(f.x, f.y, f.s, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1;

            drawCar(ctx, player.x, player.y, carType, carColor, player.wheelA);
            document.getElementById('scoreDisplay').innerText = score.toString().padStart(4, '0');
        }

        function loop() {
            update(); render(); requestAnimationFrame(loop);
        }

        function paintLoop() {
            const px = document.getElementById('paintPreview').getContext('2d');
            px.clearRect(0,0,400,150);
            spray.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.o -= 0.03; px.globalAlpha = p.o; px.fillStyle = p.c;
                px.beginPath(); px.arc(p.x, p.y, p.s, 0, Math.PI*2); px.fill();
                if(p.o <= 0) spray.splice(i, 1);
            });
            px.globalAlpha = 1;
            drawCar(px, 110, 50, carType, carColor, 0, false, 0.8);
            requestAnimationFrame(paintLoop);
        }

        // Logic for setting car and scaling
        window.setCar = (t) => { carType = t; };
        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = vW; canvas.height = vH;
            // Preview renders
            ['hatch','sport','suv'].forEach(t => {
                const c = document.getElementById('pre-'+t).getContext('2d');
                c.clearRect(0,0,150,80); drawCar(c, 20, 20, t, carColor, 0, false, 0.5);
            });
        }

        ['touchstart', 'touchend'].forEach(evt => window.addEventListener(evt, (e) => {
            const t = e.changedTouches[0]; const el = document.elementFromPoint(t.clientX, t.clientY);
            if (!el) return;
            if (el.id === 'jumpBtn' && evt === 'touchstart' && player.y >= player.ground - player.h - 10) player.v = player.jump;
            if (el.id === 'boostBtn') speed = (evt === 'touchstart') ? 28 : 12;
        }));

        window.addEventListener('resize', resize);
        createPalette(); resize(); loop(); paintLoop();
    </script>
</body>
</html>
