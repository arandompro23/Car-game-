<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Night Drive Ultra</title>

<style>
  :root {
    --squircle: 28px;
    --glass: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.03) 100%);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;

    /* Critical: stop scroll/zoom issues on mobile browsers */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #game-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    overflow: hidden;
    background: #020205;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #ui-top {
    position: absolute;
    top: 40px;
    left: 50px;
    right: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
    color: white;
  }

  .stats {
    font-weight: 900;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }

  .overlay-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    z-index: 100;
    transition: opacity 0.4s;
  }

  .btn {
    background: var(--glass);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: var(--squircle);
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s cubic-bezier(0.15, 0, 0.15, 1);
    pointer-events: auto;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    cursor: pointer;
  }

  .btn:active { transform: scale(0.9) translateY(4px); }

  .pause-btn {
    width: 65px;
    height: 65px;
    font-size: 22px;
    border-radius: 20px;
    pointer-events: auto;
  }

  .menu-btn {
    width: 240px;
    height: 65px;
    margin: 12px;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .control-btns {
    position: absolute;
    bottom: 8%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 70px;
    box-sizing: border-box;
    z-index: 20;
    pointer-events: none;
  }

  .game-btn {
    width: 125px;
    height: 125px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 800;
    border-width: 2px;
    pointer-events: auto;
  }

  select, input[type=range] {
    width: 220px;
    margin: 15px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
  }

  #colorPreview {
    width: 100px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid white;
    margin-bottom: 10px;
  }

  .hidden { display: none !important; }
</style>
</head>

<body>
<div id="game-container">
  <div id="stage">
    <div id="ui-top">
      <div class="stats" id="scoreDisplay">0000</div>
      <div class="btn pause-btn" id="pauseBtn">II</div>
    </div>

    <div id="startScreen" class="overlay-screen">
      <h1 id="menuTitle" style="font-size:56px;margin-bottom:20px;font-weight:900;">NIGHT DRIVE</h1>
      <div id="continueBtn" class="btn menu-btn hidden" style="background: rgba(46, 204, 113, 0.3);">CONTINUE</div>
      <div id="startBtn" class="btn menu-btn" style="background: rgba(0, 122, 255, 0.3);">START ENGINE</div>
      <div class="btn menu-btn" id="paintShopBtn">PAINT SHOP</div>
      <div class="btn menu-btn" id="settingsBtn">SETTINGS</div>
    </div>

    <div id="customMenu" class="overlay-screen hidden">
      <h2>PAINT SHOP</h2>
      <div id="colorPreview"></div>
      <input type="range" id="hueSlider" min="0" max="360" value="200">
      <div class="btn menu-btn" id="paintDoneBtn">DONE</div>
    </div>

    <div id="settingsMenu" class="overlay-screen hidden">
      <h2>SETTINGS</h2>
      <p>BASE SPEED</p>
      <input type="range" id="speedRange" min="5" max="12" value="7">
      <p>WEATHER SYSTEM</p>
      <select id="weatherSelect">
        <option value="dynamic">DYNAMIC</option>
        <option value="clear">CLEAR</option>
        <option value="rain">RAIN</option>
        <option value="snow">SNOW</option>
      </select>
      <div class="btn menu-btn" id="settingsSaveBtn">SAVE</div>
    </div>

    <div id="crashScreen" class="overlay-screen hidden">
      <h1 style="color:#ff3b30;font-size:60px;font-weight:900;">CRASHED</h1>
      <p id="finalScore" style="font-size:24px;margin:20px 0;"></p>
      <div class="btn menu-btn" style="background: rgba(0, 122, 255, 0.3);" id="retryBtn">RETRY</div>
      <div class="btn menu-btn" id="garageBtn">GARAGE</div>
    </div>

    <div class="control-btns">
      <div class="btn game-btn" id="boostBtn">BOOST</div>
      <div class="btn game-btn" id="jumpBtn">JUMP</div>
    </div>

    <canvas id="g"></canvas>
  </div>
</div>

<script>
/* ================================
   iOS/Safari ONLINE FIXES
   ================================ */

// Prevent scrolling, pinch zoom, double tap zoom on iOS browsers
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

// Also stop double-tap zoom
let lastTouchEnd = 0;
document.addEventListener('touchend', (event) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* ================================
   GAME CODE
   ================================ */

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d', { alpha: false });

let w, h, score = 0, best = localStorage.getItem('hb') || 0;
let over = true, paused = false, frame = 0;

let speed = 7, carHue = 200, rocks = [], stars = [], groundSpecks = [], particles = [], clouds = [];
let weatherTarget = 'clear', snowLvl = 0, rainLvl = 0;
let weatherTimer = 0, lightning = 0, thunderQueued = 0;

const car = { x: 280, y: 0, w: 94, h: 38, v: 0, g: 0.55, jump: -13.5, ground: 0, wheelA: 0 };

let audioCtx, mainGain;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  mainGain = audioCtx.createGain();
  mainGain.gain.value = 0.4;
  mainGain.connect(audioCtx.destination);

  setInterval(() => {
    if (over || paused || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime([55, 55, 65, 49][Math.floor(frame/30) % 4], audioCtx.currentTime);
    osc.type = 'sawtooth';
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(g); g.connect(mainGain);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }, 500);
}

function playSfx(f, t, d, v) {
  if(!audioCtx || paused) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = t;
  o.frequency.setValueAtTime(f, audioCtx.currentTime);
  g.gain.setValueAtTime(v, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + d);
  o.connect(g); g.connect(mainGain);
  o.start(); o.stop(audioCtx.currentTime + d);
}

function playThunder() {
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(40, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
  osc.connect(g); g.connect(mainGain);
  osc.start(); osc.stop(audioCtx.currentTime + 1.5);
}

function initStars() {
  stars = Array.from({length: 120}, () => ({ x: Math.random()*w, y: Math.random()*h*0.6, s: Math.random()*1.5, o: Math.random() }));
}
function initGround() {
  groundSpecks = Array.from({length: 80}, () => ({ x: Math.random()*w, y: 0, s: Math.random()*3 }));
}
function initClouds() {
  clouds = Array.from({length: 6}, () => ({ x: Math.random()*w, y: Math.random()*h*0.3, w: 200+Math.random()*200, s: 0.2+Math.random()*0.3 }));
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.replace(/#/g, ''), 16), bh = parseInt(b.replace(/#/g, ''), 16),
        ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
        br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
        rr = ar + t * (br - ar), rg = ag + t * (bg - ag), rb = ab + t * (bb - ab);
  return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
}

function updateWeather() {
  const mode = document.getElementById('weatherSelect').value;
  weatherTimer++;
  if(mode === 'dynamic' && weatherTimer > 900) {
    const choices = ['clear', 'rain', 'snow'];
    weatherTarget = choices[Math.floor(Math.random() * choices.length)];
    weatherTimer = 0;
  } else if (mode !== 'dynamic') {
    weatherTarget = mode;
  }

  snowLvl = (weatherTarget === 'snow') ? Math.min(1, snowLvl + 0.005) : Math.max(0, snowLvl - 0.005);
  rainLvl = (weatherTarget === 'rain') ? Math.min(1, rainLvl + 0.005) : Math.max(0, rainLvl - 0.005);

  if (rainLvl > 0.8 && Math.random() < 0.005) { lightning = 1; thunderQueued = 40; }
  if (lightning > 0) lightning -= 0.1;
  if (thunderQueued > 0 && --thunderQueued === 1) playThunder();

  if (frame % 2 === 0) {
    if (rainLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 15+Math.random()*5, vx: -2, type: 'rain', s: 2, op: rainLvl});
    if (snowLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 2+Math.random()*2, vx: Math.sin(frame/20)*2, type: 'snow', s: Math.random()*4, op: snowLvl});
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.y += p.vy; p.x += p.vx;
    if (p.y > h) particles.splice(i, 1);
  }

  clouds.forEach(c => { c.x = (c.x - c.s) % (w + c.w); if (c.x < -c.w) c.x = w; });
}

function drawEnvironment() {
  let skyBase = lerpColor('#020205', '#080812', rainLvl);
  let skyTop = lerpColor('#0a0a1a', '#1a1a25', rainLvl);
  let groundBase = lerpColor('#0a0806', '#eef2ff', snowLvl);

  let sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, skyBase);
  sky.addColorStop(1, skyTop);
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,w,h);

  if (lightning > 0) {
    ctx.fillStyle = `rgba(255,255,255,${lightning * 0.4})`;
    ctx.fillRect(0,0,w,h);
  }

  ctx.globalAlpha = 1 - rainLvl;
  ctx.fillStyle = "#fff";
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
  ctx.globalAlpha = 1;

  const time = Date.now() / 60000;
  const phase = (time % 1) * 2 - 1;
  ctx.save();
  ctx.translate(w*0.8, h*0.15);
  ctx.globalAlpha = 1 - (rainLvl * 0.8);
  ctx.fillStyle = "#fffde7";
  ctx.beginPath(); ctx.arc(0,0,35,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(phase * 40, 0, 35, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  clouds.forEach(c => {
    ctx.globalAlpha = 0.1 + (rainLvl * 0.5);
    ctx.fillStyle = "rgba(20,20,30,0.4)";
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w, c.w/3, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = groundBase;
  ctx.fillRect(0, car.ground, w, h-car.ground);
}

function updateCarHue() {
  carHue = +document.getElementById('hueSlider').value;
  document.getElementById('colorPreview').style.backgroundColor = `hsl(${carHue}, 80%, 50%)`;
}

/* ================================
   IMPORTANT FIX: proper resize scaling
   ================================ */
function resize() {
  const stage = document.getElementById('stage');
  w = stage.clientWidth;
  h = stage.clientHeight;

  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);

  // Reset transform BEFORE scaling (prevents broken input + blur)
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);

  car.ground = h * 0.78;
  car.y = car.ground - car.h;

  initStars(); initGround(); initClouds();
}

function openSub(id) {
  document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
  if(id !== 'none') document.getElementById(id).classList.remove('hidden');
}

function resetToMainMenu() {
  paused = false;
  over = true;
  openSub('startScreen');
}

function togglePause() {
  if(over) return;
  paused = !paused;
  if(paused) {
    openSub('startScreen');
    document.getElementById('continueBtn').classList.remove('hidden');
    document.getElementById('startBtn').classList.add('hidden');
  } else {
    openSub('none');
  }
}

function startGame() {
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  speed = parseInt(document.getElementById('speedRange').value, 10);
  score = 0;
  frame = 0;
  rocks = [];
  particles = [];
  over = false;
  paused = false;

  document.getElementById('continueBtn').classList.add('hidden');
  document.getElementById('startBtn').classList.remove('hidden');
  openSub('none');
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);

  ctx.fillStyle = `hsl(${carHue}, 85%, 45%)`;
  ctx.beginPath();
  ctx.roundRect(0, 8, car.w, 24, 10);
  ctx.fill();

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.roundRect(22, 0, 50, 18, [15, 15, 2, 2]);
  ctx.fill();

  ctx.shadowBlur = 15;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.fillRect(car.w-4, 14, 4, 12);

  ctx.fillStyle = '#f33';
  ctx.shadowColor = '#f33';
  ctx.fillRect(0, 14, 4, 12);

  ctx.shadowBlur = 0;

  const dw = (x) => {
    ctx.save();
    ctx.translate(x, car.h-4);
    ctx.rotate(car.wheelA);
    ctx.fillStyle = '#080808';
    ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 3;
    for(let i=0; i<5; i++){
      ctx.rotate(Math.PI*2/5);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0);
      ctx.stroke();
    }
    ctx.restore();
  };
  dw(22);
  dw(car.w-22);

  ctx.restore();
}

function die() {
  over = true;
  playSfx(50, 'square', 0.5, 0.3);
  document.getElementById('finalScore').innerText = `DISTANCE: ${score}m | RECORD: ${best}m`;
  if(score > best) {
    best = score;
    localStorage.setItem('hb', best);
  }
  openSub('crashScreen');
}

/* ================================
   INPUT: online + web app
   ================================ */

function jump() {
  if (over || paused) return;
  if (car.y >= car.ground - car.h - 5) {
    car.v = car.jump;
    playSfx(300, 'triangle', 0.15, 0.1);
  }
}

function boost(isOn) {
  if (over || paused) return;
  const bVal = parseInt(document.getElementById('speedRange').value, 10);
  speed = isOn ? bVal * 2.2 : bVal;
  if (isOn) playSfx(100, 'sawtooth', 0.1, 0.1);
}

// Reliable pointer events (fixes “buttons don’t work online”)
function bindHoldButton(el, onStart, onEnd) {
  let held = false;

  const start = (e) => {
    e.preventDefault();
    held = true;
    onStart();
  };

  const end = (e) => {
    e.preventDefault();
    if (!held) return;
    held = false;
    onEnd();
  };

  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}

// Bind UI buttons
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('continueBtn').addEventListener('click', togglePause);

document.getElementById('paintShopBtn').addEventListener('click', () => openSub('customMenu'));
document.getElementById('settingsBtn').addEventListener('click', () => openSub('settingsMenu'));
document.getElementById('paintDoneBtn').addEventListener('click', () => openSub('startScreen'));
document.getElementById('settingsSaveBtn').addEventListener('click', () => openSub('startScreen'));

document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('garageBtn').addEventListener('click', resetToMainMenu);

document.getElementById('hueSlider').addEventListener('input', updateCarHue);

// Game control buttons
bindHoldButton(document.getElementById('boostBtn'), () => boost(true), () => boost(false));
document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

// Keyboard controls for online players
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); jump(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); boost(true); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); boost(false); }
});

// Ensure pointer events work consistently
document.body.style.touchAction = 'none';

/* ================================
   GAME LOOP
   ================================ */

function update() {
  if (over || paused) return;

  frame++;
  if(frame % 60 === 0) score++;

  car.v += car.g;
  car.y += car.v;

  if (car.y + car.h >= car.ground) {
    car.y = car.ground - car.h;
    car.v = 0;
  }

  car.wheelA += speed * 0.12;

  if (frame % 150 === 0) rocks.push({x: w, w: 60 + Math.random()*40, h: 40 + Math.random()*30});

  for (let i = rocks.length - 1; i >= 0; i--) {
    const o = rocks[i];
    o.x -= speed;

    if (car.x + 15 < o.x + o.w && car.x + car.w - 15 > o.x && car.y + car.h > car.ground - o.h + 8) die();
    if (o.x + o.w < -100) rocks.splice(i, 1);
  }

  updateWeather();
  document.getElementById('scoreDisplay').innerText = score.toString().padStart(4, '0');
}

function draw() {
  drawEnvironment();

  ctx.fillStyle = "rgba(255,255,255,0.1)";
  groundSpecks.forEach(s => {
    s.x = (s.x - speed) % w;
    if(s.x < 0) s.x = w;
    ctx.fillRect(s.x, car.ground + (s.y++ % (h-car.ground)), s.s, 1);
  });

  // Rocks (still here for now)
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "transparent";
  rocks.forEach(o => {
    ctx.fillStyle = lerpColor('#1a1a1a', '#222222', snowLvl);
    ctx.beginPath();
    ctx.moveTo(o.x, car.ground);
    ctx.lineTo(o.x + o.w*0.2, car.ground - o.h*0.7);
    ctx.lineTo(o.x + o.w*0.5, car.ground - o.h);
    ctx.lineTo(o.x + o.w*0.8, car.ground - o.h*0.6);
    ctx.lineTo(o.x + o.w, car.ground);
    ctx.fill();

    if(snowLvl > 0.05) {
      ctx.fillStyle = `rgba(255,255,255,${snowLvl})`;
      ctx.beginPath();
      ctx.moveTo(o.x + o.w*0.2, car.ground - o.h*0.7);
      ctx.lineTo(o.x + o.w*0.5, car.ground - o.h);
      ctx.lineTo(o.x + o.w*0.8, car.ground - o.h*0.6);
      ctx.lineTo(o.x + o.w*0.5, car.ground - o.h*0.4);
      ctx.fill();
    }
  });

  particles.forEach(p => {
    ctx.globalAlpha = p.op;
    ctx.fillStyle = p.type === 'rain' ? '#7af' : '#fff';
    ctx.fillRect(p.x, p.y, (p.type==='rain'?1:p.s), p.s);
  });
  ctx.globalAlpha = 1;

  drawCar();
  update();
  requestAnimationFrame(draw);
}

// Start
updateCarHue();
resize();
draw();

window.addEventListener('resize', () => setTimeout(resize, 150));
</script>
</body>
</html>
