<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        :root { --squircle: 22px; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Force Horizontal Rotation */
        @media screen and (orientation: portrait) {
            #game-container { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: bottom left; position: absolute; top: -100vw; left: 0; }
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        #ui { position: absolute; top: 30px; left: 40px; right: 40px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; color: white; font-weight: 800; font-size: 22px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; padding: 20px; text-align: center; }
        
        /* Apple Squircle Buttons */
        .btn { 
            width: 140px; height: 60px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: white; font-weight: 600; font-size: 18px; border-radius: var(--squircle);
            display: flex; align-items: center; justify-content: center; margin: 10px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto;
        }
        .btn:active { transform: scale(0.92); background: rgba(255,255,255,0.3); }
        
        .control-btns { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .game-btn { width: 100px; height: 100px; border-radius: 30px; font-size: 16px; flex-direction: column; }

        .hidden { display: none !important; }
        .menu-row { display: flex; gap: 15px; }
        select, input { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 5px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui"><div id="scoreDisplay">SCORE: 0</div><div id="bestDisplay">BEST: 0</div></div>

        <div id="startScreen" class="overlay-screen">
            <h1 style="font-size: 48px; margin-bottom: 5px;">NIGHT DRIVE</h1>
            <p style="opacity: 0.7; margin-bottom: 30px;">Customize your ride and settings</p>
            <div class="menu-row">
                <div class="btn" onclick="showScreen('customScreen')">CUSTOMIZE</div>
                <div class="btn" onclick="showScreen('settingsScreen')">SETTINGS</div>
            </div>
            <div class="btn" style="width: 200px; background: #007AFF; border: none; margin-top: 20px;" onclick="startGame()">START ENGINE</div>
        </div>

        <div id="customScreen" class="overlay-screen hidden">
            <h2>CUSTOMIZE CAR</h2>
            <div class="menu-row">
                <div class="btn" onclick="setCarColor('#ff3b30')">RED</div>
                <div class="btn" onclick="setCarColor('#34c759')">GREEN</div>
                <div class="btn" onclick="setCarColor('#007AFF')">BLUE</div>
            </div>
            <div class="btn" onclick="showScreen('startScreen')">BACK</div>
        </div>

        <div id="settingsScreen" class="overlay-screen hidden">
            <h2>SETTINGS</h2>
            <div style="margin: 20px;">
                Speed: <input type="range" id="speedSetting" min="4" max="12" value="6">
            </div>
            <div class="btn" onclick="toggleAutoCycle()">AUTO DAY/NIGHT: <span id="cycleStatus">ON</span></div>
            <div class="btn" onclick="showScreen('startScreen')">BACK</div>
        </div>

        <div id="crashScreen" class="overlay-screen hidden">
            <h1 style="color: #ff3b30;">CRASHED</h1>
            <p id="finalScoreText" style="font-size: 24px;"></p>
            <div class="btn" style="width: 200px; background: #007AFF;" onclick="startGame()">RETRY</div>
        </div>

        <div class="control-btns">
            <div class="btn game-btn" id="boostBtn">BOOST</div>
            <div class="btn game-btn" id="jumpBtn">JUMP</div>
        </div>

        <canvas id="g"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, frame = 0;
        let speed = 5, isBoosting = false, carColor = '#ff3b30', autoCycle = true;
        let obstacles = [], stars = [], particles = [], timeOfDay = 0; // 0 = day, 1 = night

        const car = { x: 120, y: 0, w: 100, h: 35, v: 0, g: 0.5, jump: -11, ground: 0, air: false, wheelA: 0 };

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function setCarColor(c) { carColor = c; showScreen('startScreen'); }
        function toggleAutoCycle() { autoCycle = !autoCycle; document.getElementById('cycleStatus').innerText = autoCycle ? 'ON' : 'OFF'; }

        function resize() {
            const rect = canvas.getBoundingClientRect();
            w = rect.width; h = rect.height;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.72;
            car.y = car.ground - car.h;
        }

        function startGame() {
            speed = parseInt(document.getElementById('speedSetting').value);
            score = 0; frame = 0; obstacles = []; particles = []; over = false;
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
        }

        function drawRock(x, y, width, height) {
            ctx.fillStyle = '#444';
            ctx.beginPath();
            ctx.moveTo(x, y + height);
            ctx.lineTo(x + 5, y + 10);
            ctx.lineTo(x + width/2, y);
            ctx.lineTo(x + width - 5, y + 15);
            ctx.lineTo(x + width, y + height);
            ctx.closePath();
            ctx.fill();
            // Texture
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x + 10, y + 20); ctx.lineTo(x + 20, y + 10); ctx.stroke();
        }

        function update() {
            if (over) return;
            frame++;
            // 1 score per sec (approx 60 frames) + jump scores
            if (frame % 60 === 0) score++; 
            
            // Day Night Cycle
            if (autoCycle) {
                let cycleProgress = (score % 1000) / 1000;
                timeOfDay = cycleProgress > 0.5 ? 1 : 0;
            }

            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) {
                car.y = car.ground - car.h; car.v = 0; car.air = false;
            } else car.air = true;

            car.wheelA += speed * 0.08;

            if (frame % 110 === 0) obstacles.push({x: w, w: 50 + Math.random()*30, h: 40 + Math.random()*30, passed: false});
            
            obstacles.forEach((o, i) => {
                o.x -= speed;
                if (car.x < o.x + o.w && car.x + car.w > o.x && car.y + car.h > car.ground - o.h) die();
                if (!o.passed && o.x < car.x) { score += 5; o.passed = true; }
                if (o.x + o.w < 0) obstacles.splice(i, 1);
            });
            document.getElementById('scoreDisplay').innerText = "SCORE: " + score;
        }

        function draw() {
            // Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            if (timeOfDay === 0) { // Day
                skyGrad.addColorStop(0, '#74b9ff'); skyGrad.addColorStop(1, '#a29bfe');
            } else { // Night
                skyGrad.addColorStop(0, '#050510'); skyGrad.addColorStop(1, '#1a1a2e');
            }
            ctx.fillStyle = skyGrad; ctx.fillRect(0,0,w,h);

            // Ground
            ctx.fillStyle = timeOfDay === 0 ? '#2d3436' : '#0a0a0a';
            ctx.fillRect(0, car.ground, w, h-car.ground);

            obstacles.forEach(o => drawRock(o.x, car.ground - o.h, o.w, o.h));

            // Car
            ctx.save(); ctx.translate(car.x, car.y);
            ctx.fillStyle = carColor; ctx.fillRect(0, 5, car.w, car.h-10); // Body
            ctx.fillStyle = '#111'; ctx.fillRect(20, -8, 55, 15); // Roof
            // Lights
            ctx.shadowBlur = 10; ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff';
            ctx.fillRect(car.w-5, 8, 5, 8); // Head
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 8, 5, 8); // Tail
            ctx.shadowBlur = 0;
            ctx.restore();

            update(); requestAnimationFrame(draw);
        }

        function die() {
            over = true;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('finalScoreText').innerText = "Score: " + score + " | Best: " + best;
            document.getElementById('bestDisplay').innerText = "BEST: " + best;
            showScreen('crashScreen');
        }

        // Controls (Swapped as requested)
        document.getElementById('jumpBtn').addEventListener('touchstart', () => { if(!car.air && !over) car.v = car.jump; });
        document.getElementById('boostBtn').addEventListener('touchstart', () => { speed *= 2; isBoosting = true; });
        document.getElementById('boostBtn').addEventListener('touchend', () => { speed /= 2; isBoosting = false; });

        window.addEventListener('resize', () => setTimeout(resize, 100));
        resize(); draw();
    </script>
</body>
</html>
