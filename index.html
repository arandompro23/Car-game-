<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Night Drive Ultra — Stable Online Build</title>

<style>
  :root{
    --squircle: 28px;
    --glassA: rgba(255,255,255,0.22);
    --glassB: rgba(255,255,255,0.06);
    --glassBorder: rgba(255,255,255,0.22);
    --text: rgba(255,255,255,0.92);
  }

  html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
  }

  /* IMPORTANT:
     Do NOT globally touch-action none (breaks sliders).
     Only disable gestures on the canvas. */
  #game-container { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:#020205; }

  canvas {
    width:100%; height:100%;
    display:block;
    touch-action:none; /* stop scrolling on canvas only */
  }

  /* Top UI */
  #ui-top {
    position:absolute;
    top: calc(env(safe-area-inset-top) + 22px);
    left: 22px; right: 22px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
    z-index:20;
    color:white;
  }
  .stats {
    font-weight: 900;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    text-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  /* Overlays */
  .overlay-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    color:white;
    z-index:100;
    transition: opacity .25s ease, transform .25s ease;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .hidden{ display:none !important; }

  /* Liquid Glass Buttons */
  .btn{
    position:relative;
    pointer-events:auto;
    display:flex; align-items:center; justify-content:center;
    border-radius: var(--squircle);
    border: 1px solid var(--glassBorder);
    color: var(--text);
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;

    background: linear-gradient(145deg, var(--glassA) 0%, var(--glassB) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
      0 14px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.25);

    transform: translateZ(0);
    transition: transform .18s cubic-bezier(.2,0,.2,1), filter .18s ease;
    overflow:hidden;
  }

  /* Animated sheen */
  .btn::before{
    content:"";
    position:absolute; inset:-40%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 55%);
    transform: translateX(-40%) rotate(12deg);
    opacity:.65;
    animation: sheen 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sheen{
    0%{ transform: translateX(-45%) rotate(12deg); opacity:.40; }
    50%{ transform: translateX(20%) rotate(12deg); opacity:.70; }
    100%{ transform: translateX(-45%) rotate(12deg); opacity:.40; }
  }

  .btn:active{
    transform: scale(0.94) translateY(3px);
    filter: brightness(1.06);
  }

  .menu-btn{ width:min(86vw, 320px); height:64px; font-size:16px; }
  .pause-btn{ width:66px; height:66px; border-radius:22px; font-size:22px; pointer-events:auto; }

  /* Control buttons */
  .control-btns{
    position:absolute;
    bottom: calc(env(safe-area-inset-bottom) + 6%);
    left:0; right:0;
    display:flex; justify-content:space-between;
    padding: 0 70px;
    pointer-events:none;
    z-index:30;
  }
  .game-btn{ width:125px; height:125px; border-radius:40px; font-size:15px; }

  /* Settings / Paint UI */
  .panel{
    width:min(90vw, 460px);
    border-radius: 34px;
    padding: 18px 18px 16px;
    border:1px solid rgba(255,255,255,0.18);
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
  }
  .panel h2{
    margin: 8px 0 14px;
    font-size: 22px;
    letter-spacing: 2px;
    text-align:center;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 10px 0; }
  .row label{ font-size: 12px; opacity:.85; letter-spacing:1.6px; text-transform:uppercase; }
  input[type=range], select{
    width: 100%;
    margin: 6px 0 0;
    accent-color: white;
  }
  select{
    padding: 10px;
    border-radius: 12px;
    border:1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.25);
    color: white;
  }

  #colorPreview{
    width:100%;
    height:46px;
    border-radius: 16px;
    border:1px solid rgba(255,255,255,0.25);
    margin: 8px 0 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
  }

  /* Vehicle selector */
  .vehicleBar{
    display:flex; gap:10px; justify-content:space-between;
    margin-top: 10px;
  }
  .chip{
    flex:1;
    height:44px;
    border-radius: 18px;
    font-size: 12px;
    letter-spacing: 1.8px;
  }
  .chip.active{
    border-color: rgba(255,255,255,0.5);
    filter: brightness(1.08);
  }

  /* Back button always visible in sub menus */
  .backRow{ display:flex; gap:10px; margin-top: 12px; }
  .backBtn{ flex:1; height:60px; font-size: 15px; }
  .doneBtn{ flex:1; height:60px; font-size: 15px; }

</style>
</head>

<body>
<div id="game-container">
  <div id="stage">
    <div id="ui-top">
      <div class="stats" id="scoreDisplay">0000</div>
      <div class="btn pause-btn" id="pauseBtn">II</div>
    </div>

    <!-- START / PAUSE MENU -->
    <div id="startScreen" class="overlay-screen">
      <h1 style="font-size:56px;margin:0 0 10px;font-weight:900;letter-spacing:-1px;">NIGHT DRIVE</h1>
      <div id="continueBtn" class="btn menu-btn hidden" style="background: linear-gradient(145deg, rgba(46,204,113,0.35), rgba(46,204,113,0.10));">CONTINUE</div>
      <div id="startBtn" class="btn menu-btn" style="background: linear-gradient(145deg, rgba(0,122,255,0.35), rgba(0,122,255,0.10));">START ENGINE</div>
      <div id="paintBtn" class="btn menu-btn">PAINT SHOP</div>
      <div id="settingsBtn" class="btn menu-btn">SETTINGS</div>
    </div>

    <!-- PAINT SHOP -->
    <div id="customMenu" class="overlay-screen hidden">
      <div class="panel">
        <h2>PAINT SHOP</h2>

        <div id="colorPreview"></div>

        <div class="row">
          <label style="min-width:92px;">COLOUR</label>
          <div style="flex:1;">
            <input type="range" id="mainColorSlider" min="0" max="360" value="200">
          </div>
        </div>

        <div class="row">
          <label style="min-width:92px;">DETAIL</label>
          <div style="flex:1;">
            <input type="range" id="detailSlider" min="0" max="100" value="45">
          </div>
        </div>

        <div style="margin-top:14px;">
          <div style="font-size:12px;opacity:.8;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px;text-align:center;">
            VEHICLE
          </div>
          <div class="vehicleBar">
            <div class="btn chip" id="carSport">SPORT</div>
            <div class="btn chip" id="carSUV">SUV</div>
            <div class="btn chip" id="carHatch">HATCH</div>
          </div>
        </div>

        <div class="backRow">
          <div class="btn backBtn" id="paintBack">BACK</div>
          <div class="btn doneBtn" id="paintDone" style="background: linear-gradient(145deg, rgba(0,122,255,0.35), rgba(0,122,255,0.10));">DONE</div>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="settingsMenu" class="overlay-screen hidden">
      <div class="panel">
        <h2>SETTINGS</h2>

        <div class="row">
          <label style="min-width:120px;">BASE SPEED</label>
          <div style="flex:1;">
            <input type="range" id="speedRange" min="7" max="16" value="11">
          </div>
        </div>

        <div class="row">
          <label style="min-width:120px;">WEATHER</label>
          <div style="flex:1;">
            <select id="weatherSelect">
              <option value="dynamic">DYNAMIC</option>
              <option value="clear">CLEAR</option>
              <option value="rain">RAIN</option>
              <option value="snow">SNOW</option>
            </select>
          </div>
        </div>

        <div class="backRow">
          <div class="btn backBtn" id="settingsBack">BACK</div>
          <div class="btn doneBtn" id="settingsSave" style="background: linear-gradient(145deg, rgba(46,204,113,0.35), rgba(46,204,113,0.10));">SAVE</div>
        </div>
      </div>
    </div>

    <!-- CRASH -->
    <div id="crashScreen" class="overlay-screen hidden">
      <h1 style="color:#ff3b30;font-size:60px;font-weight:900;margin:0;">CRASHED</h1>
      <p id="finalScore" style="font-size:24px;margin:18px 0 10px;"></p>
      <div id="retryBtn" class="btn menu-btn" style="background: linear-gradient(145deg, rgba(0,122,255,0.35), rgba(0,122,255,0.10));">RETRY</div>
      <div id="garageBtn" class="btn menu-btn">GARAGE</div>
    </div>

    <div class="control-btns">
      <div class="btn game-btn" id="boostBtn">BOOST</div>
      <div class="btn game-btn" id="jumpBtn">JUMP</div>
    </div>

    <canvas id="g"></canvas>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('g');
  const ctx = canvas.getContext('2d');

  // ----------- STATE -----------
  let w=0, h=0;
  let score = 0;
  let best = parseInt(localStorage.getItem('hb') || '0', 10);
  let over = true;
  let paused = false;
  let frame = 0;

  // Movement
  let speed = 11;                 // faster default
  let boostOn = false;
  let boostFx = 0;                // 0..1 visual boost effect
  let lastT = performance.now();

  // Paint
  let carHue = parseFloat(localStorage.getItem('carHue') || '200');
  let carDetail = parseFloat(localStorage.getItem('carDetail') || '45');
  let carModel = localStorage.getItem('carModel') || 'sport'; // sport/suv/hatch

  // Weather
  let weatherTarget = 'clear', snowLvl = 0, rainLvl = 0;
  let weatherTimer = 0, lightning = 0, thunderQueued = 0;

  // World
  let rocks = []; // now "wrecked cars"
  let stars = [], groundSpecks = [], particles = [], clouds = [];

  const car = {
    x: 280, y: 0, w: 96, h: 40,
    v: 0, g: 0.55, jump: -13.5,
    ground: 0, wheelA: 0
  };

  // ----------- AUDIO -----------
  let audioCtx, mainGain;
  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mainGain = audioCtx.createGain();
    mainGain.gain.value = 0.4;
    mainGain.connect(audioCtx.destination);

    setInterval(() => {
      if(over || paused || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.setValueAtTime([55,55,65,49][Math.floor(frame/30)%4], audioCtx.currentTime);
      osc.type = 'sawtooth';
      g.gain.setValueAtTime(0.06 + boostFx*0.03, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.connect(g); g.connect(mainGain);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }, 500);
  }

  function playSfx(f, t, d, v){
    if(!audioCtx || paused) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + d);
    o.connect(g); g.connect(mainGain);
    o.start(); o.stop(audioCtx.currentTime + d);
  }

  function playThunder(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(40, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
    osc.connect(g); g.connect(mainGain);
    osc.start(); osc.stop(audioCtx.currentTime + 1.5);
  }

  // ----------- UI HOOKS -----------
  const $ = (id) => document.getElementById(id);

  function openSub(id){
    document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
    if(id !== 'none') $(id).classList.remove('hidden');
  }

  function togglePause(){
    if(over) return;
    paused = !paused;
    if(paused){
      openSub('startScreen');
      $('continueBtn').classList.remove('hidden');
      $('startBtn').classList.add('hidden');
    }else{
      openSub('none');
    }
  }

  function resetToMainMenu(){
    paused=false; over=true;
    openSub('startScreen');
    $('continueBtn').classList.add('hidden');
    $('startBtn').classList.remove('hidden');
  }

  function startGame(){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    speed = parseInt($('speedRange').value, 10);
    score = 0; frame = 0;
    rocks = []; particles = [];
    over = false; paused = false;
    boostOn = false; boostFx = 0;

    openSub('none');
  }

  // reliable pointer events (no elementFromPoint)
  $('pauseBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); togglePause(); });
  $('startBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); startGame(); });
  $('continueBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); togglePause(); });
  $('settingsBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('settingsMenu'); });
  $('paintBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('customMenu'); });

  $('settingsBack').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });
  $('settingsSave').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });

  $('paintBack').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });
  $('paintDone').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });

  $('retryBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); startGame(); });
  $('garageBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); resetToMainMenu(); });

  // ----------- COLOR / MODEL UI -----------
  $('mainColorSlider').value = carHue;
  $('detailSlider').value = carDetail;

  function setActiveModel(){
    $('carSport').classList.toggle('active', carModel==='sport');
    $('carSUV').classList.toggle('active', carModel==='suv');
    $('carHatch').classList.toggle('active', carModel==='hatch');
  }

  function updatePreview(){
    // detail slider adjusts saturation/brightness mix
    const sat = 55 + (carDetail*0.35);
    const lum = 38 + (carDetail*0.18);
    $('colorPreview').style.background = `linear-gradient(145deg,
      hsla(${carHue}, ${sat}%, ${lum+10}%, 0.95),
      hsla(${carHue}, ${sat}%, ${lum-8}%, 0.85)
    )`;
  }

  function savePaint(){
    localStorage.setItem('carHue', String(carHue));
    localStorage.setItem('carDetail', String(carDetail));
    localStorage.setItem('carModel', carModel);
  }

  $('mainColorSlider').addEventListener('input', () => {
    carHue = parseFloat($('mainColorSlider').value);
    updatePreview(); savePaint();
  });
  $('detailSlider').addEventListener('input', () => {
    carDetail = parseFloat($('detailSlider').value);
    updatePreview(); savePaint();
  });

  function bindModelBtn(id, model){
    $(id).addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      carModel = model;
      setActiveModel();
      savePaint();
      playSfx(220, 'triangle', 0.08, 0.08);
    });
  }
  bindModelBtn('carSport','sport');
  bindModelBtn('carSUV','suv');
  bindModelBtn('carHatch','hatch');

  setActiveModel();
  updatePreview();

  // ----------- RESIZE (FIX UI DRIFT) -----------
  // Use visualViewport when available to avoid iOS 100vh jumping
  function getViewportSize(){
    const vv = window.visualViewport;
    if(vv) return { w: Math.round(vv.width), h: Math.round(vv.height) };
    return { w: window.innerWidth, h: window.innerHeight };
  }

  function initStars(){ stars = Array.from({length: 120}, () => ({ x: Math.random()*w, y: Math.random()*h*0.6, s: Math.random()*1.5, o: Math.random() })); }
  function initGround(){ groundSpecks = Array.from({length: 80}, () => ({ x: Math.random()*w, y: 0, s: Math.random()*3 })); }
  function initClouds(){ clouds = Array.from({length: 6}, () => ({ x: Math.random()*w, y: Math.random()*h*0.3, w: 200+Math.random()*200, s: 0.2+Math.random()*0.3 })); }

  function resize(){
    const vp = getViewportSize();
    w = vp.w; h = vp.h;

    const dpr = Math.min(2, window.devicePixelRatio || 1);

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    // CRITICAL FIX: reset transform before scaling (prevents slow-motion / drift)
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);

    car.ground = h * 0.78;
    car.y = car.ground - car.h;

    initStars(); initGround(); initClouds();
  }

  window.addEventListener('resize', () => setTimeout(resize, 80));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', () => setTimeout(resize, 80));
    window.visualViewport.addEventListener('scroll', () => setTimeout(resize, 80));
  }

  // ----------- WEATHER -----------
  function lerpColor(a,b,t){
    const ah=parseInt(a.replace(/#/g,''),16), bh=parseInt(b.replace(/#/g,''),16);
    const ar=ah>>16, ag=ah>>8&0xff, ab=ah&0xff;
    const br=bh>>16, bg=bh>>8&0xff, bb=bh&0xff;
    const rr = ar + t*(br-ar);
    const rg = ag + t*(bg-ag);
    const rb = ab + t*(bb-ab);
    return '#' + ((1<<24) + ((rr|0)<<16) + ((rg|0)<<8) + (rb|0)).toString(16).slice(1);
  }

  function updateWeather(){
    const mode = $('weatherSelect').value;
    weatherTimer++;
    if(mode === 'dynamic' && weatherTimer > 900){
      const choices = ['clear','rain','snow'];
      weatherTarget = choices[(Math.random()*choices.length)|0];
      weatherTimer=0;
    }else if(mode !== 'dynamic'){ weatherTarget = mode; }

    snowLvl = (weatherTarget==='snow') ? Math.min(1, snowLvl+0.005) : Math.max(0, snowLvl-0.005);
    rainLvl = (weatherTarget==='rain') ? Math.min(1, rainLvl+0.005) : Math.max(0, rainLvl-0.005);

    if(rainLvl > 0.8 && Math.random() < 0.005){
      lightning = 1; thunderQueued = 40;
    }
    if(lightning > 0) lightning -= 0.1;
    if(thunderQueued > 0 && --thunderQueued === 1) playThunder();

    if(frame % 2 === 0){
      if(rainLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 16+Math.random()*6, vx: -2, type:'rain', s:2, op: rainLvl});
      if(snowLvl > 0.1) particles.push({x: Math.random()*w, y: -10, vy: 2+Math.random()*2, vx: Math.sin(frame/20)*2, type:'snow', s: Math.random()*4, op: snowLvl});
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.y += p.vy; p.x += p.vx;
      if(p.y > h) particles.splice(i,1);
    }
    clouds.forEach(c => { c.x = (c.x - c.s) % (w + c.w); if(c.x < -c.w) c.x = w; });
  }

  function drawEnvironment(){
    const skyBase = lerpColor('#020205', '#080812', rainLvl);
    const skyTop  = lerpColor('#0a0a1a', '#1a1a25', rainLvl);
    const groundBase = lerpColor('#0a0806', '#eef2ff', snowLvl);

    const sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0, skyBase);
    sky.addColorStop(1, skyTop);
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,w,h);

    if(lightning>0){
      ctx.fillStyle = `rgba(255,255,255,${lightning*0.4})`;
      ctx.fillRect(0,0,w,h);
    }

    ctx.globalAlpha = 1 - rainLvl;
    ctx.fillStyle="#fff";
    stars.forEach(s => ctx.fillRect(s.x,s.y,s.s,s.s));
    ctx.globalAlpha=1;

    // moon
    const time = Date.now()/60000;
    const phase = (time%1)*2-1;
    ctx.save();
    ctx.translate(w*0.8, h*0.15);
    ctx.globalAlpha = 1 - (rainLvl*0.8);
    ctx.fillStyle="#fffde7";
    ctx.beginPath(); ctx.arc(0,0,35,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(phase*40,0,35,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';

    clouds.forEach(c=>{
      ctx.globalAlpha = 0.1 + (rainLvl*0.5);
      ctx.fillStyle="rgba(20,20,30,0.4)";
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w, c.w/3, 0, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1;

    ctx.fillStyle = groundBase;
    ctx.fillRect(0, car.ground, w, h-car.ground);
  }

  // ----------- OBSTACLES: WRECKED CARS -----------
  function spawnWreck(){
    const type = Math.random() < 0.35 ? 'burning' : 'wreck';
    const scale = 0.9 + Math.random()*0.35;
    const ww = 120*scale + Math.random()*40;
    const hh = 52*scale + Math.random()*16;
    rocks.push({
      x: w + 50,
      y: car.ground,
      w: ww,
      h: hh,
      type,
      wob: Math.random()*Math.PI*2
    });
  }

  function drawWreck(o){
    const baseY = car.ground;
    const x = o.x;
    const y = baseY - o.h;

    // body
    const metal = lerpColor('#2a2a2f', '#dfe6ff', snowLvl*0.35);
    ctx.fillStyle = metal;
    ctx.beginPath();
    ctx.roundRect(x, y+10, o.w, o.h-10, 12);
    ctx.fill();

    // crushed roof
    ctx.fillStyle = lerpColor('#1d1d22', '#cfd6ff', snowLvl*0.25);
    ctx.beginPath();
    ctx.moveTo(x+o.w*0.18, y+18);
    ctx.lineTo(x+o.w*0.55, y+2);
    ctx.lineTo(x+o.w*0.86, y+22);
    ctx.lineTo(x+o.w*0.18, y+22);
    ctx.fill();

    // broken windows
    ctx.fillStyle = 'rgba(10,10,12,0.75)';
    ctx.beginPath();
    ctx.roundRect(x+o.w*0.26, y+16, o.w*0.46, o.h*0.32, 10);
    ctx.fill();
    // cracks
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x+o.w*0.32, y+20);
    ctx.lineTo(x+o.w*0.48, y+34);
    ctx.lineTo(x+o.w*0.40, y+44);
    ctx.stroke();

    // rims/tires (wrecked)
    const wheel = (cx)=>{
      ctx.save();
      ctx.translate(cx, baseY-6);
      ctx.rotate(Math.sin(frame/18 + o.wob)*0.08);
      ctx.fillStyle='#050505';
      ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3a3a3a';
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.18)';
      ctx.lineWidth=2;
      for(let i=0;i<5;i++){
        ctx.rotate(Math.PI*2/5);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(9,0); ctx.stroke();
      }
      ctx.restore();
    };
    wheel(x+o.w*0.22);
    wheel(x+o.w*0.80);

    // scorch marks
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x+o.w*0.58, y+o.h*0.62, o.w*0.35, o.h*0.22, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // burning (visual only)
    if(o.type === 'burning'){
      const fx = x + o.w*0.62;
      const fy = y + o.h*0.15;
      const t = frame/6;

      // glow
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = 'rgba(255,120,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(fx, fy+18, 30, 18, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // flames
      for(let i=0;i<4;i++){
        const px = fx + Math.sin(t+i)*10;
        const py = fy + i*6 + Math.cos(t*1.2+i)*4;
        ctx.fillStyle = `rgba(255, ${120+i*25}, 0, 0.55)`;
        ctx.beginPath();
        ctx.ellipse(px, py, 10-i*1.5, 18-i*2.2, 0, 0, Math.PI*2);
        ctx.fill();
      }
      // smoke
      if(frame%3===0){
        particles.push({x: fx, y: fy, vy: -1.2-Math.random(), vx: -0.2+Math.random()*0.4, type:'smoke', s: 10+Math.random()*14, op: 0.22});
      }
    }
  }

  // ----------- CAR DRAW (3 MODELS) -----------
  function carPaint(){
    const sat = 55 + (carDetail*0.35);
    const lum = 38 + (carDetail*0.18);
    return {
      body: `hsl(${carHue}, ${sat}%, ${lum}%)`,
      hi:   `hsla(${carHue}, ${sat}%, ${lum+16}%, 0.95)`,
      win:  'rgba(15,15,18,0.92)'
    };
  }

  function drawCar(){
    const P = carPaint();
    ctx.save();
    ctx.translate(car.x, car.y);

    // boost motion glow
    if(boostFx>0.02){
      ctx.globalAlpha = 0.45*boostFx;
      ctx.fillStyle = `hsla(${carHue}, 90%, 60%, 0.35)`;
      ctx.beginPath();
      ctx.ellipse(-18, 22, 60, 20, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if(carModel === 'sport') drawSport(P);
    else if(carModel === 'suv') drawSUV(P);
    else drawHatch(P);

    ctx.restore();
  }

  function drawSport(P){
    // body
    ctx.fillStyle = P.body;
    ctx.beginPath();
    ctx.roundRect(0, 10, car.w, 24, 12);
    ctx.fill();

    // highlight
    ctx.globalAlpha=0.8;
    ctx.fillStyle = P.hi;
    ctx.beginPath();
    ctx.roundRect(6, 12, car.w-12, 8, 10);
    ctx.fill();
    ctx.globalAlpha=1;

    // cabin
    ctx.fillStyle = P.win;
    ctx.beginPath();
    ctx.roundRect(26, 2, 54, 18, [16,16,4,4]);
    ctx.fill();

    drawLightsAndWheels(0.0);
    drawBoostExhaust();
  }

  function drawSUV(P){
    // taller body
    ctx.fillStyle = P.body;
    ctx.beginPath();
    ctx.roundRect(0, 6, car.w, 30, 10);
    ctx.fill();

    ctx.globalAlpha=0.8;
    ctx.fillStyle=P.hi;
    ctx.beginPath();
    ctx.roundRect(6, 10, car.w-12, 10, 10);
    ctx.fill();
    ctx.globalAlpha=1;

    // windows bigger
    ctx.fillStyle=P.win;
    ctx.beginPath();
    ctx.roundRect(18, 0, 64, 22, [12,12,4,4]);
    ctx.fill();

    drawLightsAndWheels(0.15);
    drawBoostExhaust();
  }

  function drawHatch(P){
    // compact
    ctx.fillStyle=P.body;
    ctx.beginPath();
    ctx.roundRect(0, 10, car.w, 26, 10);
    ctx.fill();

    ctx.globalAlpha=0.8;
    ctx.fillStyle=P.hi;
    ctx.beginPath();
    ctx.roundRect(6, 13, car.w-12, 8, 10);
    ctx.fill();
    ctx.globalAlpha=1;

    // windows
    ctx.fillStyle=P.win;
    ctx.beginPath();
    ctx.roundRect(22, 2, 56, 18, [14,14,4,4]);
    ctx.fill();

    // rear hatch bump
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.roundRect(0, 14, 12, 18, 6);
    ctx.fill();

    drawLightsAndWheels(-0.05);
    drawBoostExhaust();
  }

  function drawLightsAndWheels(modelOffset){
    // headlights/taillights
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#fff';
    ctx.fillStyle='#fff';
    ctx.fillRect(car.w-4, 16+modelOffset*8, 4, 12);
    ctx.shadowColor = '#f33';
    ctx.fillStyle='#f33';
    ctx.fillRect(0, 16+modelOffset*8, 4, 12);
    ctx.shadowBlur=0;

    // wheels
    const dw = (x)=>{
      ctx.save();
      ctx.translate(x, car.h-4);
      ctx.rotate(car.wheelA);
      ctx.fillStyle='#080808';
      ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#444'; ctx.lineWidth=3;
      for(let i=0;i<5;i++){
        ctx.rotate(Math.PI*2/5);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.stroke();
      }
      ctx.restore();
    };
    dw(22);
    dw(car.w-22);
  }

  function drawBoostExhaust(){
    if(boostFx < 0.05) return;
    const t = frame/5;
    const ex = -6;
    const ey = 26;

    ctx.globalAlpha = 0.85*boostFx;
    ctx.fillStyle = 'rgba(255,120,0,0.65)';
    ctx.beginPath();
    ctx.ellipse(ex - 10 - Math.sin(t)*4, ey + Math.cos(t)*2, 18, 10, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = 0.65*boostFx;
    ctx.fillStyle = 'rgba(120,200,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(ex - 22 - Math.cos(t)*6, ey, 28, 14, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }

  // ----------- UPDATE / PHYSICS (deltaTime) -----------
  function die(){
    over=true;
    playSfx(50,'square',0.5,0.3);
    $('finalScore').innerText = `DISTANCE: ${score}m | RECORD: ${best}m`;
    if(score>best){ best=score; localStorage.setItem('hb', String(best)); }
    openSub('crashScreen');
  }

  function update(dt){
    if(over || paused) return;

    frame++;

    // score
    if(frame % 60 === 0) score++;

    // boost smoothing
    boostFx += (boostOn ? 0.08 : -0.08);
    boostFx = Math.max(0, Math.min(1, boostFx));

    const baseSpeed = speed;
    const spd = baseSpeed * (boostOn ? 2.2 : 1);

    // gravity
    car.v += car.g * (dt*60);
    car.y += car.v * (dt*60);

    if(car.y + car.h >= car.ground){
      car.y = car.ground - car.h;
      car.v = 0;
    }

    car.wheelA += spd * 0.12 * (dt*60);

    // spawn wrecks
    if(frame % 140 === 0) spawnWreck();

    for(let i=rocks.length-1;i>=0;i--){
      const o = rocks[i];
      o.x -= spd * (dt*60);

      // collision box
      const hitY = car.ground - o.h + 8;
      if (car.x + 15 < o.x + o.w && car.x + car.w - 15 > o.x && car.y + car.h > hitY){
        die();
      }

      if(o.x + o.w < -140) rocks.splice(i,1);
    }

    updateWeather();

    $('scoreDisplay').innerText = score.toString().padStart(4,'0');
  }

  // ----------- DRAW LOOP -----------
  function draw(){
    const now = performance.now();
    const dt = Math.min(0.04, (now - lastT)/1000); // clamp
    lastT = now;

    // environment
    drawEnvironment();

    // boost streaks
    if(boostFx>0.05){
      ctx.globalAlpha = 0.18*boostFx;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for(let i=0;i<12;i++){
        const yy = (i/12)*car.ground;
        const len = 80 + Math.random()*120;
        ctx.fillRect(w - len - Math.random()*200, yy, len, 2);
      }
      ctx.globalAlpha=1;
    }

    // ground specks
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    groundSpecks.forEach(s=>{
      s.x = (s.x - (speed*(boostOn?2.2:1))) % w;
      if(s.x<0) s.x = w;
      ctx.fillRect(s.x, car.ground + (s.y++ % (h-car.ground)), s.s, 1);
    });

    // wrecks
    rocks.forEach(drawWreck);

    // particles
    particles.forEach(p=>{
      if(p.type==='smoke'){
        ctx.globalAlpha = p.op;
        ctx.fillStyle = 'rgba(120,120,130,0.35)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.s, p.s*0.7, 0, 0, Math.PI*2);
        ctx.fill();
        p.y += p.vy; p.x += p.vx;
        p.op *= 0.985;
      } else {
        ctx.globalAlpha = p.op;
        ctx.fillStyle = p.type==='rain' ? '#7af' : '#fff';
        ctx.fillRect(p.x, p.y, (p.type==='rain'?1:p.s), p.s);
      }
    });
    ctx.globalAlpha=1;

    // car
    drawCar();

    // update last (keeps visuals smooth)
    update(dt);

    requestAnimationFrame(draw);
  }

  // ----------- INPUT (stable) -----------
  function pressJump(){
    if(over || paused) return;
    if(car.y >= car.ground - car.h - 5){
      car.v = car.jump;
      playSfx(320,'triangle',0.14,0.12);
    }
  }

  function setBoost(on){
    if(over || paused) return;
    boostOn = on;
    if(on) playSfx(100,'sawtooth',0.10,0.10);
  }

  // pointer events for buttons (reliable)
  $('jumpBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); pressJump(); });
  $('boostBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); setBoost(true); });
  $('boostBtn').addEventListener('pointerup',   (e)=>{ e.preventDefault(); setBoost(false); });
  $('boostBtn').addEventListener('pointercancel',(e)=>{ e.preventDefault(); setBoost(false); });

  // keyboard
  window.addEventListener('keydown', (e)=>{
    if(e.code==='Space') pressJump();
    if(e.code==='ShiftLeft' || e.code==='ShiftRight') setBoost(true);
    if(e.code==='Escape'){
      if(!over) togglePause();
      else resetToMainMenu();
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code==='ShiftLeft' || e.code==='ShiftRight') setBoost(false);
  });

  // Prevent double-tap zoom on iOS while keeping sliders working
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 280) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  // ----------- START -----------
  resize();
  openSub('startScreen');
  draw();

})();
</script>
</body>
</html>
