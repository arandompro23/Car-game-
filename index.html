<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Night Drive Ultra: Phase 7</title>
<style>
:root { --squircle:28px; --glass:linear-gradient(145deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.03) 100%);}
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"SF Pro Display",-apple-system,sans-serif;}
#game-container{width:100vw;height:100vh;position:relative;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;overflow:hidden;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;}
#ui-top{position:absolute;top:20px;left:50px;right:50px;display:flex;justify-content:space-between;align-items:center;z-index:10;color:white;pointer-events:none;}
.stats{font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.control-btns{position:absolute;bottom:8%;width:100%;display:flex;justify-content:space-between;padding:0 70px;box-sizing:border-box;pointer-events:none;}
.btn{background:var(--glass);border:1px solid rgba(255,255,255,0.25);border-radius:var(--squircle);color:white;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all 0.2s cubic-bezier(0.15,0,0.15,1);pointer-events:auto;backdrop-filter:blur(20px);}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(255,255,255,0.3);}
.btn:active{transform:scale(0.95) translateY(3px);box-shadow:0 0 10px rgba(255,255,255,0.5);}
.game-btn{width:125px;height:125px;border-radius:40px;font-size:16px;font-weight:800;border-width:2px;}
.menu{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;z-index:50;display:none;}
.car-btn{margin:10px;width:200px;height:60px;font-size:16px;}
.specs{margin-top:20px;text-align:center;}
.menu-btn{margin-top:10px;width:180px;height:50px;font-size:16px;}
input[type=range]{width:220px;margin:10px;}
</style>
</head>
<body>
<div id="game-container">
<div id="stage">
<div id="ui-top">
  <div class="stats" id="scoreDisplay">0000</div>
  <div class="btn menu-btn" onclick="openGarage()">Garage</div>
</div>
<div class="control-btns">
  <div class="btn game-btn" id="boostBtn">BOOST</div>
  <div class="btn game-btn" id="jumpBtn">JUMP</div>
</div>
<canvas id="g"></canvas>

<!-- Garage Menu -->
<div id="garageMenu" class="menu">
  <h2>Garage</h2>
  <button class="btn car-btn" onclick="selectCar(0)">Sports Car</button>
  <button class="btn car-btn" onclick="selectCar(1)">SUV</button>
  <button class="btn car-btn" onclick="selectCar(2)">Hatchback</button>
  <div class="specs" id="carSpecs"></div>
  <div class="btn menu-btn" onclick="openPaint()">Paint</div>
  <div class="btn menu-btn" onclick="openShop()">Shop</div>
  <div class="btn menu-btn" onclick="closeGarage()">Back</div>
</div>

<!-- Paint Menu -->
<div id="paintMenu" class="menu">
  <h2>Paint Shop</h2>
  <label for="colorSlider">Colour:</label>
  <input type="range" id="colorSlider" min="0" max="360" value="0" oninput="updateCarColor()">
  <label for="shadeSlider">Hue:</label>
  <input type="range" id="shadeSlider" min="-30" max="30" value="0" oninput="updateCarColor()">
  <div class="btn menu-btn" onclick="closePaint()">Back</div>
</div>

<!-- Shop Menu -->
<div id="shopMenu" class="menu">
  <h2>Car Shop</h2>
  <div class="specs" id="shopContent">Spend points on boosts and parts here!</div>
  <div class="btn menu-btn" onclick="closeShop()">Back</div>
</div>
</div>
</div>

<script>
// Canvas
const canvas=document.getElementById('g'),ctx=canvas.getContext('2d');
let w,h,score=0,frame=0,speed=5;
let rocks=[],particles=[],boostEffect=[],debris=[],shake=0;
const car={x:280,y:0,w:94,h:38,v:0,g:0.55,jump:-13.5,ground:0,wheelA:0};
let points=0;

// Cars & Stats
let cars=[
  {name:"Sports Car",colorHue:0,shade:0,speed:1.2,jump:-15},
  {name:"SUV",colorHue:200,shade:0,speed:0.9,jump:-18},
  {name:"Hatchback",colorHue:120,shade:0,speed:1,jump:-13}
];
let currentCar=0;

// Resize
function resize(){w=canvas.offsetWidth;h=canvas.offsetHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);car.ground=h*0.78;car.y=car.ground-car.h;}
window.addEventListener('resize',()=>setTimeout(resize,100));
resize();

// Mountains for parallax
let mountainsFar=[],mountainsNear=[];
function initMountains(){
  mountainsFar=Array.from({length:5},(_,i)=>({x:i*w/4,y:h*0.35+Math.random()*30,w:w/3,h:100+Math.random()*40}));
  mountainsNear=Array.from({length:6},(_,i)=>({x:i*w/5,y:h*0.5+Math.random()*20,w:w/4,h:120+Math.random()*50}));
}
initMountains();

// Stars
let stars=Array.from({length:120},()=>({x:Math.random()*w,y:Math.random()*h*0.6,s:Math.random()*1.5}));

// Update car color
function updateCarColor(){const c=cars[currentCar];c.colorHue=parseInt(document.getElementById('colorSlider').value);c.shade=parseInt(document.getElementById('shadeSlider').value);}

// Garage functions
function selectCar(index){currentCar=index;const c=cars[index];document.getElementById('carSpecs').innerHTML=`<strong>${c.name}</strong><br>Speed: ${c.speed}<br>Jump: ${-c.jump}`;}
function openGarage(){document.getElementById('garageMenu').style.display='flex';}
function closeGarage(){document.getElementById('garageMenu').style.display='none';}
function openPaint(){document.getElementById('paintMenu').style.display='flex';}
function closePaint(){document.getElementById('paintMenu').style.display='none';}
function openShop(){document.getElementById('shopMenu').style.display='flex';}
function closeShop(){document.getElementById('shopMenu').style.display='none';}

// Input
let boostBtnPressed=false;
['touchstart','touchend'].forEach(evt=>{
  window.addEventListener(evt,e=>{
    const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el&&el.id==='boostBtn') boostBtnPressed=evt==='touchstart';
    if(el&&el.id==='jumpBtn'&&evt==='touchstart'){car.v=cars[currentCar].jump;}
  },{passive:false});
});

// Draw environment
function drawEnvironment(){
  let sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#020205'); sky.addColorStop(1,'#080812');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#fff"; stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));

  ctx.fillStyle="#111133"; mountainsFar.forEach(m=>{m.x=(m.x-speed*0.2+w*2)%(w*2)-w; ctx.fillRect(m.x,m.y,m.w,m.h);});
  ctx.fillStyle="#222244"; mountainsNear.forEach(m=>{m.x=(m.x-speed*0.5+w*2)%(w*2)-w; ctx.fillRect(m.x,m.y,m.w,m.h);});

  ctx.fillStyle="#0a0806"; ctx.fillRect(0,car.ground,w,h-car.ground);
}

// Draw car
function drawCar(){const c=cars[currentCar];ctx.save();ctx.translate(car.x+Math.random()*shake,car.y+Math.random()*shake);let hue=c.colorHue+c.shade;ctx.fillStyle=`hsl(${hue},80%,50%)`;ctx.fillRect(0,8,car.w,24);ctx.fillStyle="#111";ctx.fillRect(22,0,50,18);ctx.fillStyle="#080808";[22,car.w-22].forEach(px=>{ctx.beginPath();ctx.arc(px,car.h-4,15,0,Math.PI*2);ctx.fill();});ctx.restore();}

// Boost effect
function drawBoost(){boostEffect.forEach((b,i)=>{ctx.fillStyle=`rgba(255,${Math.floor(100+Math.random()*155)},0,0.6)`;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-10,b.y+10+Math.random()*10);ctx.lineTo(b.x+10,b.y+10+Math.random()*10);ctx.fill();b.y+=2;if(b.y>h) boostEffect.splice(i,1);});}

// Update
function update(){
  frame++;score+=frame%60===0?1:0;
  shake*=0.9; // decay shake
  const c=cars[currentCar];
  car.v+=car.g;car.y+=car.v;if(car.y+car.h>=car.ground){car.y=car.ground-car.h;car.v=0;}
  car.wheelA+=speed*0.12;
  if(boostBtnPressed) boostEffect.push({x:car.x-10+Math.random()*10,y:car.y+car.h-10});
}

// Crash
function crash(){shake=8;points+=score;setTimeout(()=>shake=0,300);}

// Main loop
function draw(){ctx.clearRect(0,0,w,h);drawEnvironment();drawBoost();drawCar();update();requestAnimationFrame(draw);}
draw();

// Audio (placeholder)
let audioCtx=new (window.AudioContext||window.webkitAudioContext)();
let gainNode=audioCtx.createGain(); gainNode.gain.value=0.3; gainNode.connect(audioCtx.destination);
function playBackgroundTrack(){let osc=audioCtx.createOscillator();osc.frequency.value=220;osc.type='sine';osc.connect(gainNode);osc.start();osc.stop(audioCtx.currentTime+1);}
setInterval(playBackgroundTrack,1000);
</script>
</body>
</html>
