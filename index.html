<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        :root { --squircle: 24px; --glass: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: -apple-system, system-ui, sans-serif; }
        
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }

        @media screen and (orientation: portrait) {
            #stage { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: center; }
        }
        @media screen and (orientation: landscape) {
            #stage { width: 100vw; height: 100vh; }
        }

        #stage { position: relative; overflow: hidden; background: #050510; }
        canvas { width: 100%; height: 100%; display: block; }

        /* UI Elements */
        #ui-top { position: absolute; top: 40px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; color: white; }
        .stats { font-weight: 800; font-size: 22px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        /* Reduced Blur Overlay */
        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        
        /* Liquid Glass Buttons */
        .btn { 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.3);
            border-radius: var(--squircle); color: white; font-weight: 600;
            display: flex; align-items: center; justify-content: center; 
            transition: transform 0.1s; pointer-events: auto; backdrop-filter: blur(5px);
        }
        .btn:active { transform: scale(0.95); }
        
        /* Specific Button Layouts */
        .pause-btn { width: 60px; height: 60px; font-size: 24px; pointer-events: auto; }
        .menu-btn { width: 200px; height: 60px; margin: 10px; }
        
        .control-btns { position: absolute; bottom: 8%; left: 0; width: 100%; display: flex; justify-content: flex-end; padding-right: 50px; gap: 30px; pointer-events: none; }
        .game-btn { width: 110px; height: 110px; border-radius: 35px; font-size: 14px; pointer-events: auto; }

        .hidden { display: none !important; }
        .color-row { display: flex; gap: 10px; margin: 20px; }
        .color-dot { width: 50px; height: 50px; border-radius: 12px; border: 2px solid white; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stage">
            <div id="ui-top">
                <div class="stats" id="scoreDisplay">0</div>
                <div class="btn pause-btn" id="pauseBtn" onclick="togglePause()">II</div>
            </div>

            <div id="startScreen" class="overlay-screen">
                <h1 style="font-size: 48px; margin-bottom: 20px; letter-spacing: -2px;">NIGHT DRIVE</h1>
                <div class="btn menu-btn" onclick="startGame()">START ENGINE</div>
                <div class="btn menu-btn" onclick="openSub('customMenu')">PAINT SHOP</div>
                <div class="btn menu-btn" onclick="openSub('settingsMenu')">SETTINGS</div>
            </div>

            <div id="customMenu" class="overlay-screen hidden">
                <h2>SELECT PAINT</h2>
                <div class="color-row">
                    <div class="color-dot" style="background:#ff3b30;" onclick="setCarColor('#ff3b30')"></div>
                    <div class="color-dot" style="background:#007AFF;" onclick="setCarColor('#007AFF')"></div>
                    <div class="color-dot" style="background:#34c759;" onclick="setCarColor('#34c759')"></div>
                    <div class="color-dot" style="background:#5856d6;" onclick="setCarColor('#5856d6')"></div>
                </div>
                <div class="btn menu-btn" onclick="openSub('startScreen')">BACK</div>
            </div>

            <div id="settingsMenu" class="overlay-screen hidden">
                <h2>MECHANICS</h2>
                <div style="margin:20px;">INITIAL SPEED: <input type="range" id="speedRange" min="4" max="10" value="6"></div>
                <div class="btn menu-btn" onclick="openSub('startScreen')">BACK</div>
            </div>

            <div id="crashScreen" class="overlay-screen hidden">
                <h1 style="color: #ff3b30; font-size: 50px;">CRASHED</h1>
                <p id="finalScore" style="font-size: 20px; margin-bottom: 20px;"></p>
                <div class="btn menu-btn" onclick="startGame()">RETRY</div>
                <div class="btn menu-btn" onclick="openSub('startScreen')">MAIN MENU</div>
            </div>

            <div class="control-btns">
                <div class="btn game-btn" id="boostBtn">BOOST</div>
                <div class="btn game-btn" id="jumpBtn">JUMP</div>
            </div>

            <canvas id="g"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, paused = false, frame = 0;
        let speed = 6, carColor = '#ff3b30', rocks = [];
        
        const car = { x: 100, y: 0, w: 90, h: 36, v: 0, g: 0.5, jump: -12.5, ground: 0, wheelA: 0 };

        function resize() {
            const stage = document.getElementById('stage');
            w = stage.offsetWidth; h = stage.offsetHeight;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.75;
            car.y = car.ground - car.h;
        }

        function openSub(id) {
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function setCarColor(c) { carColor = c; }

        function togglePause() {
            if(over) return;
            paused = !paused;
            if(paused) openSub('startScreen');
            else document.getElementById('startScreen').classList.add('hidden');
        }

        function startGame() {
            speed = parseInt(document.getElementById('speedRange').value);
            score = 0; frame = 0; rocks = []; over = false; paused = false;
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
        }

        function drawCar() {
            ctx.save(); ctx.translate(car.x, car.y);
            // Chassis
            ctx.fillStyle = carColor; ctx.beginPath(); ctx.roundRect(0, 8, car.w, 22, 8); ctx.fill();
            // Cabin
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(22, 0, 46, 16, [12, 12, 0, 0]); ctx.fill();
            // Lights
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-5, 12, 5, 10);
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 12, 5, 10);
            ctx.shadowBlur = 0;
            // Animated Wheels
            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-6); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                for(let i=0; i<5; i++) { ctx.rotate(Math.PI*2/5); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10,0); ctx.stroke(); }
                ctx.restore();
            };
            dw(20); dw(car.w-22);
            ctx.restore();
        }

        function update() {
            if (over || paused) return;
            frame++; if (frame % 60 === 0) score++;
            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) { car.y = car.ground - car.h; car.v = 0; }
            car.wheelA += speed * 0.1;

            if (frame % 140 === 0) rocks.push({x: w, w: 50, h: 30 + Math.random()*28});
            rocks.forEach((o, i) => {
                o.x -= speed;
                if (car.x + 10 < o.x + o.w && car.x + car.w - 10 > o.x && car.y + car.h > car.ground - o.h + 5) die();
                if (o.x + o.w < 0) rocks.splice(i, 1);
            });
            document.getElementById('scoreDisplay').innerText = score;
        }

        function draw() {
            // Sky
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,w,h);
            // Ground
            ctx.fillStyle = '#111'; ctx.fillRect(0, car.ground, w, h-car.ground);
            // Jagged Rocks
            rocks.forEach(o => {
                ctx.fillStyle = '#333'; ctx.beginPath();
                ctx.moveTo(o.x, car.ground);
                ctx.lineTo(o.x + o.w * 0.3, car.ground - o.h);
                ctx.lineTo(o.x + o.w * 0.7, car.ground - o.h * 0.8);
                ctx.lineTo(o.x + o.w, car.ground);
                ctx.fill();
            });
            drawCar(); update(); requestAnimationFrame(draw);
        }

        function die() {
            over = true;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('finalScore').innerText = "SCORE: " + score + " | BEST: " + best;
            openSub('crashScreen');
        }

        // INPUT ENGINE
        const handle = (id, type) => {
            if (id === 'jumpBtn' && type === 'start' && !over && !paused) {
                if (car.y >= car.ground - car.h - 5) car.v = car.jump;
            }
            if (id === 'boostBtn') {
                const bVal = parseInt(document.getElementById('speedRange').value);
                speed = type === 'start' ? bVal * 2 : bVal;
            }
        };

        ['touchstart', 'touchend'].forEach(evt => {
            window.addEventListener(evt, (e) => {
                const t = e.changedTouches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el && el.id) handle(el.id, evt === 'touchstart' ? 'start' : 'end');
            }, {passive: false});
        });

        window.addEventListener('resize', () => setTimeout(resize, 200));
        resize(); draw();
    </script>
</body>
</html>
