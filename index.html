<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            overflow: hidden; background: #000; touch-action: none; 
        }

        /* FORCE HORIZONTAL IF IN PORTRAIT */
        @media screen and (orientation: portrait) {
            #game-container {
                width: 100vh; height: 100vw;
                transform: rotate(90deg);
                transform-origin: bottom left;
                position: absolute; top: -100vw; left: 0;
            }
        }
        
        #game-container { width: 100vw; height: 100vh; position: relative; background: #050510; }
        canvas { display: block; width: 100%; height: 100%; }

        #ui { 
            position: absolute; top: 40px; left: 40px; right: 40px; 
            display: flex; justify-content: space-between; 
            pointer-events: none; z-index: 10; color: #00f2fe; 
            font-family: sans-serif; font-weight: 900; font-size: 24px;
        }

        .controls { 
            position: absolute; bottom: 50px; width: 100%; 
            display: flex; justify-content: space-around; 
            pointer-events: none; z-index: 10; 
        }
        .btn { 
            width: 90px; height: 90px; border-radius: 50%; 
            background: rgba(255,255,255,0.1); border: 2px solid #fff; 
            color: #fff; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; pointer-events: auto; backdrop-filter: blur(10px);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.9); }

        #overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(20px); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; 
            z-index: 100; font-family: sans-serif; 
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui"><div id="s">SCORE: 0</div><div id="h">BEST: 0</div></div>
        <div class="controls">
            <div class="btn" id="jb">JUMP</div>
            <div class="btn" id="bb">BOOST</div>
        </div>
        <div id="overlay">
            <h1 id="ot" style="font-size: 60px; color: #ff0055; text-shadow: 0 0 20px #ff0055;">NIGHT DRIVE</h1>
            <p id="os" style="font-size: 24px; margin: 20px;"></p>
            <button class="btn" style="width:200px; border-radius:15px;" onclick="start()">START ENGINE</button>
        </div>
        <canvas id="g"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, speed = 8, frame = 0, boost = false;
        let obstacles = [], stars = [], particles = [];
        const car = { x: 120, y: 0, w: 110, h: 40, v: 0, g: 0.65, jump: -14, ground: 0, air: false, wheelA: 0 };

        function resize() {
            // Calculate size based on container, not window, to handle rotation
            const rect = canvas.getBoundingClientRect();
            w = rect.width; h = rect.height;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.75; // Ground stays visible on Pro Max
            car.y = car.ground - car.h;
            stars = Array.from({length: 100}, () => ({x: Math.random()*w, y: Math.random()*h*0.6, s: Math.random()*2}));
        }

        let aCtx, engine, gain;
        function initA() {
            if (aCtx) return;
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            engine = aCtx.createOscillator(); gain = aCtx.createGain();
            engine.type = 'sawtooth'; gain.gain.value = 0.04;
            engine.connect(gain); gain.connect(aCtx.destination);
            engine.start();
        }

        function playSound(f, d, v) {
            if(!aCtx) return;
            const o = aCtx.createOscillator(); const g = aCtx.createGain();
            o.frequency.setValueAtTime(f, aCtx.currentTime);
            g.gain.setValueAtTime(v, aCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, aCtx.currentTime + d);
            o.connect(g); g.connect(aCtx.destination);
            o.start(); o.stop(aCtx.currentTime + d);
        }

        function start() {
            initA(); if (aCtx.state === 'suspended') aCtx.resume();
            score = 0; frame = 0; obstacles = []; particles = []; over = false;
            document.getElementById('overlay').style.display = 'none';
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) particles.push({x, y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, l:1, c:color});
        }

        function update() {
            if (over) return;
            frame++; score = Math.floor(frame/10);
            if(engine) engine.frequency.setTargetAtTime(50 + (speed*6), aCtx.currentTime, 0.1);
            
            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) {
                if(car.air) {
                    playSound(100, 0.2, 0.1); // Landing thud
                    spawnParticles(car.x+20, car.ground, 'rgba(255,255,255,0.3)', 8);
                }
                car.y = car.ground - car.h; car.v = 0; car.air = false;
            } else car.air = true;
            
            car.wheelA += speed * 0.08;

            if (frame % 90 === 0) obstacles.push({x: w, w: 60, h: 40 + Math.random()*50});
            obstacles.forEach((o, i) => {
                o.x -= speed;
                if (car.x + 10 < o.x + o.w && car.x + car.w - 10 > o.x && car.y + car.h > car.ground - o.h) die();
                if (o.x + o.w < 0) obstacles.splice(i, 1);
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.l -= 0.02;
                if(p.l <= 0) particles.splice(i, 1);
            });

            if(boost && car.air) spawnParticles(car.x, car.y + 20, '#00f2fe', 1);
            document.getElementById('s').innerText = "SCORE: " + score;
        }

        function draw() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#fff'; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
            
            // Road
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, car.ground, w, h-car.ground);
            ctx.strokeStyle = '#333'; ctx.setLineDash([30, 40]); ctx.lineDashOffset = (frame*speed)%70;
            ctx.beginPath(); ctx.moveTo(0, car.ground+30); ctx.lineTo(w, car.ground+30); ctx.stroke();
            ctx.setLineDash([]);

            // Particles
            particles.forEach(p => { ctx.globalAlpha = p.l; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4,4); });
            ctx.globalAlpha = 1;

            // Rocks
            obstacles.forEach(o => {
                ctx.fillStyle = '#444'; ctx.fillRect(o.x, car.ground - o.h, o.w, o.h);
                ctx.strokeStyle = '#ff0055'; ctx.strokeRect(o.x, car.ground - o.h, o.w, o.h);
            });

            // THE CAR
            ctx.save(); ctx.translate(car.x, car.y);
            ctx.fillStyle = '#111'; ctx.fillRect(0, 5, car.w, car.h-10); // Chassis
            ctx.fillStyle = '#222'; ctx.fillRect(20, -10, 60, 20); // Top
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 10, 5, 12); // Tail
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-5, 10, 5, 12); // Head
            ctx.shadowBlur = 0;
            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-5); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#555'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(10,0); ctx.stroke();
                ctx.restore();
            };
            dw(25); dw(car.w-25);
            ctx.restore();

            update(); requestAnimationFrame(draw);
        }

        function die() {
            over = true; playSound(80, 0.5, 0.2);
            if(gain) gain.gain.value = 0;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('ot').innerText = "CRASHED!";
            document.getElementById('os').innerText = "Score: " + score + " | Best: " + best;
            document.getElementById('overlay').style.display = 'flex';
        }

        window.addEventListener('touchstart', (e) => {
            if(e.target.id === 'bb') { speed = 16; boost = true; }
            else if(!over) { if(!car.air) { car.v = car.jump; playSound(400, 0.2, 0.05); } }
        });
        window.addEventListener('touchend', (e) => { if(e.target.id === 'bb') { speed = 8; boost = false; } });
        window.addEventListener('resize', () => { setTimeout(resize, 100); });
        
        document.getElementById('h').innerText = "BEST: " + best;
        resize(); draw();
    </script>
</body>
</html>
