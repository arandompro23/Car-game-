<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Ultra</title>
    <style>
        :root { --squircle: 24px; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; touch-action: none; 
            -webkit-user-select: none; user-select: none;
        }
        
        #game-container { 
            width: 100vw; height: 100vh; position: relative; 
            display: flex; align-items: center; justify-content: center;
        }

        /* Fixed Horizontal Logic */
        @media screen and (orientation: portrait) {
            #stage {
                width: 100vh; height: 100vw;
                transform: rotate(90deg);
                transform-origin: center;
            }
        }
        @media screen and (orientation: landscape) {
            #stage { width: 100vw; height: 100vh; }
        }

        #stage { position: relative; overflow: hidden; background: #050510; }
        canvas { width: 100%; height: 100%; display: block; }

        /* UI */
        #ui { position: absolute; top: 40px; left: 40px; right: 40px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; color: white; font-family: sans-serif; font-weight: 800; font-size: clamp(16px, 4vw, 24px); }
        
        /* Reduced Blur Overlay */
        .overlay-screen { 
            position: absolute; inset: 0; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 100; font-family: sans-serif;
        }
        
        /* Liquid Glass Buttons */
        .btn { 
            width: 180px; height: 60px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: var(--squircle); color: white; font-weight: 600;
            display: flex; align-items: center; justify-content: center; margin: 10px;
            pointer-events: auto;
        }
        
        .control-btns { 
            position: absolute; bottom: 10%; width: 100%; 
            display: flex; justify-content: space-around; pointer-events: none; 
        }
        .game-btn { 
            width: 100px; height: 100px; border-radius: 30px; 
            pointer-events: auto; backdrop-filter: blur(5px);
            font-size: 14px; text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stage">
            <div id="ui"><div id="scoreDisplay">SCORE: 0</div><div id="bestDisplay">BEST: 0</div></div>

            <div id="startScreen" class="overlay-screen">
                <h1 style="font-size: 40px; margin-bottom: 20px;">NIGHT DRIVE</h1>
                <div class="btn" onclick="startGame()">START ENGINE</div>
            </div>

            <div id="crashScreen" class="overlay-screen hidden">
                <h1 style="color: #ff3b30; font-size: 50px;">CRASHED</h1>
                <p id="finalScoreText" style="font-size: 20px;"></p>
                <div class="btn" onclick="startGame()">RETRY</div>
            </div>

            <div class="control-btns">
                <div class="btn game-btn" id="boostBtn">BOOST</div>
                <div class="btn game-btn" id="jumpBtn">JUMP</div>
            </div>

            <canvas id="g"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w, h, score = 0, best = localStorage.getItem('hb') || 0, over = true, frame = 0;
        let speed = 6, baseSpeed = 6, rocks = [];
        
        const car = { x: 100, y: 0, w: 90, h: 35, v: 0, g: 0.5, jump: -12, ground: 0, wheelA: 0 };

        function resize() {
            const stage = document.getElementById('stage');
            w = stage.offsetWidth; h = stage.offsetHeight;
            canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            car.ground = h * 0.75;
            car.y = car.ground - car.h;
        }

        function startGame() {
            score = 0; frame = 0; rocks = []; over = false; speed = baseSpeed;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('crashScreen').classList.add('hidden');
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            // Chassis
            ctx.fillStyle = '#ff3b30'; ctx.beginPath(); ctx.roundRect(0, 8, car.w, 20, 6); ctx.fill();
            // Cabin
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(20, 0, 45, 15, [10, 10, 0, 0]); ctx.fill();
            // Glowing Lights
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-5, 12, 5, 8);
            ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00'; ctx.fillRect(0, 12, 5, 8);
            ctx.shadowBlur = 0;
            // Rims
            const dw = (x) => {
                ctx.save(); ctx.translate(x, car.h-6); ctx.rotate(car.wheelA);
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#666'; ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0); ctx.stroke();
                ctx.restore();
            };
            dw(20); dw(car.w-20);
            ctx.restore();
        }

        function update() {
            if (over) return;
            frame++;
            if (frame % 60 === 0) score++;
            car.v += car.g; car.y += car.v;
            if (car.y + car.h >= car.ground) { car.y = car.ground - car.h; car.v = 0; }
            car.wheelA += speed * 0.1;

            if (frame % 130 === 0) rocks.push({x: w, w: 45, h: 30 + Math.random()*25});
            rocks.forEach((o, i) => {
                o.x -= speed;
                if (car.x < o.x + o.w && car.x + car.w > o.x && car.y + car.h > car.ground - o.h + 5) die();
                if (o.x + o.w < 0) rocks.splice(i, 1);
            });
            document.getElementById('scoreDisplay').innerText = "SCORE: " + score;
        }

        function draw() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#111'; ctx.fillRect(0, car.ground, w, h-car.ground);
            rocks.forEach(o => {
                ctx.fillStyle = '#444'; ctx.beginPath(); ctx.moveTo(o.x, car.ground); ctx.lineTo(o.x+o.w/2, car.ground-o.h); ctx.lineTo(o.x+o.w, car.ground); ctx.fill();
            });
            drawCar(); update(); requestAnimationFrame(draw);
        }

        function die() {
            over = true;
            if(score > best) { best = score; localStorage.setItem('hb', best); }
            document.getElementById('finalScoreText').innerText = "SCORE: " + score + " | BEST: " + best;
            document.getElementById('bestDisplay').innerText = "BEST: " + best;
            document.getElementById('crashScreen').classList.remove('hidden');
        }

        // UNIVERSAL TOUCH FIX
        const handleTouch = (id, type) => {
            if (id === 'jumpBtn' && type === 'start' && !over) {
                if (car.y >= car.ground - car.h - 5) car.v = car.jump;
            }
            if (id === 'boostBtn') {
                speed = type === 'start' ? baseSpeed * 2 : baseSpeed;
            }
        };

        ['touchstart', 'touchend'].forEach(evtType => {
            window.addEventListener(evtType, (e) => {
                const touch = e.changedTouches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                if (el && el.id) handleTouch(el.id, evtType === 'touchstart' ? 'start' : 'end');
            }, {passive: false});
        });

        window.addEventListener('resize', () => { setTimeout(resize, 200); });
        resize(); draw();
    </script>
</body>
</html>
