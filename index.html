<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Night Drive Pro</title>
    <style>
        :root { --safe-top: env(safe-area-inset-top); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #ui-layer { 
            position: absolute; top: calc(var(--safe-top) + 10px); left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
        }
        .stats { color: #fff; text-shadow: 0 0 10px #00f2fe; font-size: 20px; font-weight: 800; }
        
        .controls { 
            position: absolute; bottom: 40px; width: 100%; display: flex; 
            justify-content: space-around; pointer-events: none; z-index: 10;
        }
        .btn { 
            width: 85px; height: 85px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.4); color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);
            pointer-events: auto; transition: transform 0.1s; -webkit-user-select: none;
        }
        .btn:active { transform: scale(0.9); background: rgba(0,242,254,0.3); }

        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            backdrop-filter: blur(15px); color: white; text-align: center; z-index: 20;
        }
        #overlay h1 { font-size: 48px; margin: 0; color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .score-box { margin: 20px; font-size: 24px; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="stats" id="scoreDisplay">SCORE: 0</div>
        <div class="stats" id="highScoreDisplay">BEST: 0</div>
    </div>
    
    <div class="controls">
        <div class="btn" id="jumpBtn">JUMP</div>
        <div class="btn" id="boostBtn">BOOST</div>
    </div>

    <div id="overlay">
        <h1 id="statusText">NIGHT DRIVE</h1>
        <div class="score-box">
            <div id="finalScore">Tap Start to Race</div>
            <div id="finalBest"></div>
        </div>
        <button class="btn" style="border-radius: 10px; width: 180px;" onclick="startGame()">START ENGINE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, score = 0, highScore = localStorage.getItem('highScore') || 0;
        let isGameOver = true, gameSpeed = 7, frame = 0, isBoosting = false;

        const car = { x: 80, y: 0, w: 95, h: 35, v: 0, g: 0.6, jumpPower: -13, groundY: 0, wheelsAngle: 0, inAir: false };
        let obstacles = [], stars = [], particles = [];

        // --- AUDIO ENGINE ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx, engineOsc, engineGain;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new AudioCtx();
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSound(freq, type, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // --- GAME LOGIC ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            car.groundY = height * 0.8;
            initStars();
        }

        function initStars() {
            stars = [];
            for(let i=0; i<80; i++) stars.push({x: Math.random()*width, y: Math.random()*height*0.6, s: Math.random()*2});
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y, 
                    vx: (Math.random()-0.5)*5, 
                    vy: (Math.random()-0.5)*5, 
                    life: 1, color
                });
            }
        }

        function startGame() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            score = 0; frame = 0; obstacles = []; particles = [];
            isGameOver = false;
            document.getElementById('overlay').style.display = 'none';
        }

        function update() {
            if (isGameOver) return;
            frame++;
            score = Math.floor(frame / 10);
            
            // Engine Pitch
            let pitch = 60 + (gameSpeed * 5);
            if (car.inAir && isBoosting) pitch += 100;
            engineOsc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);

            car.v += car.g;
            car.y += car.v;

            // Landing Logic
            if (car.y + car.h >= car.groundY) {
                if (car.inAir) {
                    playSound(150, 'sine', 0.2, 0.1); // Thud
                    createParticles(car.x + 20, car.groundY, 'rgba(200,200,200,0.5)', 10);
                }
                car.y = car.groundY - car.h;
                car.v = 0;
                car.inAir = false;
            } else {
                car.inAir = true;
            }

            car.wheelsAngle += gameSpeed * 0.05;

            // Spawn obstacles
            if (frame % 120 === 0) obstacles.push({ x: width, w: 50, h: 40 + Math.random()*30 });

            obstacles.forEach((o, i) => {
                o.x -= gameSpeed;
                if (car.x < o.x + o.w && car.x + car.w > o.x && car.y + car.h > car.groundY - o.h) {
                    crash();
                }
                if (o.x + o.w < 0) obstacles.splice(i, 1);
            });

            // Particles update
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            });

            if (isBoosting && car.inAir) createParticles(car.x, car.y + 20, '#00f2fe', 1);

            document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
        }

        function draw() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,width,height);
            
            // Stars
            ctx.fillStyle = "white";
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

            // Road
            ctx.fillStyle = '#111'; ctx.fillRect(0, car.groundY, width, height - car.groundY);
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, car.groundY); ctx.lineTo(width, car.groundY); ctx.stroke();

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            // Obstacles
            obstacles.forEach(o => {
                ctx.fillStyle = '#555'; ctx.fillRect(o.x, car.groundY - o.h, o.w, o.h);
                ctx.strokeStyle = '#ff0055'; ctx.strokeRect(o.x, car.groundY - o.h, o.w, o.h);
            });

            // Draw Detailed Car
            ctx.save();
            ctx.translate(car.x, car.y);
            // Body
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, car.w, car.h-10);
            ctx.fillStyle = '#333'; ctx.fillRect(15, -15, 50, 20); // Cabin
            // Glowing Lights
            ctx.shadowBlur = 15; 
            ctx.fillStyle = '#ff0000'; ctx.shadowColor = '#ff0000'; ctx.fillRect(0, 5, 5, 10); // Tail
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.fillRect(car.w-5, 5, 5, 10); // Head
            ctx.shadowBlur = 0;
            // Rims
            const drawRim = (rx) => {
                ctx.save(); ctx.translate(rx, car.h-5); ctx.rotate(car.wheelsAngle);
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#666'; ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
                ctx.restore();
            };
            drawRim(20); drawRim(car.w-20);
            ctx.restore();

            update();
            requestAnimationFrame(draw);
        }

        function crash() {
            isGameOver = true;
            playSound(100, 'sawtooth', 0.5, 0.2); // Crash
            engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            if (score > highScore) { highScore = score; localStorage.setItem('highScore', highScore); }
            document.getElementById('statusText').innerText = "CRASHED!";
            document.getElementById('finalScore').innerText = `Score: ${score}`;
            document.getElementById('finalBest').innerText = `Best: ${highScore}`;
            document.getElementById('overlay').style.display = 'flex';
        }

        function jump() {
            if (!car.inAir) {
                car.v = car.jumpPower;
                playSound(400, 'sine', 0.2, 0.05);
            }
        }

        // --- INPUTS ---
        window.addEventListener('touchstart', (e) => { 
            if(e.target.id === 'boostBtn') {
                isBoosting = true; gameSpeed = 14;
                if(car.inAir) playSound(600, 'sine', 0.3, 0.1); // Whoosh
            } else if (e.target.id !== 'overlay' && !isGameOver) {
                jump();
            }
        });
        window.addEventListener('touchend', (e) => {
            if(e.target.id === 'boostBtn') { isBoosting = false; gameSpeed = 7; }
        });

        window.addEventListener('resize', resize);
        document.getElementById('highScoreDisplay').innerText = `BEST: ${highScore}`;
        resize(); draw();
    </script>
</body>
</html>
