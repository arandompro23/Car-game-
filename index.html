<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Night Drive Ultra</title>

<style>
  :root{
    --squircle: 28px;
    --glass1: rgba(255,255,255,0.18);
    --glass2: rgba(255,255,255,0.06);
    --stroke: rgba(255,255,255,0.22);
    --stroke2: rgba(255,255,255,0.12);
    --shadow: rgba(0,0,0,0.55);
  }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family:"SF Pro Display",-apple-system,system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }

  #game-container{
    width:100vw; height:100vh;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }

  /* Stage */
  #stage{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
    background:#020205;
  }

  canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none; /* only canvas blocks gestures */
  }

  /* UI Top */
  #ui-top{
    position:absolute;
    top: max(20px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    right:max(16px, env(safe-area-inset-right));
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
    z-index:20;
    color:#fff;
  }

  .stats{
    font-weight:900;
    font-size:28px;
    letter-spacing:-1px;
    font-variant-numeric: tabular-nums;
    text-shadow:0 12px 24px rgba(0,0,0,0.4);
  }

  /* Liquid Glass Buttons */
  .btn{
    pointer-events:auto;
    -webkit-tap-highlight-color: transparent;
    border-radius: 22px;
    border:1px solid var(--stroke);
    background:
      linear-gradient(145deg, var(--glass1), var(--glass2));
    box-shadow:
      0 18px 40px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.25);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    color:#fff;
    font-weight:800;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .18s cubic-bezier(.2,0,.2,1),
                box-shadow .18s cubic-bezier(.2,0,.2,1),
                filter .18s cubic-bezier(.2,0,.2,1);
    position:relative;
    overflow:hidden;
  }

  .btn::before{
    content:"";
    position:absolute; inset:-40%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255,255,255,0.16), transparent 55%);
    transform: rotate(12deg);
    opacity:.75;
    pointer-events:none;
  }

  .btn:active{
    transform: scale(0.96) translateY(2px);
    filter: brightness(1.08);
    box-shadow:
      0 10px 24px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.26),
      inset 0 -1px 0 rgba(0,0,0,0.25);
  }

  .pause-btn{
    width:64px; height:64px;
    border-radius:20px;
    font-size:20px;
    letter-spacing:0;
    font-weight:900;
  }

  /* Overlay screens */
  .overlay-screen{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:100;
    color:#fff;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: opacity .25s ease;
  }

  .hidden{ display:none !important; }

  .menu-btn{
    width:min(320px, 82vw);
    height:64px;
    margin:10px;
    text-transform:uppercase;
    font-size:16px;
  }

  .menu-row{
    display:flex; gap:10px;
    width:min(520px, 92vw);
    justify-content:center;
    flex-wrap:wrap;
    margin-top: 6px;
  }

  .chip{
    width: 150px;
    height: 54px;
    border-radius: 18px;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Controls bottom */
  .control-btns{
    position:absolute;
    bottom: max(5%, env(safe-area-inset-bottom));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding: 0 22px;
    box-sizing:border-box;
    z-index:25;
    pointer-events:none;
  }

  .game-btn{
    width:118px; height:118px;
    border-radius: 40px;
    font-size:15px;
    border:1px solid var(--stroke2);
    pointer-events:auto;
  }

  /* Sliders / selects */
  .panel{
    width:min(560px, 92vw);
    padding: 18px 16px;
    border-radius: 28px;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.25);
    box-shadow: 0 20px 50px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    opacity:.9;
    margin-top:12px;
    letter-spacing:1px;
    font-size:12px;
    text-transform:uppercase;
  }

  input[type="range"], select{
    width:100%;
    margin-top:10px;
    appearance:none;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    outline:none;
    border: 1px solid rgba(255,255,255,0.18);
  }

  input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 2px solid rgba(0,0,0,0.25);
    box-shadow: 0 10px 20px rgba(0,0,0,0.35);
  }

  select{
    height:44px;
    padding: 0 12px;
    color:#fff;
    font-weight:700;
    letter-spacing:0.5px;
  }

  #colorPreview{
    width:100%;
    height:44px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,0.25);
    margin: 12px 0 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .title{
    font-size: 54px;
    font-weight: 950;
    letter-spacing: -1px;
    margin: 0 0 10px;
    text-shadow: 0 18px 50px rgba(0,0,0,0.55);
  }

  .subtitle{
    opacity:.85;
    margin: 0 0 14px;
    font-weight: 700;
  }

  .small{
    opacity:.75;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>

<body>
<div id="game-container">
  <div id="stage">

    <div id="ui-top">
      <div class="stats" id="scoreDisplay">0000</div>
      <button class="btn pause-btn" id="pauseBtn" type="button">II</button>
    </div>

    <!-- MAIN MENU -->
    <div id="startScreen" class="overlay-screen">
      <div style="text-align:center;">
        <div class="title">NIGHT DRIVE</div>
        <div class="subtitle">Ultra • Parallax • Liquid Glass</div>
      </div>

      <button id="continueBtn" class="btn menu-btn hidden" type="button"
              style="background: linear-gradient(145deg, rgba(46,204,113,0.28), rgba(255,255,255,0.06));">
        CONTINUE
      </button>

      <button id="startBtn" class="btn menu-btn" type="button"
              style="background: linear-gradient(145deg, rgba(0,122,255,0.30), rgba(255,255,255,0.06));">
        START ENGINE
      </button>

      <button class="btn menu-btn" id="paintShopBtn" type="button">GARAGE</button>
      <button class="btn menu-btn" id="settingsBtn" type="button">SETTINGS</button>

      <div class="small">Tip: Hold BOOST for speed + flames</div>
    </div>

    <!-- GARAGE / PAINT SHOP -->
    <div id="customMenu" class="overlay-screen hidden">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div>
            <div style="font-weight:950; font-size:24px; letter-spacing:1px;">GARAGE</div>
            <div style="opacity:.75; font-weight:700; font-size:12px;">Choose car • Paint • Drive</div>
          </div>
          <button class="btn" id="garageBackBtn" type="button" style="width:120px; height:48px; border-radius:18px;">
            BACK
          </button>
        </div>

        <div class="menu-row" style="margin-top:14px;">
          <button class="btn chip" id="carSportBtn" type="button">SPORT</button>
          <button class="btn chip" id="carSuvBtn" type="button">SUV</button>
          <button class="btn chip" id="carHatchBtn" type="button">HATCH</button>
        </div>

        <div id="colorPreview"></div>

        <label><span>COLOR</span><span id="shadeVal">50%</span></label>
        <input type="range" id="shadeSlider" min="10" max="90" value="50" />

        <label><span>HUE</span><span id="hueVal">200°</span></label>
        <input type="range" id="hueSlider" min="0" max="360" value="200" />

        <button class="btn menu-btn" id="garageDoneBtn" type="button"
                style="margin:14px 0 0; width:100%; height:58px;">
          DONE
        </button>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="settingsMenu" class="overlay-screen hidden">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div style="font-weight:950; font-size:24px;">SETTINGS</div>
          <button class="btn" id="settingsBackBtn" type="button" style="width:120px; height:48px; border-radius:18px;">
            BACK
          </button>
        </div>

        <label><span>BASE SPEED</span><span id="speedVal">8</span></label>
        <input type="range" id="speedRange" min="7" max="14" value="9" />

        <label><span>WEATHER</span><span></span></label>
        <select id="weatherSelect">
          <option value="dynamic">DYNAMIC</option>
          <option value="clear">CLEAR</option>
          <option value="rain">RAIN</option>
          <option value="snow">SNOW</option>
        </select>

        <button class="btn menu-btn" id="settingsSaveBtn" type="button"
                style="margin:14px 0 0; width:100%; height:58px;">
          SAVE
        </button>
      </div>
    </div>

    <!-- CRASH -->
    <div id="crashScreen" class="overlay-screen hidden">
      <div style="text-align:center;">
        <div style="color:#ff3b30; font-size:60px; font-weight:950; letter-spacing:-1px;">CRASHED</div>
        <p id="finalScore" style="font-size:22px; margin:16px 0 22px; font-weight:800;"></p>
        <button class="btn menu-btn" id="retryBtn" type="button"
                style="background: linear-gradient(145deg, rgba(0,122,255,0.30), rgba(255,255,255,0.06));">
          RETRY
        </button>
        <button class="btn menu-btn" id="garageBtn" type="button">GARAGE</button>
      </div>
    </div>

    <div class="control-btns">
      <button class="btn game-btn" id="boostBtn" type="button">BOOST</button>
      <button class="btn game-btn" id="jumpBtn" type="button">JUMP</button>
    </div>

    <canvas id="g"></canvas>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('g');
  const ctx = canvas.getContext('2d');

  // ---------- State ----------
  let w=0, h=0, dpr=1;
  let score=0;
  let best = Number(localStorage.getItem('hb') || 0);
  let over=true, paused=false;
  let frame=0;

  // tuned speed (no slow motion)
  let baseSpeed=9;
  let speed=baseSpeed;
  let boostHeld=false;

  // paint
  let carHue=200;
  let carShade=50; // 10..90
  let carModel='sport'; // sport | suv | hatch

  // world
  let rocks=[];        // now "wrecks"
  let stars=[];
  let particles=[];
  let clouds=[];
  let speedLines=[];

  // weather
  let weatherTarget='clear', snowLvl=0, rainLvl=0;
  let weatherTimer=0, lightning=0, thunderQueued=0;

  const car = {
    x: 0, y: 0, w: 100, h: 42,
    v: 0, g: 0.62,
    jump: -14.2,
    ground: 0,
    wheelA: 0
  };

  // ---------- Audio (lo-fi loop + sfx) ----------
  let audioCtx, mainGain, musicGain;
  let musicOn = false;

  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    mainGain = audioCtx.createGain();
    mainGain.gain.value = 0.55;
    mainGain.connect(audioCtx.destination);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.0;
    musicGain.connect(mainGain);

    startLofi();
  }

  function startLofi(){
    if(musicOn) return;
    musicOn = true;

    // Lo-fi: soft chord pad + sub bass pulse
    const now = audioCtx.currentTime;

    const pad = audioCtx.createOscillator();
    const pad2 = audioCtx.createOscillator();
    const pad3 = audioCtx.createOscillator();
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 650;

    pad.type='sine'; pad2.type='triangle'; pad3.type='sine';
    pad.frequency.value = 220;
    pad2.frequency.value = 277.18;
    pad3.frequency.value = 329.63;

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.type='sine'; lfo.frequency.value = 0.10;
    lfoGain.gain.value = 0.25;
    lfo.connect(lfoGain);
    lfoGain.connect(musicGain.gain);

    const padGain = audioCtx.createGain();
    padGain.gain.value = 0.16;

    pad.connect(padGain); pad2.connect(padGain); pad3.connect(padGain);
    padGain.connect(filt); filt.connect(musicGain);

    // subtle noise crackle
    const bufferSize = 2 * audioCtx.sampleRate;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      output[i] = (Math.random()*2-1) * 0.05;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    const noiseFilt = audioCtx.createBiquadFilter();
    noiseFilt.type = 'highpass';
    noiseFilt.frequency.value = 1800;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.08;
    noise.connect(noiseFilt); noiseFilt.connect(noiseGain); noiseGain.connect(musicGain);

    // bass pulse
    const bass = audioCtx.createOscillator();
    bass.type='sine';
    const bassGain = audioCtx.createGain();
    bassGain.gain.value = 0.0;
    bass.connect(bassGain); bassGain.connect(musicGain);

    // start
    pad.start(now); pad2.start(now); pad3.start(now);
    lfo.start(now);
    noise.start(now);
    bass.start(now);

    // pattern
    const chords = [
      [220, 277.18, 329.63], // Am
      [196, 246.94, 293.66], // G
      [174.61, 220, 261.63], // F
      [196, 246.94, 293.66], // G
    ];

    let step=0;
    setInterval(() => {
      if(!audioCtx || over || paused) return;

      const c = chords[step % chords.length];
      const t = audioCtx.currentTime;

      pad.frequency.setTargetAtTime(c[0], t, 0.05);
      pad2.frequency.setTargetAtTime(c[1], t, 0.05);
      pad3.frequency.setTargetAtTime(c[2], t, 0.05);

      // bass hit
      bass.frequency.setValueAtTime(c[0]/2, t);
      bassGain.gain.cancelScheduledValues(t);
      bassGain.gain.setValueAtTime(0.0, t);
      bassGain.gain.linearRampToValueAtTime(0.18, t+0.03);
      bassGain.gain.linearRampToValueAtTime(0.0, t+0.22);

      step++;
    }, 900);

    // fade in music
    musicGain.gain.setTargetAtTime(0.35, audioCtx.currentTime, 0.6);
  }

  function playSfx(freq, type, dur, vol){
    if(!audioCtx || paused) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(mainGain);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }

  function playThunder(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(40, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
    g.gain.setValueAtTime(0.22, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
    osc.connect(g); g.connect(mainGain);
    osc.start(); osc.stop(audioCtx.currentTime + 1.5);
  }

  // ---------- Helpers ----------
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  function lerp(a,b,t){ return a + (b-a)*t; }

  function lerpColor(a,b,t){
    const ah = parseInt(a.replace('#',''),16), bh = parseInt(b.replace('#',''),16);
    const ar=ah>>16, ag=(ah>>8)&255, ab=ah&255;
    const br=bh>>16, bg=(bh>>8)&255, bb=bh&255;
    const rr = (ar + t*(br-ar))|0;
    const rg = (ag + t*(bg-ag))|0;
    const rb = (ab + t*(bb-ab))|0;
    return '#' + ((1<<24) + (rr<<16) + (rg<<8) + rb).toString(16).slice(1);
  }

  function roundRectPath(x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  // ---------- Init world ----------
  function initStars(){
    stars = Array.from({length: 120}, () => ({
      x: Math.random()*w,
      y: Math.random()*h*0.55,
      s: Math.random()*1.6,
      o: 0.25 + Math.random()*0.75
    }));
  }

  function initClouds(){
    clouds = Array.from({length: 6}, () => ({
      x: Math.random()*w,
      y: Math.random()*h*0.26,
      w: 220 + Math.random()*240,
      s: 0.18 + Math.random()*0.28
    }));
  }

  function initSpeedLines(){
    speedLines = Array.from({length: 14}, () => ({
      x: Math.random()*w,
      y: Math.random()*h*0.8,
      len: 80 + Math.random()*220,
      a: 0.06 + Math.random()*0.12,
      s: 1.0 + Math.random()*2.2
    }));
  }

  // ---------- Resize (FIXED UI SHIFT BUG) ----------
  function resize(){
    const stage = document.getElementById('stage');
    w = stage.clientWidth;
    h = stage.clientHeight;

    dpr = Math.min(2.2, window.devicePixelRatio || 1);

    // IMPORTANT: reset transform before scaling (this fixes periodic drifting)
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    car.ground = h * 0.78;
    car.x = w * 0.22;
    car.y = car.ground - car.h;

    initStars();
    initClouds();
    initSpeedLines();
  }

  // ---------- Weather ----------
  function updateWeather(){
    const mode = document.getElementById('weatherSelect').value;
    weatherTimer++;

    if(mode === 'dynamic' && weatherTimer > 900){
      const choices=['clear','rain','snow'];
      weatherTarget = choices[(Math.random()*choices.length)|0];
      weatherTimer=0;
    } else if(mode !== 'dynamic'){
      weatherTarget = mode;
    }

    snowLvl = (weatherTarget==='snow') ? Math.min(1, snowLvl + 0.005) : Math.max(0, snowLvl - 0.005);
    rainLvl = (weatherTarget==='rain') ? Math.min(1, rainLvl + 0.005) : Math.max(0, rainLvl - 0.005);

    if(rainLvl > 0.82 && Math.random() < 0.005){
      lightning = 1;
      thunderQueued = 40;
    }
    if(lightning > 0) lightning -= 0.1;
    if(thunderQueued > 0 && --thunderQueued === 1) playThunder();

    if(frame % 2 === 0){
      if(rainLvl > 0.1) particles.push({x:Math.random()*w,y:-10,vy:16+Math.random()*6,vx:-2,type:'rain',s:2,op:rainLvl});
      if(snowLvl > 0.1) particles.push({x:Math.random()*w,y:-10,vy:2+Math.random()*2,vx:Math.sin(frame/22)*2,type:'snow',s:2+Math.random()*4,op:snowLvl});
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.y += p.vy;
      p.x += p.vx;
      if(p.y > h+20) particles.splice(i,1);
    }

    for(const c of clouds){
      c.x -= c.s;
      if(c.x < -c.w) c.x = w + c.w;
    }
  }

  // ---------- Parallax mountains ----------
  function drawMountains(){
    const baseY = h*0.72;

    const layers = [
      { y: baseY-200, amp: 120, col: lerpColor('#0b0b14','#10101b', rainLvl), sp: 0.18, a: 0.60 },
      { y: baseY-120, amp: 90,  col: lerpColor('#0e0e1a','#141422', rainLvl), sp: 0.28, a: 0.75 },
      { y: baseY-40,  amp: 60,  col: lerpColor('#121223','#1a1a2c', rainLvl), sp: 0.42, a: 0.92 },
    ];

    for(let li=0; li<layers.length; li++){
      const L = layers[li];
      const shift = (frame * speed * L.sp) % (w*1.5);

      ctx.save();
      ctx.globalAlpha = L.a;

      ctx.fillStyle = L.col;
      ctx.beginPath();
      ctx.moveTo(-50, h);
      ctx.lineTo(-50, L.y);

      // procedural peaks
      const step = 120;
      for(let x=-50; x<=w+200; x+=step){
        const nx = x + shift;
        const peak = Math.sin((nx)*0.004 + li)*0.55 + Math.sin((nx)*0.0016)*0.45;
        const yy = L.y - peak*L.amp - (Math.sin(nx*0.0022)*0.25+0.25)*L.amp*0.35;
        ctx.lineTo(x, yy);
      }

      ctx.lineTo(w+250, L.y+20);
      ctx.lineTo(w+250, h);
      ctx.closePath();
      ctx.fill();

      // snow tint
      if(snowLvl>0.05){
        ctx.globalAlpha = L.a * snowLvl * 0.7;
        ctx.fillStyle = 'rgba(240,245,255,0.7)';
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // ---------- Environment ----------
  function drawEnvironment(){
    const skyBase = lerpColor('#020205', '#080812', rainLvl);
    const skyTop  = lerpColor('#0a0a1a', '#1a1a25', rainLvl);

    const sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0, skyBase);
    sky.addColorStop(1, skyTop);
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,w,h);

    // stars
    ctx.globalAlpha = 1 - rainLvl;
    ctx.fillStyle="#fff";
    for(const s of stars){
      ctx.globalAlpha = (1-rainLvl) * s.o;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // moon
    const time = Date.now()/60000;
    const phase = (time%1)*2-1;
    ctx.save();
    ctx.translate(w*0.82, h*0.16);
    ctx.globalAlpha = 1 - (rainLvl*0.85);
    ctx.fillStyle="#fffde7";
    ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(phase*38, 0, 34, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;

    // clouds
    for(const c of clouds){
      ctx.globalAlpha = 0.08 + (rainLvl*0.5);
      ctx.fillStyle="rgba(20,20,30,0.45)";
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w, c.w/3.2, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    // lightning flash
    if(lightning>0){
      ctx.fillStyle=`rgba(255,255,255,${lightning*0.35})`;
      ctx.fillRect(0,0,w,h);
    }

    // mountains
    drawMountains();

    // ground
    const groundBase = lerpColor('#0a0806', '#eef2ff', snowLvl);
    ctx.fillStyle = groundBase;
    ctx.fillRect(0, car.ground, w, h-car.ground);
  }

  // ---------- Car paint ----------
  function getCarPaint(){
    // carShade is like brightness/lightness
    const L = carShade;
    return `hsl(${carHue}, 85%, ${L}%)`;
  }

  // ---------- Car models (3) ----------
  function drawWheel(cx, cy, r, spin){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin);

    // tyre
    ctx.fillStyle = '#070707';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // rim
    ctx.fillStyle = '#dfe6ee';
    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,Math.PI*2); ctx.fill();

    // spokes
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 2;
    for(let i=0;i<6;i++){
      ctx.rotate(Math.PI*2/6);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(r*0.62, 0);
      ctx.stroke();
    }

    // hub
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(0,0,r*0.18,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawSportCar(){
    const paint = getCarPaint();

    // body
    ctx.fillStyle = paint;
    ctx.beginPath();
    ctx.moveTo(6, 26);
    ctx.lineTo(18, 18);
    ctx.quadraticCurveTo(34, 6, 54, 6);
    ctx.lineTo(74, 6);
    ctx.quadraticCurveTo(88, 7, 96, 16);
    ctx.lineTo(102, 22);
    ctx.quadraticCurveTo(106, 26, 104, 30);
    ctx.lineTo(98, 36);
    ctx.lineTo(12, 36);
    ctx.quadraticCurveTo(6, 34, 6, 26);
    ctx.closePath();
    ctx.fill();

    // side skirt
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRectPath(12, 32, 88, 6, 4);
    ctx.fill();

    // windows
    ctx.fillStyle = 'rgba(10,14,20,0.92)';
    ctx.beginPath();
    ctx.moveTo(36, 10);
    ctx.lineTo(72, 10);
    ctx.quadraticCurveTo(84, 12, 90, 18);
    ctx.lineTo(60, 18);
    ctx.quadraticCurveTo(48, 18, 36, 10);
    ctx.closePath();
    ctx.fill();

    // highlights
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(18, 22);
    ctx.quadraticCurveTo(52, 8, 92, 18);
    ctx.quadraticCurveTo(70, 16, 18, 26);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // lights
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRectPath(98, 20, 6, 8, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    roundRectPath(6, 20, 6, 8, 3); ctx.fill();

    // wheels
    drawWheel(28, 36, 14, car.wheelA);
    drawWheel(82, 36, 14, car.wheelA);
  }

  function drawSuv(){
    const paint = getCarPaint();

    // body (BMW X5-ish simplified)
    ctx.fillStyle = paint;
    ctx.beginPath();
    ctx.moveTo(8, 28);
    ctx.lineTo(16, 16);
    ctx.quadraticCurveTo(22, 10, 34, 10);
    ctx.lineTo(70, 10);
    ctx.quadraticCurveTo(88, 10, 98, 18);
    ctx.lineTo(106, 24);
    ctx.quadraticCurveTo(110, 28, 108, 34);
    ctx.lineTo(104, 40);
    ctx.lineTo(12, 40);
    ctx.quadraticCurveTo(8, 38, 8, 28);
    ctx.closePath();
    ctx.fill();

    // roofline + pillars
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRectPath(18, 14, 78, 18, 10); ctx.fill();

    // windows
    ctx.fillStyle = 'rgba(10,14,20,0.92)';
    roundRectPath(22, 15, 70, 16, 8); ctx.fill();

    // grille hint
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRectPath(98, 24, 8, 10, 4); ctx.fill();

    // lights
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRectPath(104, 26, 5, 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    roundRectPath(8, 26, 5, 9, 3); ctx.fill();

    // wheels bigger
    drawWheel(30, 40, 15, car.wheelA);
    drawWheel(86, 40, 15, car.wheelA);
  }

  function drawHatch(){
    const paint = getCarPaint();

    ctx.fillStyle = paint;
    ctx.beginPath();
    ctx.moveTo(8, 28);
    ctx.lineTo(18, 18);
    ctx.quadraticCurveTo(26, 10, 38, 10);
    ctx.lineTo(72, 10);
    ctx.quadraticCurveTo(86, 12, 94, 20);
    ctx.lineTo(104, 28);
    ctx.quadraticCurveTo(108, 32, 104, 36);
    ctx.lineTo(98, 40);
    ctx.lineTo(12, 40);
    ctx.quadraticCurveTo(8, 38, 8, 28);
    ctx.closePath();
    ctx.fill();

    // windows
    ctx.fillStyle = 'rgba(10,14,20,0.92)';
    ctx.beginPath();
    ctx.moveTo(32, 14);
    ctx.lineTo(70, 14);
    ctx.quadraticCurveTo(82, 16, 90, 24);
    ctx.lineTo(60, 24);
    ctx.quadraticCurveTo(44, 24, 32, 14);
    ctx.closePath();
    ctx.fill();

    // lights
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRectPath(98, 26, 6, 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    roundRectPath(8, 26, 6, 9, 3); ctx.fill();

    // wheels
    drawWheel(30, 40, 14, car.wheelA);
    drawWheel(82, 40, 14, car.wheelA);
  }

  function drawCar(){
    ctx.save();
    ctx.translate(car.x, car.y);

    // scale by model
    if(carModel==='sport'){
      car.w=110; car.h=42;
      drawSportCar();
    } else if(carModel==='suv'){
      car.w=118; car.h=48;
      drawSuv();
    } else {
      car.w=112; car.h=46;
      drawHatch();
    }

    // boost exhaust flame (back left)
    if(boostHeld && !over && !paused){
      const flameX = 2;
      const flameY = car.h - 18;
      const t = (Math.sin(frame*0.6)*0.5+0.5);
      const len = 22 + t*14;

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.translate(flameX, flameY);
      ctx.rotate(Math.sin(frame*0.25)*0.06);

      const grad = ctx.createLinearGradient(0,0,-len,0);
      grad.addColorStop(0,'rgba(255,255,255,0.95)');
      grad.addColorStop(0.2,'rgba(255,200,80,0.95)');
      grad.addColorStop(0.6,'rgba(255,80,40,0.75)');
      grad.addColorStop(1,'rgba(255,40,10,0.0)');
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-len*0.6, -6, -len, 0);
      ctx.quadraticCurveTo(-len*0.6, 6, 0, 0);
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- Wreck obstacles (destroyed cars) ----------
  function spawnWreck(){
    const type = ['wreckSport','wreckSedan','wreckSuv'][(Math.random()*3)|0];
    const ww = 120 + Math.random()*60;
    const hh = 48 + Math.random()*18;
    rocks.push({
      x: w + 80,
      w: ww,
      h: hh,
      type,
      burn: Math.random() < 0.25,
      dmg: 0.35 + Math.random()*0.65
    });
  }

  function drawWreck(o){
    const x=o.x, y=car.ground;
    const top = y - o.h;

    // base body
    ctx.save();
    ctx.translate(x, top);

    const soot = o.dmg;
    const bodyCol = lerpColor('#2a2a2a', '#0f0f10', soot);
    const glassCol = 'rgba(10,12,14,0.65)';
    const rimCol = lerpColor('#cfd7df', '#2a2a2a', soot);

    // shape (damaged car silhouette)
    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.moveTo(6, o.h*0.65);
    ctx.lineTo(18, o.h*0.35);
    ctx.quadraticCurveTo(o.w*0.35, 4, o.w*0.55, 6);
    ctx.lineTo(o.w*0.78, 10);
    ctx.quadraticCurveTo(o.w*0.95, o.h*0.22, o.w-6, o.h*0.52);
    ctx.lineTo(o.w-10, o.h*0.85);
    ctx.lineTo(10, o.h*0.85);
    ctx.quadraticCurveTo(2, o.h*0.82, 6, o.h*0.65);
    ctx.closePath();
    ctx.fill();

    // crushed roof dents
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(o.w*0.48, o.h*0.30, o.w*0.18, o.h*0.14, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // broken windows
    ctx.fillStyle = glassCol;
    ctx.beginPath();
    ctx.moveTo(o.w*0.28, o.h*0.34);
    ctx.lineTo(o.w*0.62, o.h*0.30);
    ctx.lineTo(o.w*0.70, o.h*0.48);
    ctx.lineTo(o.w*0.36, o.h*0.52);
    ctx.closePath();
    ctx.fill();

    // window cracks
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    for(let i=0;i<6;i++){
      const sx = o.w*(0.35 + Math.random()*0.25);
      const sy = o.h*(0.34 + Math.random()*0.12);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + (Math.random()*30-15), sy + (Math.random()*20+10));
      ctx.stroke();
    }

    // wheels (damaged)
    const wheelY = o.h*0.85;
    const r = 12;
    function wreckWheel(cx){
      ctx.save();
      ctx.translate(cx, wheelY);
      ctx.rotate(frame*0.02);
      ctx.fillStyle = '#050505';
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = rimCol;
      ctx.beginPath(); ctx.arc(0,0,r*0.62,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 2;
      for(let i=0;i<5;i++){
        ctx.rotate(Math.PI*2/5);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r*0.62,0); ctx.stroke();
      }
      // missing chunks
      ctx.globalAlpha = 0.35 + soot*0.4;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0,0,r*0.7, -0.6, 0.4);
      ctx.lineTo(0,0);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha=1;
    }
    wreckWheel(o.w*0.28);
    wreckWheel(o.w*0.74);

    // burnt gradient
    const burnGrad = ctx.createLinearGradient(0,0,o.w,0);
    burnGrad.addColorStop(0,'rgba(0,0,0,0.0)');
    burnGrad.addColorStop(0.5,`rgba(0,0,0,${0.25 + soot*0.35})`);
    burnGrad.addColorStop(1,`rgba(0,0,0,${0.45 + soot*0.45})`);
    ctx.fillStyle = burnGrad;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0,0,o.w,o.h);
    ctx.globalAlpha = 1;

    // fire
    if(o.burn && rainLvl < 0.65){
      const fx = o.w*0.55;
      const fy = o.h*0.22;
      const t = (Math.sin(frame*0.35)+1)*0.5;
      const fh = 18 + t*16;

      ctx.save();
      ctx.translate(fx, fy);
      ctx.globalAlpha = 0.95;

      const g = ctx.createLinearGradient(0,0,0,fh);
      g.addColorStop(0,'rgba(255,255,255,0.95)');
      g.addColorStop(0.25,'rgba(255,220,120,0.95)');
      g.addColorStop(0.6,'rgba(255,110,40,0.85)');
      g.addColorStop(1,'rgba(255,40,10,0.0)');
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(-10, fh*0.35, 0, fh);
      ctx.quadraticCurveTo(10, fh*0.35, 0, 0);
      ctx.fill();

      // smoke
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.beginPath();
      ctx.ellipse(0, -10, 18+t*10, 10+t*6, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
      ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  // ---------- Speed lines ----------
  function drawSpeedLines(){
    if(over || paused) return;
    const intensity = boostHeld ? 1 : 0.55;

    ctx.save();
    ctx.globalAlpha = 0.22 * intensity;
    ctx.fillStyle = '#fff';

    for(const L of speedLines){
      L.x -= speed * (2.2 + L.s*0.8);
      if(L.x < -L.len-20){
        L.x = w + Math.random()*w*0.3;
        L.y = Math.random()*h*0.75;
        L.len = 140 + Math.random()*260;
      }
      ctx.globalAlpha = L.a * intensity;
      ctx.fillRect(L.x, L.y, L.len, 2);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- Update ----------
  function die(){
    over=true;
    playSfx(50,'square',0.45,0.28);

    document.getElementById('finalScore').innerText =
      `DISTANCE: ${score}m | RECORD: ${best}m`;

    if(score > best){
      best = score;
      localStorage.setItem('hb', best);
    }

    openSub('crashScreen');
  }

  function update(){
    if(over || paused) return;

    frame++;

    // score
    if(frame % 60 === 0) score++;

    // speed
    speed = baseSpeed * (boostHeld ? 1.75 : 1.0);

    // physics
    car.v += car.g;
    car.y += car.v;
    if(car.y + car.h >= car.ground){
      car.y = car.ground - car.h;
      car.v = 0;
    }

    car.wheelA += speed * 0.12;

    // spawn wrecks
    if(frame % 140 === 0) spawnWreck();

    // move wrecks + collision
    for(let i=rocks.length-1;i>=0;i--){
      const o = rocks[i];
      o.x -= speed;

      // collision box (a bit forgiving)
      const carLeft = car.x + 14;
      const carRight = car.x + car.w - 14;
      const obsLeft = o.x + 6;
      const obsRight = o.x + o.w - 6;
      const obsTop = car.ground - o.h + 10;

      if(carRight > obsLeft && carLeft < obsRight && (car.y + car.h) > obsTop){
        die();
      }

      if(o.x + o.w < -160) rocks.splice(i,1);
    }

    updateWeather();

    document.getElementById('scoreDisplay').innerText =
      String(score).padStart(4,'0');
  }

  // ---------- Draw ----------
  function draw(){
    drawEnvironment();

    // speed lines across screen
    drawSpeedLines();

    // wrecks
    for(const o of rocks) drawWreck(o);

    // particles
    for(const p of particles){
      ctx.globalAlpha = p.op;
      ctx.fillStyle = p.type==='rain' ? '#7af' : '#fff';
      ctx.fillRect(p.x, p.y, (p.type==='rain'?1:p.s), p.s);
    }
    ctx.globalAlpha = 1;

    // car
    drawCar();

    update();
    requestAnimationFrame(draw);
  }

  // ---------- UI / Navigation ----------
  function openSub(id){
    document.querySelectorAll('.overlay-screen').forEach(s => s.classList.add('hidden'));
    if(id !== 'none') document.getElementById(id).classList.remove('hidden');
  }

  function togglePause(){
    if(over) return;
    paused = !paused;

    if(paused){
      openSub('startScreen');
      document.getElementById('continueBtn').classList.remove('hidden');
      document.getElementById('startBtn').classList.add('hidden');
    } else {
      openSub('none');
    }
  }

  function startGame(){
    initAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    baseSpeed = parseInt(document.getElementById('speedRange').value, 10);
    speed = baseSpeed;

    score=0;
    frame=0;
    rocks=[];
    particles=[];
    over=false;
    paused=false;
    boostHeld=false;

    openSub('none');
  }

  function resetToMainMenu(){
    paused=false;
    over=true;
    openSub('startScreen');
    document.getElementById('continueBtn').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
  }

  // ---------- Paint shop ----------
  function updatePaintUI(){
    document.getElementById('hueVal').innerText = `${carHue}°`;
    document.getElementById('shadeVal').innerText = `${carShade}%`;
    document.getElementById('colorPreview').style.background = getCarPaint();
  }

  // ---------- Controls ----------
  function jump(){
    if(over || paused) return;
    if(car.y >= car.ground - car.h - 5){
      car.v = car.jump;
      playSfx(320,'triangle',0.15,0.12);
    }
  }

  function setBoost(on){
    if(over || paused) return;
    boostHeld = on;
    if(on) playSfx(110,'sawtooth',0.12,0.10);
  }

  // ---------- Bind events (FIXED: no elementFromPoint) ----------
  function bind(){
    // pause
    document.getElementById('pauseBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); togglePause(); });

    // menu
    document.getElementById('startBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); startGame(); });
    document.getElementById('continueBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); togglePause(); });

    document.getElementById('paintShopBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('customMenu'); });
    document.getElementById('settingsBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('settingsMenu'); });

    // garage nav
    document.getElementById('garageBackBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });
    document.getElementById('garageDoneBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });

    // settings nav
    document.getElementById('settingsBackBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });
    document.getElementById('settingsSaveBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); openSub('startScreen'); });

    // crash
    document.getElementById('retryBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); startGame(); });
    document.getElementById('garageBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); resetToMainMenu(); });

    // car model buttons
    document.getElementById('carSportBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); carModel='sport'; playSfx(520,'sine',0.08,0.08); });
    document.getElementById('carSuvBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); carModel='suv'; playSfx(520,'sine',0.08,0.08); });
    document.getElementById('carHatchBtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); carModel='hatch'; playSfx(520,'sine',0.08,0.08); });

    // sliders
    const hueSlider = document.getElementById('hueSlider');
    const shadeSlider = document.getElementById('shadeSlider');

    hueSlider.addEventListener('input', ()=>{
      carHue = parseInt(hueSlider.value,10);
      updatePaintUI();
    });

    shadeSlider.addEventListener('input', ()=>{
      carShade = parseInt(shadeSlider.value,10);
      updatePaintUI();
    });

    // base speed label
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    speedRange.addEventListener('input', ()=>{
      speedVal.innerText = speedRange.value;
    });

    // controls
    const jumpBtn = document.getElementById('jumpBtn');
    const boostBtn = document.getElementById('boostBtn');

    jumpBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); jump(); });

    boostBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); setBoost(true); });
    boostBtn.addEventListener('pointerup',   (e)=>{ e.preventDefault(); setBoost(false); });
    boostBtn.addEventListener('pointercancel',(e)=>{ e.preventDefault(); setBoost(false); });
    boostBtn.addEventListener('pointerleave',(e)=>{ e.preventDefault(); setBoost(false); });

    // keyboard (desktop)
    window.addEventListener('keydown', (e)=>{
      if(e.key===' '){ e.preventDefault(); jump(); }
      if(e.key==='Shift') setBoost(true);
      if(e.key==='Escape'){
        if(!over){
          togglePause();
        } else {
          openSub('startScreen');
        }
      }
    });
    window.addEventListener('keyup', (e)=>{
      if(e.key==='Shift') setBoost(false);
    });

    // prevent page scrolling on canvas only
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
  }

  // ---------- Boot ----------
  function boot(){
    bind();
    updatePaintUI();
    document.getElementById('speedVal').innerText = document.getElementById('speedRange').value;

    resize();
    window.addEventListener('resize', ()=>{ resize(); });
    draw();
  }

  boot();
})();
</script>
</body>
